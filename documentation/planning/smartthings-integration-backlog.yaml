# ============================================================================
# SUCCESS METRICS
# ============================================================================

success_metrics:
  functional:
    - metric: "Webhook success rate"
      target: ">99.9%"
      measurement: "Successful webhook processing / total webhooks"

    - metric: "Event translation accuracy"
      target: "100%"
      measurement: "Correctly translated events / total events"

    - metric: "Device command success rate"
      target: ">99%"
      measurement: "Successful commands / total commands"

  non_functional:
    - metric: "Event processing latency (p99)"
      target: "<500ms"
      measurement: "Time from webhook receipt to internal event publication"

    - metric: "Throughput"
      target: ">100 events/second"
      measurement: "Events processed per second under load"

    - metric: "Test coverage"
      target: ">90%"
      measurement: "Lines covered / total lines"

  user_experience:
    - metric: "OAuth setup time"
      target: "<2 minutes"
      measurement: "Time to complete OAuth flow"

    - metric: "Device command latency"
      target: "<2 seconds"
      measurement: "Time from command request to execution"

