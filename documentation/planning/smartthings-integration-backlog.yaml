# RISK REGISTER
# ============================================================================

risks:
  - id: RISK-001
    description: "SmartThings API changes unexpectedly"
    severity: medium
    probability: low
    mitigation: "Version API calls, monitor SmartThings changelog"
    owner: "Engineering"

  - id: RISK-002
    description: "OAuth token expiration causes service disruption"
    severity: high
    probability: medium
    mitigation: "Auto-refresh with 5min buffer, alerting on refresh failures"
    owner: "Engineering"

  - id: RISK-003
    description: "Event flooding from chatty devices"
    severity: medium
    probability: medium
    mitigation: "Implement filtering and rate limiting"
    owner: "Engineering"

  - id: RISK-004
    description: "SmartThings test account not available in time"
    severity: medium
    probability: low
    mitigation: "Set up account early, use mock server for initial tests"
    owner: "QA"
