services:
  test-from-main-with-warning:
    build:
      context: .
      dockerfile: Dockerfile.test-from-main-with-warning
    ports:
      - "${TEST_FROM_MAIN_WITH_WARNING_HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=local
      - BITBRAT_ENV=local
      - PORT=3000
    env_file:
      - .env.brat
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - bitbrat-network

networks:
  bitbrat-network:
    external: true
