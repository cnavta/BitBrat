services:
  context-pack:
    build:
      context: ../..  # Sprint 375: Build context is repository root (for Dockerfile.base/Dockerfile.service)
      dockerfile: Dockerfile.service
      args:
        BASE_IMAGE: bitbrat-base:${BITBRAT_VERSION:-latest}  # Sprint 375: Use shared base image
        SERVICE_NAME: context-pack
        SERVICE_ENTRY: dist/apps/context-pack-service.js
        SERVICE_PORT: "3000"
    ports:
      - "${CONTEXT_PACK_HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=local
      - BITBRAT_ENV=local
      - PORT=3000
    env_file:
      - .env.brat
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      nats:
        condition: service_healthy
    networks:
      bitbrat-network:
        aliases:
          - context-pack.bitbrat.local

networks:
  bitbrat-network:
    external: true
