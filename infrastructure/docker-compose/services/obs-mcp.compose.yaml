services:
  obs-mcp:
    env_file:
      - .env.brat
    image: us-central1-docker.pkg.dev/bitbrat-local/obs-mcp/obs-mcp:latest
    platform: linux/amd64
    environment:
      - MCP_TRANSPORT=${MCP_TRANSPORT}
      - OBS_WEBSOCKET_URL=${OBS_WEBSOCKET_URL}
      - OBS_WEBSOCKET_SELF_SIGNED=${OBS_WEBSOCKET_SELF_SIGNED}
      - OBS_WEBSOCKET_PASSWORD=${OBS_WEBSOCKET_PASSWORD}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
    ports:
      - "${OBS_MCP_HOST_PORT:-3001}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      tool-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "node -e \"const http = require('http'); const options = { hostname: 'localhost', port: 8080, path: '/sse', headers: { 'Authorization': 'Bearer ' + process.env.MCP_AUTH_TOKEN } }; http.get(options, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => { process.exit(1); });\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      bitbrat-network:
        aliases:
          - obs-mcp.bitbrat.local
