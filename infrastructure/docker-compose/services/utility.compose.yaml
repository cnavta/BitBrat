services:
  utility:
    env_file:
      - .env.brat
    environment:
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
    build:
      context: ../..  # Sprint 375: Build context is repository root (for Dockerfile.base/Dockerfile.service)
      dockerfile: Dockerfile.service
      args:
        BASE_IMAGE: bitbrat-base:${BITBRAT_VERSION:-latest}  # Sprint 375: Use shared base image
        SERVICE_NAME: utility
        SERVICE_ENTRY: dist/apps/utility-service.js
        SERVICE_PORT: "3020"
    ports:
      - "${UTILITY_HOST_PORT:-3020}:3020"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3020/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      bitbrat-network:
        aliases:
          - utility.bitbrat.local
