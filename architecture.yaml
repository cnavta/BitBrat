name: BitBrat Platform
description: >-
  The BitBrat Platform is an LLM powered event orchestration and execution engine aimed at Streamers. Uses
  Node/TypeScript, Twurple, Firestore, OpenAI. Deployed on Cloud Run.
project:
  name: BitBrat Platform
  version: 0.38.1
  status: experimental
  description: >
    A cloud-native microservices suite that listens to Twitch, Kick and other events and provides tools to react to
    them.
  owners:
    - chris@ix-n.com
llm_guidance:
  intent: >
    Provide LLM evaluators (Claude Code, Aider, Continue, OpenHands) with architectural context, glossary definitions,
    critical invariants, and documentation pointers. This section serves as the primary orientation for coding agents
    working with the BitBrat platform.
  default_system_prompt: >
    You are an experienced Lead Engineer responsible for developing the BitBrat Platform. Follow the architecture.yaml
    specs strictly. Justify any architectural deviation clearly.
  glossary:
    routing_slip: >-
      An ordered list of processing steps that travels with a message; each worker updates its step and republishes (see
      references.routing_slip_schema).
    disposition: A short-term, TTL-bounded read of a user's behavior, computed by disposition-service.
    mcp: Model Context Protocol; MCP servers expose tools to the LLM and are proxied/secured by tool-gateway.
    egress: Delivery of an internal response back out to the originating platform (Twitch/Discord/Twilio).
    enrichment: Optional analysis that augments an event before reaction (query-analyzer, llm-bot).
    brat: The platform CLI/tooling under tools/brat (config, backup, setup).
    bit: >-
      A platform service unit under the Bit model. Every Bit speaks MCP, exposing a mandatory bit.* control plane (the
      Platform Ring) that Brat administers fleet-wide. The YAML services key is retained for back-compat (each service
      entry is conceptually a Bit). A Bit's optional profile declares its capability mixins (core, llm, mcp-server,
      gateway) and mcp.exposure controls whether it serves only the platform control plane (platform-only, the default)
      or also its domain tools (platform+domain). See documentation/architecture/bit-model-technical-architecture.md.
    platform_bit: >-
      A Bit that forms part of the core agent orchestration loop (perceive → plan → act → observe). Platform Bits are
      required for the minimal viable agent and provide infrastructure other Bits depend on. Examples: ingress-egress,
      event-router, llm-bot, reflex, tool-gateway, persistence.
    domain_bit: >-
      A Bit that extends the platform with optional, domain-specific capabilities or tools. Domain Bits can be removed
      without breaking core orchestration. Examples: obs-mcp (OBS control), image-gen-mcp (image generation),
      story-engine-mcp (storytelling), scheduler (periodic tasks).
  invariants:
    - Never import from or depend on ./deprecated in deliverables.
    - Every message must carry a correlationId (see messaging.envelope.required).
    - Bump the topic version (v<N>) on breaking payload changes; never mutate an existing version.
    - Consumers must be idempotent because delivery is at-least-once.
    - architecture.yaml is the canonical source of truth; service build args are derived from it.
  references:
    schemas:
      architecture: documentation/schemas/architecture.v1.json
      envelope: documentation/schemas/envelope.v1.json
      routing_slip: documentation/schemas/routing-slip.v1.json
    concepts:
      platform_flow: documentation/concepts/platform-flow.md
      event_router_rules: documentation/concepts/event-router-rules.md
      bit_model: documentation/architecture/bit-model-technical-architecture.md
    reference_docs:
      messaging_system: documentation/reference/messaging-system.md
      topic_catalog: documentation/reference/topic-catalog.md
      secrets_catalog: documentation/reference/secrets-catalog.md
      environment_variables: documentation/reference/environment-variables.md
    guides:
      extending_bitbrat: documentation/guides/extending-bitbrat.md
      postgres_migration: documentation/guides/postgres-migration.md
      backup_and_migration: documentation/guides/backup-and-migration.md
    templates:
      backlog: documentation/reference/backlog-example.yaml
      execution_plan: documentation/reference/execution-implementation-plan-template.md
  build_contract: >
    Standard services build from the single reusable Dockerfile.service; per-service behavior is supplied as
    --build-args derived from this file (see defaults.services.build).
platform:
  version: '2.0'
  infrastructure:
    messaging:
      required: true
      capabilities:
        - publish-subscribe
        - stream-retention
        - at-least-once-delivery
      config:
        defaultTTL: 3600
        deliveryGuarantee: at-least-once
        maxRetries: 5
      constraints:
        minRetention: 86400
        requireDurability: true
        maxLatencyMs: 100
      intent:
        - Event-driven orchestration between services
        - Routing slips carry processing steps with messages
        - Decoupled publish-subscribe for scalability
        - Durable streams for replay and debugging
    caching:
      required: true
      capabilities:
        - key-value-store
        - expiration-policies
        - atomic-operations
      config:
        defaultTTL: 300
        evictionPolicy: allkeys-lru
      constraints:
        minMemory: 128mb
        requirePersistence: true
        requireAtomicity: true
      intent:
        - Idempotency tracking via distributed locks (Sprint 1)
        - Duplicate message detection with Redis SET NX EX
        - Session state and rate limiting
        - Persistent cache survives restarts
    persistence:
      required: true
      capabilities:
        - relational-database
        - ACID-transactions
        - JSONB-support
        - full-text-search
      config:
        connectionPool:
          min: 10
          max: 100
        statementTimeout: 30000
        idleTimeout: 10000
      constraints:
        requireACID: true
        requireSSL: true
        requireJSONB: true
      intent:
        - Persistent event storage with flexible JSONB payload
        - Full-text search for event query capabilities
        - ACID transactions for state mutations
        - Primary data store as of Sprint 344 (replaced Firestore)
  orchestration:
    config:
      model: event-driven
      flow: perceive-plan-act-observe
      coordination: routing-slip
    stages:
      - id: ingest
        description: Normalize external platform events into Envelope v1 and publish internal.ingress.v1
        services:
          - ingress-egress
          - api-gateway
          - scheduler
      - id: route
        description: Attach and advance the routing slip; dispatch each step to its topic
        services:
          - event-router
      - id: analyze
        description: Optional analysis/enrichment steps that publish results to internal.enriched.v1
        services:
          - query-analyzer
          - llm-bot
          - disposition-service
          - story-engine-mcp
      - id: react
        description: Apply state mutations and behavioral side effects
        services:
          - state-engine
          - disposition-service
      - id: egress
        description: Translate internal responses back into platform-native delivery
        services:
          - ingress-egress
          - api-gateway
      - id: persist
        description: Durable capture of events, snapshots, and dead letters
        services:
          - persistence
    constraints:
      requiresMessaging: true
      requiresRoutingSlip: true
      maxStageLatency: 1000
      requiresIdempotency: true
    intent:
      - Decouples agent loop (perceive → plan → act → observe) into independent services
      - Routing slip enables dynamic orchestration without hardcoded workflows
      - Each stage is independently scalable and replaceable
      - Dead-letter topics provide fault tolerance and observability
      - Services can participate in multiple stages (e.g., disposition-service in analyze + react)
infrastructure:
  docker:
    config:
      scope: local
      scalability: vertical
      costModel: zero-cost
    constraints:
      maxInstances: 1
      offlineCapable: true
    intent:
      - Primary development environment for local iteration
      - Self-hosted production alternative (bitbrat.lan)
      - Zero cloud costs for small deployments
      - Full feature parity with cloud deployments
    messaging:
      service: nats
      image: nats:2.10-alpine
      ports:
        client: '4222:4222'
        http: '8222:8222'
        routing: '6222:6222'
      volumes:
        - type: named
          name: nats-data
          target: /data
      env:
        NATS_JETSTREAM_MAX_MEM: '-1'
        NATS_JETSTREAM_MAX_FILE: 10Gi
      config:
        jetstream: true
        persistence: true
        maxPayload: 10485760
        retention: 604800
      healthCheck:
        test:
          - CMD
          - wget
          - '--quiet'
          - '--tries=1'
          - '--spider'
          - http://localhost:8222/healthz
        interval: 10s
        timeout: 5s
        retries: 10
        startPeriod: 30s
      intent:
        - JetStream provides durable streams for message replay
        - Replaces Kafka/RabbitMQ with simpler ops and lower overhead
        - Sub-millisecond latency for event orchestration
        - File-backed persistence survives restarts
    caching:
      service: redis
      image: redis:7-alpine
      ports:
        main: '6379:6379'
      volumes:
        - type: named
          name: redis-data
          target: /data
      command:
        - redis-server
        - '--appendonly'
        - 'yes'
        - '--appendfsync'
        - everysec
        - '--maxmemory'
        - 512mb
        - '--maxmemory-policy'
        - allkeys-lru
      config:
        appendonly: 'yes'
        maxmemory: 512mb
        evictionPolicy: allkeys-lru
      healthCheck:
        test:
          - CMD
          - redis-cli
          - ping
        interval: 10s
        timeout: 5s
        retries: 10
        startPeriod: 30s
      intent:
        - Idempotency tracking via SET NX EX (Sprint 1)
        - Distributed locks for duplicate message detection
        - AOF persistence ensures durability across restarts
        - Session state and rate limiting
    persistence:
      service: postgres
      image: postgres:15-alpine
      ports:
        main: '5432:5432'
      volumes:
        - type: named
          name: postgres-data
          target: /var/lib/postgresql/data
      env:
        POSTGRES_DB: bitbrat
        POSTGRES_USER: bitbrat
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
      config:
        database: bitbrat
        user: bitbrat
        maxConnections: 100
        sharedBuffers: 256MB
        effectiveCacheSize: 1GB
        maintenanceWorkMem: 64MB
        walLevel: replica
      healthCheck:
        test:
          - CMD-SHELL
          - pg_isready -U bitbrat -d bitbrat
        interval: 10s
        timeout: 5s
        retries: 10
        startPeriod: 30s
      intent:
        - Primary data store as of Sprint 344 (replaced Firestore)
        - JSONB support for flexible event payloads
        - Full-text search capabilities (tsvector/tsquery)
        - ACID transactions for state mutations
        - Platform-agnostic (works with AWS RDS, GCP Cloud SQL, Azure PostgreSQL, self-hosted)
        - Document Store pattern
messaging:
  intent: >
    Decentralized event orchestration via routing slips that travel with Envelope v1 messages. Each service enriches
    events with annotations and advances the routing slip, enabling dynamic event flow without hardcoded service
    dependencies. The message bus (NATS locally, Pub/Sub in production) provides at-least-once delivery, requiring all
    consumers to be idempotent.
  reference: documentation/reference/topic-catalog.md
  config:
    driver: MESSAGE_BUS_DRIVER
    prefix: BUS_PREFIX
    delivery: at-least-once
    envelope_schema: documentation/schemas/envelope.v1.json
    routing_slip_schema: documentation/schemas/routing-slip.v1.json
  constraints:
    topic_naming: internal.<domain>.<verb>.v<version>
    versioning: Bump v<N> on breaking payload changes; never mutate an existing version.
    per_instance_suffix: .{instanceId} resolves to K_REVISION || EGRESS_INSTANCE_ID || SERVICE_INSTANCE_ID || HOSTNAME
    idempotency: Required for all consumers (at-least-once delivery)
    envelope_required_fields:
      - v
      - source
      - correlationId
    envelope_optional_fields:
      - traceId
      - replyTo
      - timeoutAt
      - routingSlip
  topics:
    internal.finalize.v1:
      producers:
        - any-service
      consumers: []
      schema: documentation/schemas/envelope.v1.json
    internal.ingress.v1:
      producers:
        - ingress-egress
        - scheduler
        - api-gateway
      consumers:
        - event-router
        - persistence
      schema: documentation/schemas/envelope.v1.json
    internal.enriched.v1:
      producers:
        - query-analyzer
        - llm-bot
        - auth
      consumers:
        - event-router
      schema: documentation/schemas/envelope.v1.json
    internal.query.analysis.v1:
      producers:
        - event-router
      consumers:
        - query-analyzer
      schema: documentation/schemas/envelope.v1.json
    internal.llmbot.v1:
      producers:
        - event-router
      consumers:
        - llm-bot
      schema: documentation/schemas/envelope.v1.json
    internal.auth.v1:
      producers:
        - event-router
      consumers:
        - auth
      schema: documentation/schemas/envelope.v1.json
    internal.reflex.v1:
      producers:
        - event-router
      consumers:
        - reflex
      schema: documentation/schemas/envelope.v1.json
    internal.reflex.executed.v1:
      producers:
        - reflex
      consumers: []
      schema: documentation/schemas/reflex-executed-event.v1.json
    internal.reflex.failed.v1:
      producers:
        - reflex
      consumers: []
      schema: documentation/schemas/reflex-failed-event.v1.json
    internal.story.enrich.v1:
      producers:
        - event-router
      consumers:
        - story-engine-mcp
      schema: documentation/schemas/envelope.v1.json
    internal.user.disposition.observation.v1:
      producers:
        - event-router
      consumers:
        - disposition-service
      schema: documentation/schemas/envelope.v1.json
    internal.user.disposition.updated.v1:
      producers:
        - disposition-service
      consumers: []
      schema: documentation/schemas/envelope.v1.json
    internal.state.mutation.v1:
      producers:
        - disposition-service
      consumers:
        - state-engine
      schema: documentation/schemas/envelope.v1.json
    internal.egress.v1:
      producers:
        - event-router
        - scheduler
      consumers:
        - ingress-egress
      schema: documentation/schemas/envelope.v1.json
    internal.api.egress.v1:
      producers:
        - event-router
      consumers:
        - api-gateway
      schema: documentation/schemas/envelope.v1.json
    internal.persistence.snapshot.v1:
      producers:
        - ingress-egress
        - api-gateway
      consumers:
        - persistence
      schema: documentation/schemas/envelope.v1.json
    internal.persistence.finalize.v1:
      producers:
        - event-router
      consumers:
        - persistence
      schema: documentation/schemas/envelope.v1.json
    internal.scheduler.tick:
      producers:
        - scheduler
      consumers:
        - scheduler
      schema: documentation/schemas/envelope.v1.json
    internal.deadletter.v1:
      producers:
        - any-service
      consumers:
        - persistence
      schema: documentation/schemas/envelope.v1.json
    internal.router.dlq.v1:
      producers:
        - event-router
      consumers:
        - persistence
      schema: documentation/schemas/envelope.v1.json
conventions:
  intent: >
    Configuration follows hierarchical resolution (env var > .secure/.env > yaml > defaults) with strict separation
    between environment variables (runtime config) and secrets (sensitive credentials). All secret VALUES are external
    to this file; only secret NAMES are declared to drive deployment tooling.
  references:
    environment_variables: documentation/reference/environment-variables.md
    secrets_catalog: documentation/reference/secrets-catalog.md
  constraints:
    env_resolution_order:
      - environment_variable
      - .secure/{context}/.env
      - env/{context}/{service}.yaml
      - env/{context}/global.yaml
      - services.{service}.env
      - defaults.services.env
    secret_management:
      local: .secure/{context}/.env
      cloud_run: gcp-secret-manager
      ecs: aws-secrets-manager
      k8s: kubernetes-secrets
    auto_injected_variables:
      - K_REVISION
      - K_SERVICE
      - K_CONFIGURATION
      - PORT
    secret_naming:
      pattern: UPPER_SNAKE_CASE
      no_values: Secret VALUES never stored in architecture.yaml
      deployment_driven: Declared secrets drive secret mounting/injection during deployment
defaults:
  services:
    active: false
    category: platform
    implementation: docker
    runtime:
      node: 24.x
    network: bitbrat-prod-vpc
    scaling:
      min: 1
      max: 1
    observability:
      log_export: cloud-logging
      metrics: cloud-monitoring
      tracing:
        enabled: false
        sampler_ratio: 0.1
    port: 3000
    profile: core
    mcp:
      exposure: platform-only
    build:
      dockerfile: Dockerfile.service
      source_of_truth: architecture.yaml
      build_args:
        SERVICE_NAME: 'the service key under services:'
        SERVICE_PORT: services.<name>.port (or defaults.services.port)
        SERVICE_ENTRY: services.<name>.entry with leading 'src/' -> 'dist/' and '.ts' -> '.js'
      entry_to_service_entry: src/<x>.ts -> dist/<x>.js (e.g. src/apps/llm-bot-service.ts -> dist/apps/llm-bot-service.js)
      per_service_override: >-
        A Dockerfile.<service> is honored as an explicit override (escape hatch), e.g. brat (builds from tools/) and
        obs-mcp (uses a prebuilt image:).
    health:
      - /healthz
      - /readyz
      - /livez
    topics:
      publishes:
        - internal.finalize.v1
    security:
      allowUnauthenticated: true
    env:
      - LOG_LEVEL
      - MESSAGE_BUS_DRIVER
      - NATS_URL
      - BUS_PREFIX
services:
  oauth-flow:
    category: domain
    profile: gateway
    mcp:
      exposure: platform-only
    active: true
    description: OAuth2 authentication service that handles Streaming Platform OAuth2 flow for bot and broadcaster accounts.
    kind: gateway
    external:
      - twitch
      - discord
    scaling_rationale: 'min: 0 — scales to zero when no OAuth flow is in progress; bursty, latency-tolerant.'
    entry: src/apps/oauth-service.ts
    scaling:
      min: 0
      max: 1
    paths:
      - /oauth/*
    secrets:
      - TWITCH_CLIENT_ID
      - TWITCH_CLIENT_SECRET
      - OAUTH_STATE_SECRET
      - DISCORD_CLIENT_ID
      - DISCORD_CLIENT_SECRET
    env:
      - DISCORD_REDIRECT_URI
      - DISCORD_OAUTH_SCOPES
      - DISCORD_OAUTH_PERMISSIONS
      - TWITCH_OAUTH_SCOPES
  ingress-egress:
    category: platform
    profile: gateway
    mcp:
      exposure: platform-only
    active: true
    description: >-
      Bridges external event sources/sinks (e.g., Twitch EventSub/IRC, Discord, Twilio) to and from internal topics,
      normalizing inbound events to internal.ingress.v1 and delivering internal.egress.v1 responses back to the
      originating platform.
    kind: pipeline-service
    stage:
      - ingest
      - egress
    external:
      - twitch
      - discord
      - twilio
      - slack
    stateful: false
    scaling_rationale: >-
      Owns singleton external connections; uses a per-instance egress topic (internal.egress.v1.{instanceId}) so replies
      route back to the instance holding the connection.
    entry: src/apps/ingress-egress-service.ts
    dependencies:
      infrastructure:
        - messaging
        - caching
        - persistence
    topics:
      publishes:
        - internal.ingress.v1
        # Sprint 24: Publishes 'initial' snapshots for unified persistence flow
        # All ingested events immediately published as 'initial' snapshots after successful ingress
        - internal.persistence.snapshot.v1
      consumes:
        - internal.egress.v1.{instanceId}
        - internal.egress.v1
    paths:
      - /_debug/twitch
      - /_debug/discord
      - /_debug/twilio
      - /webhooks/twilio
    secrets:
      - TWITCH_CLIENT_ID
      - TWITCH_CLIENT_SECRET
      - DISCORD_BOT_TOKEN
      - TWILIO_ACCOUNT_SID
      - TWILIO_AUTH_TOKEN
      - TWILIO_API_KEY
      - TWILIO_API_SECRET
      - TWILIO_CHAT_SERVICE_SID
      - SLACK_APP_TOKEN
      - SLACK_BOT_TOKEN
      - SLACK_SIGNING_SECRET
    env:
      - PERSISTENCE_SNAPSHOT_MODE
      - PERSISTENCE_INCLUDE_RAW_PAYLOADS
      - PERSISTENCE_MAX_SNAPSHOT_BYTES
      - PERSISTENCE_TTL_DAYS
      - DISCORD_ENABLED
      - TWILIO_ENABLED
      - DEBUG_USERS_SLACK
      - DEBUG_USERS_TWITCH
      - DEBUG_USERS_DISCORD
  auth:
    category: platform
    profile: gateway
    mcp:
      exposure: platform+domain
    active: true
    description: Authentication service that handles user authentication and authorization.
    kind: pipeline-service
    external:
      - twitch
    entry: src/apps/auth-service.ts
    dependencies:
      infrastructure:
        - messaging
        - caching
        - persistence
    topics:
      consumes:
        - internal.auth.v1
    secrets:
      - TWITCH_CLIENT_ID
      - TWITCH_CLIENT_SECRET
      - MCP_AUTH_TOKEN
  query-analyzer:
    category: platform
    profile: llm
    mcp:
      exposure: platform-only
    active: true
    description: Executes fast, efficient pre-analysis of incoming events to better route and respond
    kind: pipeline-service
    stage: analyze
    external:
      - openai
    entry: src/apps/query-analyzer.ts
    dependencies:
      infrastructure:
        - messaging
    topics:
      consumes:
        - internal.query.analysis.v1
    env:
      - LLM_PROVIDER
      - LLM_MODEL
    secrets:
      - OPENAI_API_KEY
  event-router:
    category: platform
    profile: gateway
    mcp:
      exposure: platform+domain
    active: true
    description: Internal event routing service that reads from ingress channel(s) and assigns routing slips.
    kind: pipeline-service
    stage: route
    stateful: false
    entry: src/apps/event-router-service.ts
    dependencies:
      infrastructure:
        - messaging
        - persistence
    topics:
      consumes:
        - internal.ingress.v1
        - internal.enriched.v1
    secrets:
      - MCP_AUTH_TOKEN
  llm-bot:
    category: platform
    profile: llm
    mcp:
      exposure: platform-only
    active: true
    description: Headless LLM worker that consumes bot request subjects and produces responses.
    kind: pipeline-service
    stage: analyze
    external:
      - openai
    stateful: false
    entry: src/apps/llm-bot-service.ts
    paths:
      - /_debug/mcp
    dependencies:
      infrastructure:
        - messaging
        - caching
        - persistence
    topics:
      consumes:
        - internal.llmbot.v1
    secrets:
      - OPENAI_API_KEY
    env:
      - OPENAI_MODEL
      - OPENAI_TIMEOUT_MS
      - OPENAI_MAX_RETRIES
      - LLM_BOT_MEMORY_MAX_MESSAGES
      - LLM_BOT_MEMORY_MAX_CHARS
      - LLM_BOT_BEHAVIORAL_GUIDANCE_ENABLED
      - LLM_BOT_BEHAVIORAL_TOOL_FILTER_ENABLED
      - LLM_BOT_BEHAVIORAL_GATING_ENABLED
      - LLM_BOT_RISK_RESPONSE_MODE
      - LLM_BOT_TONE_STYLE_ENABLED
      - LLM_BOT_SYSTEM_PROMPT
      - LLM_BOT_INSTANCE_MEM_MAX_KEYS
      - LLM_BOT_INSTANCE_MEM_MAX_MSGS
      - LLM_BOT_INSTANCE_MEM_MAX_CHARS
      - LLM_BOT_INSTANCE_MEM_TTL_MS
  persistence:
    category: platform
    profile: core
    mcp:
      exposure: platform-only
    active: true
    description: Persists and indexes events for later retrieval
    kind: pipeline-service
    stage: persist
    stateful: true
    owned_state: Firestore events collection (and dead-letter capture).
    entry: src/apps/persistence-service.ts
    dependencies:
      infrastructure:
        - messaging
        - persistence
    topics:
      consumes:
        - internal.persistence.snapshot.v1  # Sprint 24: Snapshot-only persistence flow
        - internal.persistence.finalize.v1
        - internal.deadletter.v1
        - internal.router.dlq.v1
    env:
      - PERSISTENCE_SNAPSHOT_MODE
      - PERSISTENCE_INCLUDE_RAW_PAYLOADS
      - PERSISTENCE_MAX_SNAPSHOT_BYTES
      - PERSISTENCE_TTL_DAYS
  obs-mcp:
    category: domain
    profile: mcp-server
    mcp:
      exposure: platform+domain
      requiredRoles:
        - reflex
        - admin
    active: true
    description: MCP server for controlling OBS
    kind: mcp-server
    external:
      - obs
    image: us-central1-docker.pkg.dev/bitbrat-local/obs-mcp/obs-mcp:latest
    env:
      - MCP_TRANSPORT
      - OBS_WEBSOCKET_URL
      - OBS_WEBSOCKET_SELF_SIGNED
    secrets:
      - OBS_WEBSOCKET_PASSWORD
      - MCP_AUTH_TOKEN
  scheduler:
    category: domain
    profile: mcp-server
    mcp:
      exposure: platform+domain
    active: true
    description: Platform-agnostic scheduler service with internal timer (Sprint 369)
    kind: pipeline-service
    stage: ingest
    entry: src/apps/scheduler-service.ts
    dependencies:
      infrastructure:
        - messaging
        - persistence
    topics:
      publishes:
        - internal.ingress.v1
        - internal.egress.v1
      consumes: []
    secrets:
      - MCP_AUTH_TOKEN
  api-gateway:
    category: platform
    profile: gateway
    mcp:
      exposure: platform+domain
    active: true
    description: API Gateway for handling incoming requests and routing them to appropriate services
    kind: gateway
    stage:
      - ingest
      - egress
    scaling_rationale: >-
      Serves WebSocket clients; uses a per-instance egress topic (internal.api.egress.v1.{instanceId}) so responses
      reach the instance owning the socket.
    entry: src/apps/api-gateway.ts
    dependencies:
      infrastructure:
        - messaging
        - persistence
    topics:
      publishes:
        - internal.ingress.v1
        - internal.persistence.snapshot.v1
      consumes:
        - internal.api.egress.v1.{instanceId}
        - internal.egress.v1
    env:
      - PERSISTENCE_SNAPSHOT_MODE
      - PERSISTENCE_INCLUDE_RAW_PAYLOADS
      - PERSISTENCE_MAX_SNAPSHOT_BYTES
      - PERSISTENCE_TTL_DAYS
      - API_GATEWAY_ALLOW_ANONYMOUS_WS
  state-engine:
    category: platform
    profile: mcp-server
    mcp:
      exposure: platform+domain
    active: true
    description: State engine for managing application state
    kind: pipeline-service
    stage: react
    stateful: true
    owned_state: Firestore state and mutation_log collections.
    entry: src/apps/state-engine.ts
    dependencies:
      infrastructure:
        - messaging
        - persistence
    topics:
      consumes:
        - internal.state.mutation.v1
    secrets:
      - MCP_AUTH_TOKEN
  disposition-service:
    category: platform
    profile: core
    mcp:
      exposure: platform-only
    active: true
    description: Determines the short term disposition of users
    kind: pipeline-service
    stage: react
    stateful: true
    owned_state: Short-term, TTL-bounded user disposition snapshots (DISPOSITION_SNAPSHOT_TTL_MS).
    entry: src/apps/disposition-service.ts
    dependencies:
      infrastructure:
        - messaging
        - persistence
    topics:
      consumes:
        - internal.user.disposition.observation.v1
      publishes:
        - internal.state.mutation.v1
        - internal.user.disposition.updated.v1
    secrets:
      - MCP_AUTH_TOKEN
    env:
      - DISPOSITION_ENABLED
      - DISPOSITION_WINDOW_MS
      - DISPOSITION_MAX_EVENTS
      - DISPOSITION_MIN_EVENTS
      - DISPOSITION_SNAPSHOT_TTL_MS
      - DISPOSITION_PUBLISH_UPDATES
      - DISPOSITION_PROMPT_INJECTION_ENABLED
      - DISPOSITION_MODERATION_ASSIST_ENABLED
  tool-gateway:
    category: platform
    profile: gateway
    mcp:
      exposure: platform+domain
    active: true
    description: MCP Proxy for centralized MCP tool management and security
    kind: gateway
    entry: src/apps/tool-gateway.ts
    dependencies:
      infrastructure:
        - messaging
        - persistence
    secrets:
      - MCP_AUTH_TOKEN
    env:
      - LOG_LEVEL
  image-gen-mcp:
    category: domain
    profile: mcp-server
    mcp:
      exposure: platform+domain
    active: true
    description: MCP server for on-demand image generation using OpenAI DALL-E 3.
    kind: mcp-server
    external:
      - openai
    entry: src/services/image-gen-mcp/index.ts
    secrets:
      - OPENAI_API_KEY
      - MCP_AUTH_TOKEN
    env:
      - MCP_TRANSPORT
      - IMAGE_GEN_RATE_LIMIT_MS
    secureFiles:
      - local: .secure.local/gcp-credentials.json
        target: /var/secrets/gcp-credentials.json
        env: GOOGLE_APPLICATION_CREDENTIALS
        permissions: '0400'
        required: false
        context: local
      - local: .secure.staging/gcp-credentials.json
        target: /var/secrets/gcp-credentials.json
        env: GOOGLE_APPLICATION_CREDENTIALS
        permissions: '0400'
        required: true
        context: staging
      - local: .secure.prod/gcp-credentials.json
        target: /var/secrets/gcp-credentials.json
        env: GOOGLE_APPLICATION_CREDENTIALS
        permissions: '0400'
        required: true
        context: prod
  story-engine-mcp:
    category: domain
    profile: mcp-server
    mcp:
      exposure: platform+domain
    active: true
    description: Provides tools that enable on-demand collaborative storytelling
    kind: mcp-server
    stage: analyze
    entry: src/apps/story-engine-mcp.ts
    dependencies:
      infrastructure:
        - messaging
        - persistence
    topics:
      consumes:
        - internal.story.enrich.v1
    secrets:
      - MCP_AUTH_TOKEN
  reflex:
    category: platform
    profile: mcp-server
    mcp:
      exposure: platform+domain
    active: true
    description: The Reflex bit is responsible for matching and orchestrating repeated deterministic behavior in a low-cost manner
    kind: mcp-server
    entry: src/apps/reflex-service.ts
    port: 3000
    stage: analyze
    dependencies:
      infrastructure:
        - messaging
        - caching
    env:
      - REFLEX_CACHE_POLL_INTERVAL_MS
  context-pack:
    profile: core
    mcp:
      exposure: platform-only
    active: true
    description: Analysis-stage service for semantic context enrichment via RAG (Sprint 338)
    kind: pipeline-service
    stage: analysis
    entry: src/apps/context-pack-service.ts
    port: 3000
  event-stream-analyzer:
    profile: core
    category: platform
    mcp:
      exposure: platform-only
    active: true
    description: Real-time event stream analysis using RxJS sliding windows (v4 streaming architecture)
    kind: pipeline-service
    stage: analyze
    entry: src/apps/event-stream-analyzer-service.ts
    port: 3000
    secrets:
      - MCP_AUTH_TOKEN
  claim-check:
    category: platform
    profile: core
    mcp:
      exposure: platform-only
    active: true
    description: Claim Check Bit - Temporary event and blob storage
    kind: pipeline-service
    stage: persist
    stateful: false
    entry: src/apps/claim-check-service.ts
    port: 3008
    dependencies:
      infrastructure:
        - messaging
        - caching
    topics:
      consumes:
        - internal.persistence.snapshot.v1
      produces: []
    env:
      - CLAIM_CHECK_MAX_EVENT_SIZE_BYTES
      - CLAIM_CHECK_MAX_BLOB_SIZE_BYTES
      - CLAIM_CHECK_DEFAULT_TTL_SECONDS
      - CLAIM_CHECK_MAX_TTL_SECONDS
      - REDIS_URL
  utility:
    category: platform
    profile: core
    mcp:
      exposure: platform-only
    active: true
    description: Platform Utilities - Counters and bidding session management with hybrid storage
    kind: pipeline-service
    stateful: false
    entry: src/apps/utility-service.ts
    port: 3020
    dependencies:
      infrastructure:
        - messaging
        - caching
        - persistence
    topics:
      consumes: []
      produces: []
    env:
      - COUNTER_DEFAULT_TTL_SECONDS
      - COUNTER_MAX_TTL_SECONDS
      - REDIS_URL
      - DATABASE_URL
executionContexts:
  local:
    description: Local Docker development environment
    deployment:
      type: docker-compose
      docker:
        host: unix:///var/run/docker.sock
        additionalSyncPaths:
          - .brat/hooks
    runtime:
      gateway:
        autoDiscover: true
        fallbackPort: 3004
      persistence:
        driver: postgres
        connection:
          host: localhost
          port: 5432
          database: bitbrat
          username: bitbrat
          password: bitbrat_dev_password
      envOverlay:
        path: env/local
        files:
          - global.yaml
          - infra.yaml
          - '{service}.yaml'
        secure: .secure.local
    infrastructure:
      provider: docker
      caching:
        config:
          maxmemory: 256mb
      persistence:
        config:
          maxConnections: 50
    tags:
      - development
      - local
  staging:
    description: Remote staging environment on bitbrat.lan
    deployment:
      type: docker-compose
      docker:
        host: ssh://root@bitbrat.lan
        remoteDir: /opt/bitbrat-staging
        additionalSyncPaths:
          - .brat/hooks
      hooks:
        pre-deploy: .brat/hooks/staging/pre-deploy-gcp-auth.sh
    runtime:
      gateway:
        autoDiscover: true
        fallbackPort: 3004
        authToken: ${MCP_AUTH_TOKEN}
      persistence:
        driver: postgres
        autoDiscover: true
      envOverlay:
        path: env/staging
        files:
          - global.yaml
          - infra.yaml
          - '{service}.yaml'
        secure: .secure.staging
    infrastructure:
      provider: docker
      caching:
        config:
          maxmemory: 1gb
      persistence:
        config:
          maxConnections: 100
          sharedBuffers: 512MB
    tags:
      - staging
      - remote
