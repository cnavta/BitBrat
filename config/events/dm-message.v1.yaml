# Direct Message Event Definition
# Sprint 13: DM Capability Implementation (EP-02)
#
# Represents a direct message (DM) sent between two users on any supported platform.
# This is a bidirectional event - platforms can both send and receive DMs.

type: dm.message.v1
description: Direct message sent between two users (one-to-one conversation)
version: 1
category: bidirectional

metadata:
  createdBy: Platform Team
  createdAt: "2026-08-14"
  owningTeam: integrations
  relatedEvents:
    - chat.message.v1
    - dm.sent.v1
    - dm.delivered.v1
    - dm.read.v1

# Event schema (for validation)
schema:
  properties:
    identity:
      type: object
      required: [external]
      properties:
        external:
          type: object
          required: [id, platform]
    message:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
    ingress:
      type: object
      required: [connector, channel]
      properties:
        connector:
          type: string
          enum: [discord, slack, twilio, telegram]
  required:
    - identity
    - ingress
