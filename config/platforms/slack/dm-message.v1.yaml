#
# Slack Platform Mapping: dm.message.v1
#
# Maps Slack direct message (DM) events to BitBrat's dm.message.v1 internal event type.
#
# Event Flow:
# 1. Slack sends 'message' event via Events API (Socket Mode or HTTP)
# 2. Event is wrapped in body.event by Slack SDK
# 3. This mapping detects DMs and normalizes to InternalEventV2
#
# DM Detection:
# Slack DM channels have channel IDs starting with 'D' (e.g., D123456)
# Regular channels start with 'C', private channels/groups with 'G'
#
# Sprint 13: DM Capability Implementation (DM-005)
#
# @since Sprint 13
#

# Platform-specific event name (Slack Events API event type)
platformEvent: message

# Internal event type this maps to
internalEventType: dm.message.v1

# Priority for disambiguation (higher = checked first)
# DM messages have priority 10 (checked before regular chat at priority 0)
priority: 10

# Filter to detect DM messages
# JSONLogic filter evaluated against the event payload
# Slack DM channels have IDs starting with 'D'
filter:
  and:
    # Event type must be 'message'
    - "==":
        - var: type
        - message
    # Exclude bot messages (bot_id field should not be present)
    - "!":
        var: bot_id
    # DM channel detection: channel ID starts with 'D'
    - "==":
        - substr:
            - var: channel
            - 0
            - 1
        - "D"

# Field mapping configuration
# Maps Slack event fields to BitBrat's InternalEventV2 format
fieldMapping:
  # User ID (required)
  userId:
    path: user
    required: true

  # Channel ID (required)
  # For Slack DMs, this is the DM channel ID (starts with 'D')
  channelId:
    path: channel
    required: true

  # Message text (required)
  messageText:
    path: text
    required: true

  # Message ID (Slack uses timestamp as unique ID)
  messageId:
    path: ts
    required: true

  # User display name (fallback to user ID if not available)
  # Note: Slack doesn't include user display name in message events
  # This will need to be resolved via Slack API in a future sprint
  userName:
    path: user
    fallbacks:
      - user

  # Team/workspace ID (optional metadata)
  teamId:
    path: team
    required: false

  # Thread parent timestamp (optional, for threaded DMs)
  threadTs:
    path: thread_ts
    required: false

  # Event timestamp (optional)
  eventTs:
    path: event_ts
    required: false

# Egress configuration (for reverse translation: InternalEventV2 → Slack API)
# Maps internal event fields back to Slack API parameters for sending DM responses
egress:
  # Method to invoke on SlackIngressClient
  # For Slack, sendText() works for both channels and DMs
  method: sendText

  # Field mapping for outbound messages
  fieldMapping:
    # Message text content
    text: message.text

    # DM channel ID (starts with 'D' for Slack DMs)
    # The channel field is where the response should be sent
    channel: egress.channel

metadata:
  description: Slack direct message (DM)
  platformDocUrl: https://api.slack.com/events/message
  notes: |
    Slack DM channels have IDs starting with 'D' (e.g., D123456789).
    Unlike Discord, Slack DMs don't require special handling - they're
    just channels. The sendText() method works for both channels and DMs.
  createdBy: Platform Team
  createdAt: "2026-08-14"
  lastModified: "2026-08-14"
