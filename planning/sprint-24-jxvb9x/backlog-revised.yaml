  tasks:
    - id: T4.1
      name: "Create ClaimCheckService with Versioning Logic"
      priority: P0
      status: completed
      estimatedMinutes: 180
      assignee: claude
      file: src/services/claim-check/claim-check-service.ts
      description: |
        Implement ClaimCheckService with timestamp-based versioning.

        Key methods:
        - storeEventClaim(correlationId, snapshot, ttl): 'stored' | 'rejected_stale' | 'rejected_error'
        - retrieveEventClaim(correlationId): { kind, capturedAt, event } | null
        - eventClaimExists(correlationId): boolean

        Algorithm (from claim-check-versioning-design.md):
        1. Fetch existing snapshot from Redis
        2. Compare timestamps (incoming vs existing)
        3. Reject if incoming is older
        4. Store if incoming is newer or same time but different kind
        5. Return result status

        Storage format:
        {
          kind: SnapshotKind,
          capturedAt: string,
          sourceService: string,
          sourceTopic: string,
          sequence: number | undefined,
          updatedAt: string,
          event: InternalEventV2
        }
      acceptanceCriteria:
        - Versioning logic correctly implemented
        - Timestamp comparison works
        - Handles out-of-order delivery
        - Rejects stale snapshots
        - Stores newer snapshots
        - Size validation enforced
        - TTL normalization working
      tags: [claim-check, versioning, core-logic]
      dependencies: [T1.4]
      completedAt: 2026-08-25T10:45:00Z
      notes: |
        Completed ClaimCheckService with timestamp-based versioning (lines 98-195).
        Updated storeEventClaim to accept PersistenceSnapshotEventV1 instead of raw event.
        Updated retrieveEventClaim to return StoredSnapshot (with versioning metadata).
        Added extractSequence helper to parse sequence from idempotency key.

        Algorithm implementation:
        1. Fetch existing snapshot from Redis
        2. Compare timestamps (incoming.capturedAt vs existing.capturedAt)
        3. Reject if incoming is older (return 'rejected_stale')
        4. Reject exact duplicates (same timestamp + kind)
        5. Accept and store if newer or different kind
        6. Store with full versioning metadata

        Created comprehensive test suite (claim-check-service-versioning.test.ts):
        - 19 tests covering all versioning scenarios
        - All tests passing
        - Coverage: out-of-order delivery, stale rejection, duplicate detection,
