        - claim.blob.retrieve returns base64-encoded blob data
        - claim.blob.exists checks blob existence
        - Base64 encoding/decoding works correctly
        - Tool descriptions clear and helpful
        - Size limits enforced (max 10MB)
      tool_schemas:
        claim.blob.store:
          input: |
            z.object({
              data: z.string().describe('Base64-encoded blob data'),
              contentType: z.string().optional().describe('MIME type (e.g., image/png)'),
              ttl: z.number().optional().describe('TTL in seconds (default: 300, max: 3600)')
            })
          output: |
            {
              blobId: string,
              size: number,
              expiresAt: string
            }
        claim.blob.retrieve:
          input: |
            z.object({
              blobId: z.string().describe('Blob claim ID to retrieve')
            })
          output: |
            Success: {
              blobId: string,
              contentType?: string,
              size: number,
              data: string (base64)
            }
            Not found: 'Blob not found or expired', isError: true
      implementation_notes: |
