    - id: T2.2
      title: Subscribe to persistence snapshots
      description: |
        Subscribe to internal.persistence.snapshot.v1 topic and store
        final snapshots in Redis via ClaimCheckService.
      priority: P0
      estimated_hours: 1.0
      status: completed
      completed_at: 2026-08-23T00:00:00Z
      dependencies: [T2.1]
      notes: |
        Implemented setupSubscriptions() method with:
        - Subscribes to internal.persistence.snapshot.v1
        - Filters for kind === 'final' snapshots only
        - Stores event via claimService.storeEventClaim()
        - Fail-open error handling (logs errors, always acks)
        - Skips gracefully when Redis unavailable
        - Logs correlationId, sourceService, sourceTopic for traceability
      files:
        - path: src/apps/claim-check-service.ts
          action: modify
          changes:
            - Add onMessage subscription to internal.persistence.snapshot.v1
            - Filter for kind === 'final' snapshots only
            - Extract correlationId and event from snapshot
            - Call claimService.storeEventClaim()
            - Log success/failure
            - Always ack message (no retries on store failure)
      acceptance_criteria:
        - Subscribes to internal.persistence.snapshot.v1
        - Only processes snapshots with kind === 'final'
        - Extracts snapshot.correlationId and snapshot.event
        - Calls storeEventClaim with defaultTtl from config
        - Errors logged but don't crash service
        - Message always acknowledged (no retry loop)
        - Logs include correlationId, sourceService for traceability
      error_handling:
