        - Comprehensive error logging
      files:
        - path: src/apps/claim-check-service.ts
          action: modify
          changes:
            - Register claim.blob.store tool
            - Register claim.blob.retrieve tool
            - Register claim.blob.exists tool
            - Add Zod schemas with base64 data validation
