        - Missing correlationId → log warning, ack message
      implementation_notes: |
        - Use this.onMessage<PersistenceSnapshotEventV1>()
        - Filter early: if (snapshot.kind !== 'final') { await ctx.ack(); return; }
        - Wrap storeEventClaim in try/catch to ensure ack always happens
        - Log at 'debug' level for successful stores (high volume)
        - Log at 'error' level for failures

