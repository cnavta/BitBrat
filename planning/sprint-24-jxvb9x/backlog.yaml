# PHASE 1: CORE INFRASTRUCTURE (P0 - CRITICAL)

phase_1:
  title: Core Infrastructure
  priority: P0
  estimated_hours: 4.5
  dependencies: []
  description: |
    Implement Redis-backed ClaimCheckService with complete error handling.
    This is the foundation for all claim check operations.

  tasks:
    - id: T1.1
      title: Create ClaimCheckService class skeleton
      description: |
        Create the core ClaimCheckService class with all method signatures,
        constructor, and key generation utilities. This establishes the
        contract for all claim check operations.
      priority: P0
      estimated_hours: 0.75
      status: completed
      completed_at: 2026-08-23T00:00:00Z
      dependencies: []
      files:
        - path: src/services/claim-check/claim-check-service.ts
          action: create
          lines: ~400
      acceptance_criteria:
        - Class created with constructor accepting RedisClient, IConfig, Logger
        - All method signatures present (storeEventClaim, retrieveEventClaim, etc.)
        - Key generation methods implemented (eventKey, blobDataKey, blobMetaKey)
        - Configuration properties parsed (maxEventSize, maxBlobSize, defaultTtl, maxTtl)
        - No compilation errors
      implementation_notes: |
        - Use existing RedisManager pattern from idempotency middleware
        - Key format: bitbrat:claim:{type}:{id}
        - Config keys: CLAIM_CHECK_MAX_EVENT_SIZE_BYTES, CLAIM_CHECK_DEFAULT_TTL_SECONDS
      validation:
        - TypeScript compiles successfully
        - Key generation follows bitbrat:claim: namespace convention

    - id: T1.2
      title: Implement event claim check operations
      description: |
        Implement the core event storage/retrieval operations with comprehensive
        error handling and size validation.
      priority: P0
      estimated_hours: 1.0
      status: completed
      completed_at: 2026-08-23T00:00:00Z
      dependencies: [T1.1]
      notes: Implemented together with T1.1 as full ClaimCheckService implementation
      files:
        - path: src/services/claim-check/claim-check-service.ts
          action: modify
          changes:
            - Implement storeEventClaim(correlationId, event, ttl)
            - Implement retrieveEventClaim(correlationId)
            - Implement eventClaimExists(correlationId)
            - Add size validation (max 1MB)
            - Add JSON serialization/deserialization
            - Add error handling (Redis failures, parse errors)
      acceptance_criteria:
        - storeEventClaim validates size before storing
        - Events stored as JSON strings with SET EX Redis command
        - retrieveEventClaim parses JSON and returns InternalEventV2
        - eventClaimExists uses Redis EXISTS command
        - All errors logged and handled gracefully (fail-open pattern)
        - Events exceeding maxEventSize throw clear error
      error_scenarios:
        - Redis connection failure → log error, return null
        - JSON parse error → log error, return null
        - Oversized event → throw error with size info
        - Invalid correlationId → return null (not an error)
      implementation_notes: |
        - Use redis.set(key, json, { EX: ttl }) for atomic store with TTL
        - Use redis.get(key) for retrieval
        - Validate size: Buffer.byteLength(json, 'utf8') <= maxEventSize
        - Always log operations with correlationId for traceability

    - id: T1.3
      title: Implement blob storage operations
      description: |
        Implement blob storage with metadata tracking, UUID generation,
        and comprehensive error handling.
      priority: P0
      estimated_hours: 1.0
      status: completed
      completed_at: 2026-08-23T00:00:00Z
      dependencies: [T1.1]
      notes: |
        Implemented together with T1.1 as full ClaimCheckService implementation.
        Uses base64 encoding for binary data storage (Redis v4 best practice).
      files:
        - path: src/services/claim-check/claim-check-service.ts
          action: modify
          changes:
            - Implement storeBlobClaim(data, options)
            - Implement retrieveBlobClaim(blobId)
            - Implement blobClaimExists(blobId)
            - Implement deleteBlobClaim(blobId)
            - Add UUID generation for blobId
            - Add metadata storage (contentType, size, timestamps)
      acceptance_criteria:
        - storeBlobClaim generates unique blobId (blob-{uuid})
        - Blob data stored at bitbrat:claim:blob:{blobId}
        - Blob metadata stored at bitbrat:claim:blob:{blobId}:meta
        - Both data and metadata have same TTL
        - retrieveBlobClaim returns both data and metadata
        - blobClaimExists checks data key only
        - deleteBlobClaim removes both data and metadata keys
        - Size validation enforced (max 10MB)
      data_model:
        blob_data_key: bitbrat:claim:blob:{blobId}
        blob_meta_key: bitbrat:claim:blob:{blobId}:meta
        metadata_schema: |
          {
            contentType?: string,
            size: number,
            createdAt: string (ISO 8601),
            expiresAt: string (ISO 8601)
          }
      implementation_notes: |
        - Use redis.set(dataKey, buffer, { EX: ttl }) for binary data
        - Use redis.getBuffer(dataKey) for retrieval
        - Store metadata as JSON string
        - Use Promise.all for atomic dual-key operations

    - id: T1.4
      title: Implement TTL normalization
      description: |
        Implement TTL validation and normalization logic with configurable
        defaults and max limits.
      priority: P0
      estimated_hours: 0.25
      status: completed
      completed_at: 2026-08-23T00:00:00Z
      dependencies: [T1.1]
      notes: Implemented together with T1.1 as full ClaimCheckService implementation
      files:
        - path: src/services/claim-check/claim-check-service.ts
          action: modify
          changes:
            - Implement normalizeTtl(ttl?) method
            - Apply defaults (300 seconds)
            - Enforce max (3600 seconds)
            - Handle edge cases (undefined, null, negative, zero)
      acceptance_criteria:
        - undefined/null → returns defaultTtl (300)
        - Zero or negative → returns defaultTtl
        - Valid TTL < maxTtl → returns TTL as-is
        - Valid TTL > maxTtl → returns maxTtl (3600)
        - Configuration-driven defaults from IConfig
      test_cases:
        - normalizeTtl() → 300
        - normalizeTtl(undefined) → 300
        - normalizeTtl(null) → 300
        - normalizeTtl(0) → 300
        - normalizeTtl(-100) → 300
        - normalizeTtl(600) → 600
        - normalizeTtl(5000) → 3600 (capped at max)
      implementation_notes: |
        - Read CLAIM_CHECK_DEFAULT_TTL_SECONDS from config (default: 300)
        - Read CLAIM_CHECK_MAX_TTL_SECONDS from config (default: 3600)
        - Simple validation: Math.min(Math.max(ttl || defaultTtl, 1), maxTtl)

    - id: T1.5
      title: Unit tests for ClaimCheckService
      description: |
        Comprehensive unit test suite for ClaimCheckService covering all
        methods, error scenarios, and edge cases. Target: 90%+ coverage.
      priority: P0
      estimated_hours: 1.5
      status: completed
      completed_at: 2026-08-23T00:00:00Z
      dependencies: [T1.2, T1.3, T1.4]
      notes: |
        Created 32 comprehensive unit tests covering:
