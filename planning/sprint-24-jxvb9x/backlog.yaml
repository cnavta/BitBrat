# RISK ASSESSMENT

risks:
  - id: R1
    description: Redis connection failures in production
    probability: low
    impact: medium
    mitigation: |
      - Fail-open pattern (log warning, return null)
      - Comprehensive error handling in all operations
      - Test Redis unavailable scenarios in T4.1
      - Monitor Redis health in production
      - Alert on Redis connection failures

  - id: R2
    description: Memory pressure from large events/blobs
    probability: medium
    impact: high
    mitigation: |
      - Enforce size limits (1MB events, 10MB blobs)
      - Aggressive TTL (5-min default, max 1 hour)
      - allkeys-lru eviction policy (already configured)
      - Monitor Redis memory usage in T4.3
      - Alert on >80% memory usage
      - Document memory limits in T4.5

  - id: R3
    description: Snapshot subscription backpressure
    probability: low
    impact: medium
    mitigation: |
      - Fast Redis operations (<10ms typical)
      - No synchronous processing in subscriber
      - Ack immediately after store (no retries)
      - Monitor subscription lag in production
      - Load test in T4.3 (send 100 snapshots)

  - id: R4
    description: Base Bit helper integration complexity
    probability: low
    impact: low
    mitigation: |
      - Follow existing McpClientProfile patterns
      - Comprehensive unit tests (T3.3)
      - Integration tests validate real MCP calls (T4.1)
      - Reference tool-gateway implementation

  - id: R5
    description: Tool-gateway integration requires major changes
    probability: low
    impact: medium
    mitigation: |
      - Minimal changes (just add getClaimedEvent call)
      - Keep backwards compatible (fail gracefully if event not found)
      - Test thoroughly in agent-dev (T4.4)
      - Coordinate with tool-gateway maintainer

