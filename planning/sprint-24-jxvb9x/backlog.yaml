        ### 8. Using Claim Check for Cross-Bit Event Access

        **Pattern for accessing events from outside the routing slip.**

        ```typescript
        // In tool-gateway-service.ts
        async handleToolCall(toolName: string, args: any, context: ToolCallContext) {
          // Retrieve the source event
          const sourceEvent = await this.getClaimedEvent(context.correlationId);
          if (!sourceEvent) {
            this.logger.warn('Source event not found in claim check');
            return { content: [{ type: 'text', text: 'Event not available' }], isError: true };
          }

          // Now have access to ingress/egress metadata
          const progressEvent: InternalEventV2 = {
            v: '2',
            type: 'internal.egress.v1',
            correlationId: randomUUID(),
            message: { role: 'assistant', text: args.message },
            ingress: sourceEvent.ingress,  // ✅ Available!
            egress: sourceEvent.egress,    // ✅ Available!
            // ...
          };
        }
        ```
