notes: |
  Sprint scope significantly expanded after discovering critical persistence
  architecture issue during planning. Original approach (filtering for 'final'
  snapshots only) would not work due to race condition. New approach implements
  unified snapshot publishing model where ALL events flow through single topic,
  enabling claim-check to access events immediately during processing.

  Key architectural change: Persistence service will no longer consume from
  internal.ingress.v1, only from internal.persistence.snapshot.v1. This
  requires careful deployment ordering to avoid data loss.
