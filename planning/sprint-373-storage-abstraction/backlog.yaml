  - id: STORAGE-012
    title: "Implement storage driver factory"
    description: |
      Create factory to instantiate correct driver based on environment config.

      Factory logic:
      1. STORAGE_DRIVER=filesystem → FilesystemStorageDriver
      2. STORAGE_DRIVER=gcs → GcsStorageDriver
      3. GCS_BUCKET_NAME set (no STORAGE_DRIVER) → GcsStorageDriver (backward compat)
      4. Default (no config) → FilesystemStorageDriver

      Validate required config for each driver.
    phase: factory_manager
