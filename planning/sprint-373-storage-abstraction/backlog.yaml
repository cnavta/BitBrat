# Sprint 373: Storage Abstraction Layer - Trackable Backlog
# Generated: 2026-07-29
# Format: YAML task tracking with priority, status, estimates, and dependencies

metadata:
  sprint: 373
  name: "Storage Abstraction Layer"
  goal: "Introduce configurable storage abstraction making GCP Storage optional, with local filesystem as platform-agnostic default"
  duration: "8 working days"
  team_size: 1
  start_date: "2026-07-30"
  end_date: "2026-08-08"
  status: "READY"

phases:
  foundation:
    name: "Phase 1: Foundation"
    days: "1-2"
    goal: "Create storage abstraction layer and filesystem driver"

  gcs_driver:
    name: "Phase 2: GCS Driver"
    days: "3"
    goal: "Refactor existing GCS code into driver pattern"

  factory_manager:
    name: "Phase 3: Factory & Manager"
    days: "4"
    goal: "Create driver selection and resource management"

  service_integration:
    name: "Phase 4: Service Integration"
    days: "5-6"
    goal: "Refactor image-gen-mcp to use driver abstraction"

  infrastructure:
    name: "Phase 5: Infrastructure"
    days: "7"
    goal: "Add Docker volume and API gateway static serving"

  documentation:
    name: "Phase 6: Documentation & Validation"
    days: "8"
    goal: "Complete documentation and migration guides"

tasks:
  # ==============================================================================
  # DAY 1: Interface & Types
  # ==============================================================================

  - id: STORAGE-001
    title: "Define IStorageDriver interface"
    description: |
      Create the core storage driver interface that all storage backends must implement.

      Interface must include:
      - upload(buffer, fileName, metadata): Promise<StorageUploadResult>
      - download(fileName): Promise<Buffer>
      - delete(fileName): Promise<void>
      - exists(fileName): Promise<boolean>
      - getMetadata(fileName): Promise<StorageFileMetadata>
      - list(prefix?): Promise<string[]>
      - initialize(): Promise<void>
      - shutdown(): Promise<void>
      - name: string (readonly property)

      Follow patterns from IDeploymentStrategy (Sprint 372) and IDocumentStore (Sprint 344).
    phase: foundation
    day: 1
    priority: P0
    status: completed
    estimate: "2 hours"
    files:
      - src/common/storage/types.ts
    acceptance_criteria:
      - Interface defines all 8 required methods
      - TypeScript compiles without errors
      - JSDoc comments on all methods
      - Types exported from index file
    tests:
      - TypeScript type checking passes
      - No linting errors
    notes: |
      Critical path item - all subsequent work depends on this interface.
      Keep interface simple and generic (platform-agnostic).

  - id: STORAGE-002
    title: "Define storage types and metadata"
    description: |
      Create supporting types for storage operations.

      Types to define:
      - StorageFileMetadata (contentType, size, customMetadata)
      - StorageUploadResult (fileName, publicUrl, metadata)
      - StorageDriverType ('filesystem' | 'gcs' | 's3' | 'azure-blob')

      All types must be well-documented with JSDoc and examples.
    phase: foundation
    day: 1
    priority: P0
    status: completed
    estimate: "1 hour"
    dependencies:
      - STORAGE-001
    files:
      - src/common/storage/types.ts
    acceptance_criteria:
      - All 3 types defined
      - JSDoc comments with examples
      - Exported from module
      - TypeScript compiles
    tests:
      - Type checking passes
      - Example usage compiles

  - id: STORAGE-003
    title: "Add comprehensive JSDoc to storage types"
    description: |
      Add detailed JSDoc documentation to all interfaces and types.

      Documentation must include:
      - Interface purpose and use cases
      - Method parameters and return types
      - Example usage code
      - Error conditions
      - Performance characteristics
    phase: foundation
    day: 1
    priority: P1
    status: completed
    estimate: "1 hour"
    dependencies:
      - STORAGE-001
      - STORAGE-002
    files:
      - src/common/storage/types.ts
    acceptance_criteria:
      - Every interface has @description
      - Every method has @param and @returns
      - At least one @example per interface
      - Error conditions documented
    tests:
      - Documentation review passes
      - Examples compile

  - id: STORAGE-004
    title: "Create storage types test file"
    description: |
      Create test file to validate type definitions compile correctly.

      Tests should verify:
      - All types are exported
      - Types can be instantiated
      - Example usage compiles
      - Type constraints work as expected
    phase: foundation
    day: 1
    priority: P1
    status: completed
    estimate: "1 hour"
    dependencies:
      - STORAGE-001
      - STORAGE-002
    files:
      - src/common/storage/types.test.ts
    acceptance_criteria:
      - Test file compiles
      - All exports verified
      - Example implementations compile
      - Type constraints tested
    tests:
      - npm test passes
      - No TypeScript errors

  # ==============================================================================
  # DAY 2: Filesystem Driver
  # ==============================================================================

  - id: STORAGE-005
    title: "Implement FilesystemStorageDriver"
    description: |
      Implement filesystem storage driver for local/self-hosted deployments.

      Implementation must:
      - Create storage directory on initialize()
      - Support subdirectories (auto-create parent dirs)
      - Write files atomically (temp file + rename)
      - Handle concurrent access safely
      - Use UUID-only filenames (no directory traversal)

      Platform-agnostic: works on Linux, macOS, Windows, Docker, K8s.
    phase: foundation
    day: 2
    priority: P0
    status: completed
    estimate: "3 hours"
    dependencies:
      - STORAGE-001
    files:
      - src/common/storage/drivers/filesystem-driver.ts
    acceptance_criteria:
      - Implements IStorageDriver interface
      - All 8 methods implemented
      - Creates directories recursively
      - Handles errors gracefully
      - Thread-safe operations
    tests:
      - Upload/download/delete work
      - Subdirectories created
      - Concurrent access safe
      - Error handling correct

  - id: STORAGE-006
    title: "Add metadata sidecar files"
    description: |
      Implement metadata persistence via sidecar JSON files.

      For each file (e.g., abc123.png), create sidecar (abc123.png.meta.json):
      {
        "contentType": "image/png",
        "size": 12345,
        "customMetadata": {...},
        "uploadedAt": "2026-07-29T12:00:00Z"
      }

      Used by getMetadata() method.
    phase: foundation
    day: 2
    priority: P0
    status: completed
    estimate: "1 hour"
    dependencies:
      - STORAGE-005
    files:
      - src/common/storage/drivers/filesystem-driver.ts
    acceptance_criteria:
      - Sidecar created on upload
      - Sidecar deleted on delete
      - getMetadata() reads sidecar
      - Handles missing sidecar gracefully
    tests:
      - Metadata persisted correctly
      - Metadata retrieved correctly
      - Missing metadata handled

  - id: STORAGE-007
    title: "Write comprehensive filesystem driver tests"
    description: |
      Create comprehensive test suite for FilesystemStorageDriver.

      Test categories:
      1. Basic operations (upload, download, delete, exists)
      2. Metadata operations (sidecar files)
      3. Directory handling (subdirectories, nested paths)
      4. Error cases (missing files, permission errors, disk full)
      5. Edge cases (empty files, large files, special characters)
      6. Concurrent access (multiple uploads simultaneously)

      Target: 100% code coverage.
    phase: foundation
    day: 2
    priority: P0
    status: completed
    estimate: "3 hours"
    dependencies:
      - STORAGE-005
      - STORAGE-006
    files:
      - src/common/storage/drivers/filesystem-driver.test.ts
    acceptance_criteria:
      - 100% code coverage
      - All operations tested
      - Error cases covered
      - Edge cases tested
      - Concurrent access tested
    tests:
      - npm test passes
      - Coverage report shows 100%
      - All edge cases pass

