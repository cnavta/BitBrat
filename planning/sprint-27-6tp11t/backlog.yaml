# ============================================================================
# RISK REGISTER
# ============================================================================

risks:
  - id: RISK-01
    description: "Redis unavailability breaks counter operations"
    severity: medium
    probability: low
    mitigation: "Fail-open pattern - log error, return graceful error to caller"
    status: mitigated

  - id: RISK-02
    description: "DocumentStore latency impacts counter performance"
    severity: low
    probability: medium
    mitigation: "Use Redis for hot path (values), DocumentStore only for metadata queries"
    status: mitigated

  - id: RISK-03
    description: "Scope ambiguity leads to incorrect counter selection"
    severity: medium
    probability: medium
    mitigation: "ScopeResolver prioritizes explicit params, clear docs on scope precedence"
    status: mitigated

  - id: RISK-04
    description: "TTL desync between Redis and DocumentStore"
    severity: low
    probability: medium
    mitigation: "DocumentStore stores expiresAt timestamp, future cleanup job for orphans"
    status: accepted

