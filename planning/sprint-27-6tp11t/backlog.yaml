    phase: phase-1
    priority: P0
    status: done
    estimated_hours: 2
    depends_on: [P1-T04]
    assignee: Claude

    description: |
      Register 6 MCP tools for counter operations with Zod schemas.

    acceptance_criteria:
      - counter.create tool registered with CreateCounterSchema
      - counter.increment tool registered with IncrementSchema
      - counter.get tool registered with GetCounterSchema
      - counter.delete tool registered with DeleteCounterSchema
      - counter.list tool registered with ListCountersSchema
      - counter.snapshot tool registered with SnapshotCounterSchema
      - All tools have descriptive help text
      - All tools use platform-only exposure
      - Tool handlers call CounterManager methods
      - Error responses follow MCP error format

    files:
      - path: src/apps/utility-service.ts
        action: modify
        lines_added: ~200

    verification:
      - Service compiles and starts without errors
      - All 6 tools appear in bit.info output
      - Tool schemas validate correct inputs
      - Tool schemas reject invalid inputs

