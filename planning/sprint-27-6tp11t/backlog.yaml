    assignee: Claude

    description: |
      Run full integration test in agent-dev environment.
      Proactive validation before marking sprint complete.

    acceptance_criteria:
      - Agent-dev context provisions successfully
      - Utility-service deploys without errors
      - Service connects to NATS, Redis, PostgreSQL
