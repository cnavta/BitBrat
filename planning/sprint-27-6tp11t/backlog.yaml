# ============================================================================
# PHASE 1: FOUNDATION & COUNTER TOOLS (THIS SPRINT)
# ============================================================================

tasks:
  # -------------------------------------------------------------------------
  # 1. SERVICE SCAFFOLD
  # -------------------------------------------------------------------------
  - id: P1-T01
    name: "Create utility-service Bit scaffold"
    phase: phase-1
    priority: P0
    status: done
    estimated_hours: 1.5
    depends_on: []
    assignee: Claude

    description: |
      Create the main utility-service Bit entry point with resource initialization.
      Follow claim-check-service pattern for lazy resource init.

    acceptance_criteria:
      - utility-service.ts extends Bit base class
      - Constructor sets mcpExposure to platform-only
      - setup() method initializes DocumentStore and Redis resources
      - Lazy initialization pattern for managers
      - Compiles without TypeScript errors

    files:
      - path: src/apps/utility-service.ts
        action: create
        lines: ~150
      - path: src/services/utility/types.ts
        action: create
        lines: ~100

    verification:
      - npm run build succeeds
      - TypeScript strict mode passes
      - No imports from deprecated/

  # -------------------------------------------------------------------------
  # 2. SCOPE RESOLVER
  # -------------------------------------------------------------------------
  - id: P1-T02
    name: "Implement ScopeResolver"
    phase: phase-1
    priority: P0
    status: done
    estimated_hours: 2
    depends_on: [P1-T01]
    assignee: Claude

    description: |
      Implement scope resolution logic to infer scopeType and scopeValue from
      event context or explicit parameters.

    acceptance_criteria:
      - Resolves explicit scope parameters (priority 1)
      - Auto-infers from event.ingress.channel (stream scope)
      - Auto-infers from event.identity.userId (user scope)
      - Defaults to global scope if context insufficient
      - Validates scope types against enum

    files:
      - path: src/services/utility/scope-resolver.ts
        action: create
        lines: ~200

    verification:
      - Compiles without errors
      - Handles null/undefined event gracefully
      - Returns consistent ScopeResult interface

  - id: P1-T03
    name: "Unit tests for ScopeResolver"
    phase: phase-1
    priority: P0
    status: done
    estimated_hours: 1.5
    depends_on: [P1-T02]
    assignee: Claude

    description: |
      Comprehensive unit tests for all scope resolution paths.

    acceptance_criteria:
      - Test explicit scope params (all types)
      - Test auto-inference from stream context
      - Test auto-inference from user context
      - Test global scope default
      - Test error cases (invalid scopeType)
      - 100% code coverage

    files:
      - path: src/services/utility/scope-resolver.test.ts
        action: create
        lines: ~300

    verification:
      - npm test passes all cases
      - Coverage report shows 100% for scope-resolver.ts

  # -------------------------------------------------------------------------
  # 3. COUNTER MANAGER
  # -------------------------------------------------------------------------
  - id: P1-T04
    name: "Implement CounterManager core logic"
    phase: phase-1
    priority: P0
    status: done
    estimated_hours: 3
    depends_on: [P1-T02]
    assignee: Claude

    description: |
      Implement counter management with DocumentStore metadata and Redis values.
      Hybrid storage: metadata in PostgreSQL, values in Redis.

    acceptance_criteria:
      - create() stores definition in DocumentStore, initializes Redis key
      - increment()/decrement() uses Redis INCR/DECR (atomic)
      - get() retrieves value from Redis, metadata from DocumentStore
      - delete() removes both Redis key and DocumentStore definition
      - list() queries DocumentStore with filters
      - snapshot() stores current value in counter_snapshots collection
      - TTL enforcement via Redis EXPIRE
      - Error handling with fail-open pattern

    files:
      - path: src/services/utility/counter-manager.ts
        action: create
        lines: ~400

    verification:
      - Compiles without errors
      - All methods return correct result types
      - Redis operations use proper key format: counter:{scope}:{name}

  - id: P1-T05
    name: "Unit tests for CounterManager"
    phase: phase-1
    priority: P0
    status: done
    estimated_hours: 2.5
    depends_on: [P1-T04]
    assignee: Claude

    description: |
      Comprehensive unit tests for CounterManager with mocked dependencies.

    acceptance_criteria:
      - Test counter creation (with/without TTL)
      - Test increment/decrement operations
      - Test get with metadata retrieval
      - Test delete (cleanup both stores)
      - Test list with scope filtering
      - Test snapshot creation
      - Test TTL enforcement
      - Test error handling (null Redis, DocumentStore errors)
      - Mock IDocumentStore and RedisClientType
      - 100% code coverage

    files:
      - path: src/services/utility/counter-manager.test.ts
        action: create
        lines: ~500

    verification:
      - npm test passes all cases (25+ tests)
      - Coverage report shows 100% for counter-manager.ts
      - Tests run in isolation (no shared state)

  # -------------------------------------------------------------------------
