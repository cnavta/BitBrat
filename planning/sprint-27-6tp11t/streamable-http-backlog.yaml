# ============================================================================
# RISK REGISTER
# ============================================================================
risks:
  - id: risk-1
    title: "Session management incompatibility"
    description: "Header-based session IDs may break existing clients"
    probability: MEDIUM
    impact: HIGH
    mitigation: "Feature flag for instant rollback + thorough integration testing"
    owner: Lead Implementor

  - id: risk-2
    title: "Hardcoded /sse references"
    description: "Missed /sse references cause 404 errors"
    probability: LOW
    impact: MEDIUM
    mitigation: "Comprehensive grep before deployment + agent-dev validation"
    owner: Lead Implementor

  - id: risk-3
    title: "SDK API differences"
    description: "StreamableHTTP API differs from SSE in unexpected ways"
    probability: MEDIUM
    impact: HIGH
    mitigation: "Thorough SDK docs review + comprehensive unit tests"
    owner: Lead Implementor

  - id: risk-4
    title: "Transport error handling gaps"
    description: "New error types not caught"
    probability: LOW
    impact: MEDIUM
    mitigation: "Error scenario testing + enhanced error logging"
    owner: Lead Implementor

  - id: risk-5
    title: "Performance regression"
    description: "New transport slower than old"
    probability: LOW
    impact: LOW
    mitigation: "Performance baseline + comparative testing"
    owner: Lead Implementor

