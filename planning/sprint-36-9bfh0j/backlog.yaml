  - id: IMPL-001
    phase: 1
    title: Add startTracking() method
    description: |
      Implement new public API method for starting operation tracking proactively.

      Location: src/common/middleware/feedback-middleware.ts

      Method signature:
      async startTracking(event: InternalEventV2): Promise<void>

      Responsibilities:
      - Extract operation_context annotation
      - Check for duplicate tracking (idempotency)
      - Create OperationState with correct startedAt
      - Store in operationTracking Map
      - Call scheduleTimers() to start all timers

      Key requirements:
      - Idempotent (multiple calls for same correlationId ignored)
      - Fail-open (errors logged but don't throw)
      - No elapsed time compensation (operation always fresh)
    priority: P0
    estimatedHours: 1.0
    dependencies: []
    status: completed
    acceptanceCriteria:
      - Method compiles and is callable
      - Extracts operation_context annotation correctly
      - Creates OperationState with all required fields
      - Idempotent (duplicate calls logged and ignored)
      - Calls scheduleTimers() for new operations
      - Errors caught and logged (fail-open)
    files:
      - src/common/middleware/feedback-middleware.ts
    testCoverage:
      - Unit test: Fresh operation creates state
      - Unit test: Duplicate call is idempotent
      - Unit test: Missing annotation returns early
      - Unit test: Invalid annotation logs warning

  - id: IMPL-002
    phase: 1
    title: Extract timer scheduling logic to scheduleTimers()
    description: |
      Refactor timer scheduling from old startTracking() into dedicated method.

      Location: src/common/middleware/feedback-middleware.ts

      Method signature:
      private scheduleTimers(state: OperationState): void

      Responsibilities:
      - Schedule initial progress timer (config.initialThresholdMs, default 2s)
      - Schedule timeout warning timer (config.timeoutThresholdMs, default 30s)
      - Schedule max lifetime cleanup timer (config.maxOperationLifetimeMs, default 5min)
      - Initial timer callback starts update interval
      - Timeout timer callback clears update interval

      Key requirements:
      - NO elapsed time calculation (assume operation just started)
      - NO Case 2 & 3 logic (removed in Task IMPL-007)
      - All timers scheduled immediately
      - Timer callbacks use sendTimedProgressMessage()
    priority: P0
    estimatedHours: 1.0
    dependencies:
      - IMPL-001
    status: completed
    acceptanceCriteria:
      - Method schedules all 4 timers (initial, update, timeout, max lifetime)
      - Timer delays match config values
      - Initial timer callback schedules update interval
      - Timeout timer callback clears update interval
      - Max lifetime timer forces cleanup
      - No conditional logic based on elapsed time
    files:
      - src/common/middleware/feedback-middleware.ts
    testCoverage:
      - Unit test: All timers scheduled with correct delays
      - Unit test: Initial timer fires at T+2s
      - Unit test: Update interval starts after initial
      - Unit test: Timeout timer fires at T+30s
      - Unit test: Max lifetime timer forces cleanup

  - id: IMPL-003
    phase: 1
    title: Add completeOperation() method
    description: |
      Implement clean public API for operation cleanup.

      Location: src/common/middleware/feedback-middleware.ts

      Method signature:
      completeOperation(correlationId: string): void

      Responsibilities:
      - Retrieve operation state from tracking map
      - Clear all active timers (initial, update, timeout, max lifetime)
      - Remove state from tracking map
      - Log completion

      Key requirements:
      - Synchronous (no await, just timer clearing)
      - Idempotent (safe to call multiple times)
      - Safe to call for non-existent operation (no-op)
      - No errors thrown
    priority: P0
    estimatedHours: 0.5
    dependencies:
      - IMPL-002
    status: completed
    acceptanceCriteria:
      - Method clears all 4 timer types
      - Removes state from operationTracking Map
      - Safe to call for non-existent correlationId
      - Idempotent (multiple calls safe)
      - Logs completion with correlationId
    files:
      - src/common/middleware/feedback-middleware.ts
    testCoverage:
      - Unit test: Clears all timers
      - Unit test: Removes tracking state
      - Unit test: Safe for non-existent operation
      - Unit test: Idempotent (multiple calls)
      - Unit test: Prevents timers from firing after cleanup

  - id: IMPL-004
    phase: 1
    title: Update llm-bot integration to call startTracking()
    description: |
      Integrate startTracking() call in llm-bot after operation_context annotation.

      Location: src/apps/llm-bot-service.ts:214

      Integration point: Immediately after pushing operation_context annotation

      Code addition:
      ```typescript
      data.annotations.push(operationContextAnnotation);

      // NEW: Start progress tracking before processing
      const feedbackMiddleware = this.getResource<FeedbackMiddleware>('feedbackMiddleware');
      if (feedbackMiddleware) {
        try {
          await feedbackMiddleware.startTracking(data);
        } catch (err) {
          logger.warn('Failed to start progress tracking', { error: err });
        }
      }
      ```

      Key requirements:
      - Call AFTER annotation added (annotation must exist)
      - Call BEFORE processEvent() (timers start before processing)
      - Wrapped in try/catch (fail-open)
      - Check middleware exists before calling
    priority: P0
    estimatedHours: 0.5
    dependencies:
      - IMPL-001
    status: completed
    acceptanceCriteria:
