  - id: IMPL-007
    phase: 2
    title: Remove Case 2 & Case 3 late detection logic
    description: |
      Remove reactive compensation logic for "late detection" scenarios.

      Location: src/common/middleware/feedback-middleware.ts:426-448

      Code to remove:
      - Lines 426-434: Case 2 (operation in progress, 2-30s elapsed)
      - Lines 435-446: Case 3 (very late detection, >30s elapsed)
      - Keep only Case 1 logic (fresh operation)

      Rationale:
      With startTracking() called at operation start, Case 2 & 3 never execute.
      Operations are always "fresh" when timers start.

      Simplification:
      - Remove alreadyElapsedMs conditional checks
      - Keep only straightforward timer scheduling
      - Remove debug logs for late detection
    priority: P1
    estimatedHours: 1.0
    dependencies:
      - IMPL-006
    status: completed
    acceptanceCriteria:
      - Case 2 conditional branch removed
      - Case 3 conditional branch removed
      - Only fresh operation path remains
      - No alreadyElapsedMs checks in timer scheduling
      - Debug logs for late detection removed
      - Code compiles and tests pass
    files:
      - src/common/middleware/feedback-middleware.ts
    testCoverage:
      - All tests pass (no late detection scenarios tested)
      - Code coverage unchanged (removed dead code)

  - id: IMPL-008
    phase: 2
    title: Simplify timer scheduling (remove elapsed time calculations)
    description: |
      Simplify scheduleTimers() by removing all elapsed time compensation.

      Location: src/common/middleware/feedback-middleware.ts:382-496

      Simplifications:
      - Remove alreadyElapsedMs calculation
      - Remove conditional timer delays (initialDelayMs, timeoutDelayMs)
      - Use config values directly (no subtraction)
      - Remove startedAtSource tracking (always annotation or current time)

      Before:
      ```typescript
      const alreadyElapsedMs = Date.now() - state.startedAt.getTime();
      const initialDelayMs = this.config.initialThresholdMs - alreadyElapsedMs;
      state.initialTimer = setTimeout(..., initialDelayMs);
      ```

      After:
      ```typescript
      state.initialTimer = setTimeout(..., this.config.initialThresholdMs);
      ```

      Key requirements:
      - Timers use config values directly
      - No runtime calculations for delays
      - Simpler, more predictable code
    priority: P1
    estimatedHours: 1.0
    dependencies:
      - IMPL-007
    status: completed
    acceptanceCriteria:
      - No alreadyElapsedMs variable
      - Timer delays use config values directly
      - No conditional delay calculations
      - Code simpler and more readable
      - All tests pass
    files:
      - src/common/middleware/feedback-middleware.ts
    testCoverage:
      - All timer tests pass
      - Timer delays match config values exactly

