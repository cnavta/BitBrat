        await this.feedbackMiddleware.beforeNext(event);
      }
      ```

      To:
      ```typescript
      if (this.feedbackMiddleware) {
        try {
          this.feedbackMiddleware.completeOperation(event.correlationId);
        } catch (err) {
          this.logger.warn('Failed to complete progress tracking', { error: err });
        }
      }
      ```

      Key requirements:
      - Change method name: beforeNext → completeOperation
      - Change from await to synchronous (completeOperation is sync)
      - Wrap in try/catch (fail-open)
      - Pass correlationId (not full event)
    priority: P0
    estimatedHours: 0.5
    dependencies:
