# Phase 1: Core Bug Fix (CRITICAL PATH)
# Estimated Duration: 2-3 hours

- id: TASK-21-001
  title: Fix FeedbackMiddleware to use annotation startedAt
  description: |
    Modify getOrCreateState() to extract and use the startedAt timestamp
    from the operation_context annotation instead of creating a new timestamp.

    **File:** src/common/middleware/feedback-middleware.ts:260-324

    **Changes:**
    1. Extract startedAt from operationContext ✅
    2. Handle number (milliseconds), string (ISO), and Date formats ✅
    3. Fallback to new Date() if annotation missing ✅
    4. Add debug logging for timestamp source ✅
    5. Add warning for invalid formats ✅

    **Success Criteria:**
    - State uses annotation timestamp when available ✅
    - Gracefully handles missing/invalid timestamps ✅
    - Logs indicate timestamp source (annotation vs current_time) ✅
  priority: critical
  status: completed
  assignee: claude
  dependencies: []
  estimated_hours: 1.5
  actual_hours: 0.5
  completed_at: 2026-08-21T16:30:00Z
