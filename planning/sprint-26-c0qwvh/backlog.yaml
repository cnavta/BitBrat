    acceptanceCriteria:
      - generateDockerCompose() calls buildInfrastructureCommand() for infra services
      - Generated compose includes command section when function returns value
      - Command section omitted when function returns undefined
      - Integration test validates command presence in generated files

    technicalApproach:
      - In generateDockerCompose(), after adding infrastructure services
