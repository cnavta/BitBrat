  # === PHASE 3: END-TO-END VALIDATION (P1) ===

  - id: T3.1
    title: Implement !ping E2E test
    priority: P1
    status: completed
    phase: 3
    category: validation
    estimatedHours: 4
    actualHours: 2
    blockedBy: [T1.2, T2.2]
    blocks: []
    description: |
      Create comprehensive E2E test that validates full agent-dev stack:
      1. Provision context
      2. Start all services
      3. Send !ping via WebSocket
      4. Verify pong response received
      5. Cleanup

      This is the ultimate validation that agent-dev environments work.

    acceptanceCriteria:
      - Test provisions agent-dev context (unique name)
      - Test starts services and waits for healthy state
      - Test connects to api-gateway WebSocket
      - Test sends chat.message.v1 with "!ping"
      - Test receives response with "pong" within 5 seconds
      - Test verifies message persisted to PostgreSQL
      - Test cleans up context in afterAll (even if test fails)

    technicalApproach:
      - Setup: Provision and start agent-dev context
      - Use WebSocket client to connect to ws://localhost:3004/ws/v1
      - Send message with correlationId for tracking
      - Listen for response with matching correlationId
      - Timeout after 5 seconds if no response
      - Query PostgreSQL to verify persistence
      - Teardown: Destroy context

    testPlan:
      - E2E test: Happy path (!ping → pong)
      - E2E test: Verify persistence (query snapshots table)
      - E2E test: Timeout if no response (negative test)
      - Test timeout: 120 seconds (full stack startup)
      - Cleanup: Always runs even if test fails

    files:
