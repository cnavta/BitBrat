# === RISK ASSESSMENT ===

risks:
  - risk: JetStream command translation more complex than expected
    impact: high
    probability: low
    mitigation: Start with NATS-only hardcoded solution, generalize later
    taskId: T1.1

  - risk: Environment template gets out of sync with architecture.yaml
    impact: medium
    probability: high
    mitigation: Document sync requirement in CLAUDE.md, consider auto-generation later
    taskId: T2.1

  - risk: E2E test flaky due to timing/resources
    impact: medium
    probability: medium
    mitigation: Generous timeouts, retry logic, skip in resource-constrained CI
    taskId: T3.1

  - risk: Pre-flight validation has false positives
    impact: low
    probability: medium
    mitigation: Make validation warnings non-blocking, provide override flag
    taskId: T5.1

  - risk: Documentation lag behind implementation
    impact: low
    probability: high
    mitigation: Update docs in same PR as code changes
    taskId: T6.1

