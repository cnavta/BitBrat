  # === PHASE 1: NATS JETSTREAM AUTO-CONFIGURATION (P0) ===

  - id: T1.1
    title: Implement infrastructure config → command translation
    priority: P0
    status: completed
    phase: 1
    category: infrastructure
    estimatedHours: 3
    actualHours: 2
    blockedBy: []
    blocks: [T1.2, T1.3, T3.1]
    issue: "Sprint 25 Discovery: NATS JetStream not enabled"
    description: |
      Add function to translate architecture.yaml infrastructure config
      into Docker Compose command arguments.

      Currently: config.jetstream: true is read but not applied
      Target: Generated compose includes command: ["-js", "-sd", "/data", "-m", "8222"]

    acceptanceCriteria:
      - buildInfrastructureCommand() function handles NATS JetStream
      - buildInfrastructureCommand() function handles Redis persistence
      - config.jetstream: true → command with -js flag
      - config.appendonly: yes → command with --appendonly yes
      - Function returns undefined for services without special commands
      - Unit tests cover all infrastructure services

    technicalApproach:
      - Add buildInfrastructureCommand() to generate-docker-compose.ts
      - Read infrastructure.docker.<service>.config from architecture.yaml
      - Map well-known config keys to command arguments
      - NATS: jetstream → -js, -sd /data, -m 8222
      - Redis: appendonly → --appendonly yes, --appendfsync <value>
      - Return undefined for services without command requirements

    testPlan:
      - Unit test: buildInfrastructureCommand('nats', { jetstream: true })
      - Unit test: buildInfrastructureCommand('redis', { appendonly: 'yes' })
      - Unit test: buildInfrastructureCommand('postgres', {}) returns undefined
      - Integration test: Generated compose includes command sections

    files:
      - tools/brat/src/context/generate-docker-compose.ts (modify)
      - tools/brat/src/context/__tests__/infrastructure-commands.test.ts (new)

    references:
      - architecture.yaml lines 199-234 (infrastructure.docker.messaging config)
      - docker-compose.local.yaml lines 30-50 (working NATS command example)

  - id: T1.2
    title: Integrate command builder into compose generation
