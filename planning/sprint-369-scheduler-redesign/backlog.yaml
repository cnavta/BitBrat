# Sprint 369: Scheduler Redesign — Trackable YAML Backlog
# Lead Implementor: Claude Code
# Date: 2026-07-26
# Status: ✅ COMPLETE

metadata:
  sprint: 369
  title: "Scheduler Redesign - Platform-Agnostic Internal Ticker"
  architect: "Claude Code"
  lead_implementor: "Claude Code"
  start_date: "2026-07-26"
  target_completion: "2026-07-29"
  estimated_hours: 12
  actual_hours: 6.0

objectives:
  - Replace GCP Cloud Scheduler dependency with internal setInterval timer
  - Achieve platform-agnostic scheduler (Docker, GCP, AWS, Azure, self-hosted)
  - Maintain backward compatibility with existing schedules
  - Add comprehensive test coverage (>80%)
  - Update all documentation

success_criteria:
  - Platform-agnostic (works on all Docker-based environments)
  - Zero external dependencies beyond PostgreSQL/NATS
  - Test coverage >80%
  - Schedules execute within 1 minute of nextRun
  - Graceful shutdown with no leaked timers
  - All existing schedules continue working

