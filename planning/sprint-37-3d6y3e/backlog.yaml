        - "Configuration is valid (cwd, npm path exist)"
        - "Server can start"
        - "Tools register correctly"
      acceptance:
        - "brat doctor includes MCP section"
        - "Reports server status (healthy/degraded/missing)"
        - "Suggests brat mcp setup if not configured"
      estimatedTime: "30 minutes"

