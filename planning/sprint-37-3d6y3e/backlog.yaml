  tasks:
    - id: P4-T1
      title: "Document tool naming convention"
      description: |
        Clarify how tools appear in Claude Code sessions.
        Test if namespace prefix is used (bitbrat-dev.config.show vs config.show).
      priority: P3
      status: pending
      files:
        - documentation/guides/mcp-dev-tools-reference.md
      research:
        - "Call config.show() and check exact tool name in logs"
        - "Determine if Claude uses server name as prefix"
        - "Document actual tool names for all 15 tools"
      acceptance:
        - "Tool naming documented with examples"
        - "Namespace behavior explained"
        - "All 15 tools listed with correct names"
      estimatedTime: "45 minutes"

    - id: P4-T2
      title: "Add example workflows using dev MCP tools"
      description: |
        Document common development workflows using MCP tools.
        E.g., deploy validation, debugging, data inspection.
      priority: P3
      status: pending
      files:
        - documentation/guides/mcp-setup.md
      workflows:
        - "Pre-deployment validation (config.validate, fleet.list)"
        - "Debugging service issues (fleet.info, fleet.logs, db.query)"
        - "Agent-dev testing (agent_dev.provision, deploy, verify, destroy)"
        - "Database inspection (db.collections, db.get, db.query)"
      acceptance:
        - "4+ workflows documented"
        - "Each includes example tool calls"
        - "Expected outputs shown"
      estimatedTime: "1 hour"

    - id: P4-T3
      title: "Create troubleshooting decision tree"
      description: |
        Visual flowchart for diagnosing MCP issues.
        Guides user from symptom to fix.
      priority: P3
      status: pending
      files:
        - documentation/guides/mcp-troubleshooting.md
      sections:
        - "Server not appearing → Check ~/.claude.json, run validate"
        - "Auth errors → Check MCP_DEV_TOKEN, verify fail-closed"
        - "Tool errors → Check context, verify services running"
        - "Performance issues → Check network, database connectivity"
      acceptance:
        - "Decision tree covers common issues"
        - "Each path leads to concrete fix"
        - "Includes brat mcp validate in flow"
      estimatedTime: "45 minutes"

    - id: P4-T4
      title: "Add MCP server health check to brat doctor"
      description: |
        Integrate MCP validation into brat doctor command.
        Checks server configuration and connectivity.
      priority: P3
      status: pending
      files:
        - tools/brat/src/oclif-commands/doctor.ts
      dependencies:
        - P2-T1
      checks:
