# ============================================================================
# RISK REGISTER
# ============================================================================

risks:
  - id: RISK-01
    description: "Redis Hash client-side sorting performance with large sessions"
    severity: low
    probability: medium
    mitigation: "Benchmark with 1000 users, verify p99 <100ms. Consider Redis Sorted Sets for future if needed."
    status: accepted

  - id: RISK-02
    description: "Session ID collisions"
    severity: low
    probability: low
    mitigation: "Append timestamp suffix on duplicate. Document in error handling."
    status: mitigated

  - id: RISK-03
    description: "TTL desync between Redis and DocumentStore"
    severity: low
    probability: medium
    mitigation: "DocumentStore stores expiresAt timestamp. Future cleanup job for orphans."
    status: accepted

  - id: RISK-04
    description: "Missing target value in getClosest() query"
    severity: medium
    probability: low
    mitigation: "Throw clear error with suggestion to specify target explicitly"
    status: mitigated

