  # --------------------------------------------------------------------------
  # Task 2.3: Implement Trust Score Validation (3 days)
  # --------------------------------------------------------------------------
  - id: T2.3
    title: Implement Trust Score Validation
    phase: 2
    priority: P1
    status: completed
    estimatedDays: 3
    assignee: null
    blockedBy: [T1.2, T1.3]
    blocks: [T3.1]

    note: |
      Implemented as part of T1.3 (RbacValidator Step 7 - Trust score validation).

    description: |
      Add multi-dimensional trust score validation to RbacValidator.
      Enforce minimum trust thresholds per dimension (reliability, fidelity, integrity, calibration).

    files:
      - src/apps/tool-orchestrator-service/modules/gateway/rbac-validator.ts (update)
      - src/apps/tool-orchestrator-service/modules/gateway/__tests__/rbac-validator.test.ts (update)

    subtasks:
      - id: T2.3.1
        title: Add trust validation logic
        status: not-started
        description: Implement trust score checks in RbacValidator

      - id: T2.3.2
        title: Implement scope matching
        status: not-started
        description: Match on 'tool-use' scope, fallback to 'general'

      - id: T2.3.3
        title: Implement dimension checks
        status: not-started
        description: Check each dimension threshold (reliability, fidelity, integrity, calibration)

      - id: T2.3.4
        title: Write tests for each dimension
        status: not-started
        description: Test reliability, fidelity, integrity, calibration separately

      - id: T2.3.5
        title: Test scope fallback logic
        status: not-started
        description: tool-use → general fallback

      - id: T2.3.6
        title: Test missing trust profile
        status: not-started
        description: No trust profile → DENIED

      - id: T2.3.7
        title: Integration test
        status: not-started
        description: High-risk tool with low-trust model → DENIED

    trustDimensions:
      reliability:
        description: Produces correct, useful results
        range: 0-100

      fidelity:
        description: Follows instructions and constraints
        range: 0-100

      integrity:
        description: Resists manipulation, respects boundaries
        range: 0-100

      calibration:
        description: Recognizes uncertainty and limitations
        range: 0-100

    acceptanceCriteria:
      - Trust score validation working for all 4 dimensions
      - Scope fallback logic (tool-use → general) working
      - Clear error messages with dimension details
      - Tests cover all edge cases

    testing:
      - Unit tests per dimension
      - Scope fallback tests
      - Missing profile tests
      - Integration tests

    exampleConfiguration: |
      # Admin tool (high trust required)
      rbac:
        minTrustThresholds:
          scope: 'tool-use'
          reliability: 95
          fidelity: 95
          integrity: 90
          calibration: 85

    notes: |
      Critical for security.
      Conservative thresholds recommended for high-risk tools.

