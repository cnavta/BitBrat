  # --------------------------------------------------------------------------
  # Task 1.3: Implement Dual-Layer RBAC Validator (4 days)
  # --------------------------------------------------------------------------
  - id: T1.3
    title: Implement Dual-Layer RBAC Validator
    phase: 1
    priority: P0
    status: completed
    estimatedDays: 4
    assignee: null
    blockedBy: []
    blocks: [T1.2, T2.2, T2.3]

    description: |
      Create RbacValidator with 7-step validation algorithm (User × Model).
      This enforces dual-layer permissions, tier restrictions, and trust scores.

    files:
      - src/apps/tool-orchestrator-service/modules/gateway/rbac-validator.ts
      - src/apps/tool-orchestrator-service/modules/gateway/__tests__/rbac-validator.test.ts

    subtasks:
      - id: T1.3.1
        title: Create RbacValidator class
        status: not-started
        description: Basic structure with validateToolAccess() method

      - id: T1.3.2
        title: Implement user role validation
        status: not-started
        description: Check required/denied user roles

      - id: T1.3.3
        title: Implement model role validation
        status: not-started
        description: Check required/denied model roles

      - id: T1.3.4
        title: Implement model tier enforcement
        status: not-started
        description: Check allowed/denied tiers (moved to T2.2 for detailed implementation)

      - id: T1.3.5
        title: Implement model tool policy
        status: not-started
        description: Check model allowlist/denylist

      - id: T1.3.6
        title: Implement trust score validation
        status: not-started
        description: Check multi-dimensional trust thresholds (moved to T2.3 for detailed implementation)

      - id: T1.3.7
        title: Add clear error messages
        status: not-started
        description: Reason codes + human-readable details

      - id: T1.3.8
        title: Write comprehensive test suite
        status: not-started
        description: 20+ test scenarios
        command: npm test -- rbac-validator.test.ts

    testScenarios:
      userRoleTests:
        - id: TS1
          description: User has required role → ALLOWED (if model passes)
          status: not-started

        - id: TS2
          description: User missing required role → DENIED
          status: not-started

        - id: TS3
          description: User has denied role → DENIED
          status: not-started

        - id: TS4
          description: User has multiple roles, one denied → DENIED
          status: not-started

      modelRoleTests:
        - id: TS5
          description: Model has required role → ALLOWED (if user passes)
          status: not-started

        - id: TS6
          description: Model missing required role → DENIED
          status: not-started

        - id: TS7
          description: Model has denied role → DENIED
          status: not-started

        - id: TS8
          description: Model has multiple roles, one denied → DENIED
          status: not-started

      combinedTests:
        - id: TS9
          description: User OK, model fails → DENIED
          status: not-started

        - id: TS10
          description: User fails, model OK → DENIED
          status: not-started

        - id: TS11
          description: Both pass → ALLOWED
          status: not-started

        - id: TS12
          description: Both fail → DENIED
          status: not-started

      tierTests:
        - id: TS13
          description: Model tier in allowed list → ALLOWED
          status: not-started

        - id: TS14
          description: Model tier not in allowed list → DENIED
          status: not-started

        - id: TS15
          description: Model tier in denied list → DENIED
          status: not-started

        - id: TS16
          description: Empty allowed list (allow all) → ALLOWED
          status: not-started

      trustTests:
        - id: TS17
          description: All trust dimensions pass → ALLOWED
          status: not-started

        - id: TS18
          description: Reliability below threshold → DENIED
          status: not-started

        - id: TS19
          description: Fidelity below threshold → DENIED
          status: not-started

        - id: TS20
          description: Integrity below threshold → DENIED
          status: not-started

        - id: TS21
          description: Calibration below threshold → DENIED
          status: not-started

        - id: TS22
          description: Missing trust scope, fallback to general → ALLOWED
          status: not-started

        - id: TS23
          description: No trust profile → DENIED
          status: not-started

      policyTests:
        - id: TS24
          description: Tool in model allowlist → ALLOWED
          status: not-started

        - id: TS25
          description: Tool not in model allowlist (non-empty) → DENIED
          status: not-started

        - id: TS26
          description: Tool in model denylist → DENIED
          status: not-started

        - id: TS27
          description: Empty allowlist (allow all) → ALLOWED
          status: not-started

    acceptanceCriteria:
      - All 27 test scenarios pass
      - Clear error messages for all denial reasons
      - P95 validation latency < 1ms
      - 95%+ test coverage

    testing:
      - Unit tests for each validation step
      - Edge case tests (empty lists, missing scopes)
      - Performance tests (P95 < 1ms)

    notes: |
      Core security logic. Must be thoroughly tested.
      Performance critical - optimize for sub-millisecond validation.

