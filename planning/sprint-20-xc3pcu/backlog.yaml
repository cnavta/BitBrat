## Week 2: Memory Management & Observability

tasks:
  - id: P3-007
    title: Implement MemoryManager for Event Eviction
    description: |
      Create MemoryManager to track total events across all windows and evict
      oldest when threshold reached. Prevent OOM errors under high load.
    priority: P1
    status: completed
    estimated_hours: 6
    dependencies: []
    files:
      - src/services/event-stream-analyzer/memory-manager.ts (create)
      - src/services/event-stream-analyzer/memory-manager.test.ts (create)
    acceptance_criteria:
      - Tracks events per observer
      - Detects when adding events would exceed limit
      - Returns eviction candidates (oldest or largest-window strategy)
      - Provides current memory stats
      - Unit tests for both eviction strategies pass
    tests:
      - Unit test: Event tracking across observers
      - Unit test: Eviction candidate selection (oldest strategy)
      - Unit test: Eviction candidate selection (largest-window strategy)
      - Unit test: Warning threshold detection
    notes: |
      Default limit: 10,000 events total. Warning at 80%. Eviction strategies:
      'oldest' (FIFO across all windows) or 'largest-window' (evict from
      window with most events). Make strategy configurable.

  - id: P3-008
    title: Integrate MemoryManager into Window Processing
    description: |
      Wire MemoryManager into event processing pipeline. Check limits before
      adding events, trigger eviction when needed, update stats.
    priority: P1
    status: completed
    estimated_hours: 3
    dependencies: [P3-007]
    files:
      - src/apps/event-stream-analyzer-service.ts (modify)
      - src/services/event-stream-analyzer/rxjs-window-manager.ts (modify)
    acceptance_criteria:
      - Events rejected when memory limit reached
      - Eviction triggered automatically
      - Stats updated on every event add/remove
      - Eviction logged with context
      - Overhead < 5ms per event
    tests:
      - Integration test: Memory limit enforcement
      - Integration test: Automatic eviction
      - Performance test: Overhead measurement
    notes: |
      Add evictOldestEvents(observerId, count) method to RxJSWindowManager.
      Log evictions with observerId, strategy, and count. Emit metrics for
      eviction events.

  - id: P3-009
    title: Implement Prometheus Metrics Collection
    description: |
      Create MetricsCollector to export Prometheus metrics for monitoring.
      Track window size, processing latency, memory usage, and errors.
    priority: P1
    status: pending
    estimated_hours: 6
    dependencies: []
    files:
      - src/services/event-stream-analyzer/metrics-collector.ts (create)
      - src/services/event-stream-analyzer/metrics-collector.test.ts (create)
    acceptance_criteria:
      - Metrics exported on /metrics endpoint
      - Window metrics (size, age, event count) by observer
      - Processing metrics (received, filtered, evicted, latency)
      - Resource metrics (memory, total events, subscriptions)
      - Error metrics by type and observer
    tests:
      - Unit test: Metric registration
      - Unit test: Metric value updates
      - Integration test: /metrics endpoint returns valid Prometheus format
    notes: |
      Use prom-client library (already in dependencies). Register metrics in
      service setup(). Update metrics on each window event. Consider using
      histograms for latency (not just gauges).

  - id: P3-010
    title: Enhanced Structured Logging
    description: |
      Improve logging across event-stream-analyzer with correlation IDs,
      consistent structured fields, and appropriate log levels.
    priority: P2
    status: pending
    estimated_hours: 3
    dependencies: []
    files:
      - src/apps/event-stream-analyzer-service.ts (modify)
      - src/services/event-stream-analyzer/*.ts (modify all components)
    acceptance_criteria:
      - All logs include observerId (when applicable)
      - Structured fields for queryability (JSON)
      - Correlation IDs for request tracing
      - Appropriate log levels (ERROR, WARN, INFO, DEBUG)
      - Performance overhead < 2ms per log entry
    tests:
      - Unit test: Log structure validation
      - Performance test: Logging overhead
    notes: |
      Use existing logger from this.getLogger(). Add context fields:
      { observerId, windowType, eventCount, analysisLatencyMs, llmCost }.
      DEBUG for event filtering, INFO for window lifecycle, WARN for eviction,
      ERROR for failures.

  - id: P3-011
    title: Health Checks and Readiness Probes
    description: |
      Implement /healthz (liveness) and /readyz (readiness) endpoints for
      Kubernetes integration and operational monitoring.
    priority: P2
    status: pending
    estimated_hours: 2
    dependencies: []
    files:
      - src/apps/event-stream-analyzer-service.ts (modify)
    acceptance_criteria:
      - GET /healthz returns 200 OK if service running
      - GET /readyz returns 200 OK if ready for traffic
      - Readiness checks: DB connection, NATS connection, observers loaded
      - Health checks work in Kubernetes
    tests:
      - Integration test: /healthz endpoint
      - Integration test: /readyz endpoint
      - Integration test: Readiness fails when DB down
    notes: |
      Follow standard Bit health check pattern. Readiness should fail if:
      PostgreSQL unreachable, NATS disconnected, no observers loaded, or
      snapshot manager unhealthy (if enabled).

  - id: P3-012
    title: Alert Rule Definitions
    description: |
      Define Prometheus alert rules for operational issues: memory pressure,
      high error rate, slow analysis. Create Grafana dashboard.
    priority: P2
    status: pending
    estimated_hours: 2
    dependencies: [P3-009]
    files:
      - infrastructure/alerts/event-stream-analyzer.yaml (create)
      - infrastructure/grafana/event-stream-analyzer-dashboard.json (create)
    acceptance_criteria:
      - Alert on memory usage > 90% for 5 minutes
      - Alert on error rate > 10% for 5 minutes
      - Alert on analysis latency > 30s (p95) for 10 minutes
      - Grafana dashboard shows key metrics
    tests:
      - Manual test: Trigger alerts in staging
      - Manual test: Verify dashboard in Grafana
    notes: |
      Use Prometheus AlertManager integration. Dashboard panels: window count,
      event rate, analysis latency, memory usage, error rate. Add panels for
      top observers by event count and analysis frequency.

