## Week 1: LLM Integration & Snapshot Foundation

tasks:
  - id: P3-001
    title: Integrate StreamAnalystEngine for Real LLM Analysis
    description: |
      Replace stub event formatting with StreamAnalystEngine for GPT-4 powered
      summarization. Support custom prompts per observer, inspection mode, and
      cost tracking.
    priority: P0
    status: completed
    estimated_hours: 6
    dependencies: []
    files:
      - src/apps/event-stream-analyzer-service.ts (modify)
      - src/services/stream-analyst/engine.ts (reuse existing)
    acceptance_criteria:
      - LLM analysis replaces stub summaries
      - Existing prompts (standard-chat-summary-v1) work correctly
      - Inspection mode can be enabled per observer
      - Cost tracking logged for each LLM call
      - Integration test with mock LLM responses passes
    tests:
      - Integration test: LLM analysis flow end-to-end
      - Unit test: Prompt selection based on observer config
      - Unit test: Inspection mode toggling
    notes: |
      Leverage existing StreamAnalystEngine without modification. Focus on
      integration with multi-observer system and proper error handling.

  - id: P3-002
    title: Implement SnapshotManager for Window State Persistence
    description: |
      Create SnapshotManager component for periodic window state snapshots to
      PostgreSQL. Enables crash recovery with max 5-min data loss.
    priority: P0
    status: completed
    estimated_hours: 8
    dependencies: [P3-006]
    files:
      - src/services/event-stream-analyzer/snapshot-manager.ts (create)
      - src/services/event-stream-analyzer/snapshot-manager.test.ts (create)
    acceptance_criteria:
      - Snapshot loop runs every 5 minutes (configurable)
      - Window states persisted with event IDs and metadata
      - Restore logic reconstructs windows from snapshots
      - Graceful error handling (snapshot failure doesn't crash service)
      - Unit tests for snapshot/restore cycle pass
    tests:
      - Unit test: Snapshot creation and persistence
      - Unit test: Window restoration from snapshot
      - Unit test: Stale snapshot handling
      - Unit test: Empty snapshot (cold start)
    notes: |
      Store event IDs (not full events) to minimize snapshot size. Fetch full
      events on restore. Consider snapshot compression if size becomes issue.

  - id: P3-003
    title: Integrate Snapshot Lifecycle into Service
    description: |
      Wire SnapshotManager into event-stream-analyzer-service lifecycle. Start
      snapshot loop after observer loading, restore on startup, snapshot on
      shutdown.
    priority: P0
    status: completed
    estimated_hours: 4
    dependencies: [P3-002]
    files:
      - src/apps/event-stream-analyzer-service.ts (modify)
      - src/services/event-stream-analyzer/rxjs-window-manager.ts (modify)
    acceptance_criteria:
      - Snapshot loop starts after observer initialization
      - Windows restored from last snapshot on startup
      - Final snapshot created in onShutdown hook
      - Service startup time < 500ms with 100 observers
      - Snapshot overhead < 100ms
    tests:
      - Integration test: Service restart with snapshot restore
      - Integration test: Graceful shutdown with final snapshot
      - Performance test: Startup time with large snapshots
    notes: |
      Add getAllWindowStates() method to RxJSWindowManager to expose current
      state for snapshotting. Ensure snapshot happens before subscriptions
      destroyed on shutdown.

  - id: P3-004
    title: Crash Recovery Integration Tests
    description: |
      Comprehensive test suite for crash recovery scenarios. Verify max 5-min
      data loss on crash, zero data loss on graceful shutdown.
    priority: P0
    status: completed
    estimated_hours: 4
    dependencies: [P3-003]
    files:
      - src/services/event-stream-analyzer/crash-recovery-integration.test.ts (create)
    acceptance_criteria:
      - Mid-window crash test: events restored after restart
      - Graceful shutdown test: full recovery with zero data loss
      - No snapshot test: clean initialization
      - Stale snapshot test: old data discarded correctly
      - All tests pass with fake timers
    tests:
      - Integration test: Mid-window crash recovery
      - Integration test: Graceful shutdown recovery
      - Integration test: Cold start (no snapshots)
      - Integration test: Stale snapshot handling
    notes: |
      Use jest.useFakeTimers() for deterministic testing. Simulate crash by
      calling close() without onShutdown hook. Verify event IDs match before
      and after recovery.

  - id: P3-005
    title: Graceful Shutdown Implementation
    description: |
      Implement proper shutdown sequence: stop accepting events, trigger final
      snapshot, cleanup subscriptions. Handle SIGTERM/SIGINT signals.
    priority: P1
    status: completed
    estimated_hours: 2
    dependencies: [P3-003]
    notes: |
      Completed as part of P3-003. gracefulShutdown() method implemented with:
      - Stop periodic snapshot timer
      - Stop SnapshotManager
      - Take final snapshot (zero data loss)
      - Cleanup subscriptions (windowManager.destroy(), subscriptionManager.destroy())
      - Wired to onShutdown() hook
    files:
      - src/apps/event-stream-analyzer-service.ts (modify)
    acceptance_criteria:
      - SIGTERM/SIGINT trigger onShutdown hook
      - Subscriptions stopped before snapshot
      - Final snapshot created successfully
      - RxJS subscriptions cleaned up
      - Exit code 0 on clean shutdown
    tests:
      - Integration test: SIGTERM handling
      - Integration test: SIGINT handling
      - Unit test: Shutdown sequence order
    notes: |
      Set isShuttingDown flag to reject new events during shutdown. Ensure
      snapshot completes before closing database connection. Add 30-second
      timeout for graceful shutdown.

  - id: P3-006
    title: Database Migration for Window Snapshots
    description: |
      Create PostgreSQL migration for window_snapshots table. Store observer_id,
      window state (JSONB), and snapshot timestamp.
    priority: P0
    status: completed
    estimated_hours: 1
    dependencies: []
    files:
      - infrastructure/postgres/migrations/019-add-window-snapshots.sql (create)
    acceptance_criteria:
      - Migration creates window_snapshots table
      - Indexes on observer_id (PK), snapshot_at, and data (GIN)
      - Foreign key to stream_observers with CASCADE delete
      - Migration runs successfully in local/staging
    tests:
      - Manual test: Run migration in local PostgreSQL
      - Manual test: Verify indexes created
      - Manual test: Insert/query snapshot data
    notes: |
      Use JSONB for flexible schema evolution. GIN index enables fast queries
      on window state properties. CASCADE delete ensures orphaned snapshots
      cleaned up when observer deleted.

