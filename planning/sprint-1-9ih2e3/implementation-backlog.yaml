  - id: ROLL-003
    title: "Deploy idempotency layer to production (gradual rollout)"
    description: |
      Gradual production rollout using canary deployment strategy.

      Rollout phases:
      1. **Canary (10%):**
         - Enable idempotency on 10% of ingress-egress instances
         - Monitor for 2 hours
         - Verify metrics, no errors

      2. **Partial (50%):**
         - Expand to 50% of instances
         - Monitor for 4 hours
         - Verify performance stable

      3. **Full (100%):**
         - Enable on all instances
         - Monitor for 24 hours
         - Establish baseline metrics

      Rollback plan:
      - If errors > 0.1% → rollback to previous phase
      - If latency > 150ms p95 → investigate, potentially rollback
      - Rollback: Set IDEMPOTENCY_DRIVER=none, redeploy

      Success criteria:
      - Zero errors
      - Latency within targets
      - No user-reported issues
      - Dedupe hit rate > 0% (proving it works)
