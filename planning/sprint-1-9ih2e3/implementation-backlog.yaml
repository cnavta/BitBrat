  - id: FOUND-004
    title: "Implement idempotency middleware core logic"
    description: |
      Create idempotency middleware wrapper for message handlers.

      File: src/common/idempotency-middleware.ts

      Core function:
      ```typescript
      export async function wrapWithIdempotency<T>(
        handler: MessageHandler<T>,
        topic: string,
        config: IdempotencyConfig,
        redisClient: RedisResource,
        logger: Logger
      ): Promise<MessageHandler<T>>;
      ```

      Logic:
      1. Derive idempotency key (default or custom keyFn)
      2. Add prefix: `{config.keyPrefix}:{rawKey}`
      3. Redis check: SET key "1" EX ttl NX
      4. If returns null → duplicate, log + ack + return
      5. If returns OK → new, proceed to handler
      6. On Redis error → log warning, proceed to handler (fail-open)

      Metrics:
      - Log: 'idempotency.check.duplicate' (when deduplicated)
      - Log: 'idempotency.check.new' (when new)
      - Log: 'idempotency.error' (on Redis error)

      Export types:
      ```typescript
      export interface IdempotencyConfig {
        enabled: boolean;
        ttl?: number;
        keyFn?: (event: any, topic: string) => string;
      }

      export type IdempotencyKeyFn = (event: any, topic: string) => string;
      ```
    priority: P0
    effort: M
    status: todo
    phase: 1
    dependencies: [FOUND-001, FOUND-003]
    acceptanceCriteria:
      - "Middleware function created"
      - "Key derivation logic (default + custom)"
      - "Redis SET NX EX check"
