  - id: VALID-002
    title: "Chaos testing: Redis failure scenarios"
    description: |
      Test system behavior under Redis failure conditions.

      Scenarios:
      1. **Redis connection loss:**
         - Stop Redis mid-processing
         - Verify messages still processed (fail-open)
         - Verify no crashes
         - Restart Redis, verify recovery

      2. **Redis timeout:**
         - Simulate slow Redis (add latency)
         - Verify timeout triggers fail-open
         - Verify messages processed

      3. **Redis memory exhaustion:**
         - Fill Redis memory
         - Verify eviction policy works (LRU)
         - Verify no message loss

      4. **Network partition:**
         - Block network between service and Redis
         - Verify fail-open behavior
         - Restore network, verify recovery

