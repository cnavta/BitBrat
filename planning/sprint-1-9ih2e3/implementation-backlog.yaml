      ```typescript
      this.resourceManagers = {
        publisher: new PublisherManager(),
        firestore: new FirestoreManager(),
        documentStore: new DocumentStoreManager(),
        redis: new RedisManager(),  // NEW
        ...(options?.resources || {}),
      };
      ```

      3. **Update onMessage() to wrap handler:**
      ```typescript
      protected async onMessage<T = any>(...) {
        const idempotencyConfig = options?.idempotency
          || this.getIdempotencyConfig(cfg.destination);

        if (idempotencyConfig?.enabled) {
          const redisClient = this.getResource<RedisResource>('redis');
          if (redisClient) {
            handler = await wrapWithIdempotency(
              handler,
              cfg.destination,
              idempotencyConfig,
              redisClient,
              this.logger
            );
          } else {
            this.logger.warn('idempotency.redis_unavailable', { topic: cfg.destination });
          }
        }

        // ... existing subscribe logic ...
      }
      ```

      4. **Add helper method:**
      ```typescript
      protected getIdempotencyConfig(topic: string): IdempotencyConfig | undefined {
        // Check static IDEMPOTENCY_CONFIG on subclass
        const Ctor = this.constructor as any;
        return Ctor.IDEMPOTENCY_CONFIG?.[topic];
      }
      ```

      Ensure backward compatibility (no breaking changes).
