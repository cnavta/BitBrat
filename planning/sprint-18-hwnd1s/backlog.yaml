# Stream Analyst Real-Time v4: Prioritized Backlog
# Track implementation progress across all phases
# Format: YAML-based task tracking with dependencies and estimates

metadata:
  project: stream-analyst-realtime-v4
  owner: Lead Implementor
  architecture: documentation/technical-architecture/stream-analyst-realtime-v4.md
  execution_plan: planning/stream-analyst-realtime/EXECUTION_PLAN.md
  created: 2026-08-18
  target_completion: 2026-10-27 (Week 10)

# Priority levels: P0 (blocker), P1 (critical), P2 (important), P3 (nice-to-have)
# Status: not-started, in-progress, blocked, completed, skipped

# ==============================================================================
# PHASE 1: PROOF OF CONCEPT (Sprint 1)
# ==============================================================================

phase_1:
  name: Proof of Concept
  sprint: 1
  duration: 2 weeks
  goal: Validate RxJS-based streaming with single observer
  status: completed
  decision_point: CONDITIONAL GO - Proceed to Phase 2 with latency validation requirement

  tasks:
    # --- Setup & Dependencies (2 hours) ---
    - id: P1-001
      name: Install RxJS dependency
      description: Add rxjs package to package.json
      priority: P0
      status: completed
      estimated_hours: 0.5
      assignee: Lead Implementor
      dependencies: []
      acceptance_criteria:
        - rxjs added to package.json
        - npm install succeeds
        - TypeScript types available
      files:
        - package.json
      notes: RxJS already present in dependencies

    - id: P1-002
      name: Create event-stream-analyzer service using brat CLI
      description: Use brat bit create to scaffold new service with all required files
      priority: P0
      status: completed
      estimated_hours: 0.5
      assignee: Lead Implementor
      dependencies: []
      acceptance_criteria:
        - Run "brat bit create event-stream-analyzer --profile llm --exposure platform-only --stage analyze --register --active"
        - src/apps/event-stream-analyzer-service.ts created
        - Test file, Dockerfile, compose file generated
        - Service registered in architecture.yaml
        - stream-analyst-service marked as active:false in architecture.yaml
      files:
        - src/apps/event-stream-analyzer-service.ts
        - src/apps/event-stream-analyzer-service.test.ts
        - Dockerfile.event-stream-analyzer
        - infrastructure/docker-compose/services/event-stream-analyzer.compose.yaml

    - id: P1-003
      name: Create directory structure and review existing code for reuse
      description: Create event-stream-analyzer directory and identify reusable parts from stream-analyst
      priority: P1
      status: completed
      estimated_hours: 1
      assignee: Lead Implementor
      dependencies: [P1-002]
      acceptance_criteria:
        - src/services/event-stream-analyzer/ directory created
        - List of reusable components from stream-analyst documented
        - Plan for copying/adapting StreamBuffer and Engine
      files:
        - src/services/event-stream-analyzer/ (new directory)
        - src/services/stream-analyst/stream-buffer.ts (review for copy)
        - src/services/stream-analyst/engine.ts (review for copy)
      notes: |
        Reusable components identified:
        1. StreamBuffer (stream-buffer.ts) - PII redaction, token counting, event normalization - REUSE AS-IS
        2. StreamAnalystEngine (engine.ts) - LLM analysis, prompt assembly - ADAPT for window-based input
        3. repository.ts - Database operations - MAY REUSE for observer persistence in Phase 2
        Plan: Copy StreamBuffer unchanged, adapt Engine.summarize() to accept events array instead of querying DB

    # --- Core RxJS Window Manager (8 hours) ---
    - id: P1-004
      name: Implement RxJSWindowManager core class
      description: Create WindowManager with Subject, bufferTime, event filtering
      priority: P0
      status: completed
      estimated_hours: 4
      assignee: Lead Implementor
      dependencies: [P1-001, P1-002]
      acceptance_criteria:
        - RxJSWindowManager class implemented
        - createSlidingWindow() method functional
        - addEvent() routes to Subject
        - Event filtering logic working (platform, eventType, channel)
      files:
        - src/services/event-stream-analyzer/rxjs-window-manager.ts

    - id: P1-005
      name: Implement subscription cleanup and error handling
      description: Add removeObserver(), destroy(), error handlers for RxJS subscriptions
      priority: P0
      status: completed
      estimated_hours: 2
      assignee: Lead Implementor
      dependencies: [P1-004]
      acceptance_criteria:
        - removeObserver() unsubscribes correctly
        - destroy() cleans up all subscriptions
        - Error handling logs and doesn't crash service
      files:
        - src/services/event-stream-analyzer/rxjs-window-manager.ts

    - id: P1-006
      name: Unit tests for RxJSWindowManager
      description: Test sliding window timing, event filtering, subscription management
      priority: P1
      status: completed
      estimated_hours: 2
      assignee: Lead Implementor
      dependencies: [P1-005]
      acceptance_criteria:
        - Test sliding window emits every slideMs
        - Test event filtering (platform, eventType)
        - Test subscription cleanup prevents leaks
        - All tests pass
      files:
        - src/services/event-stream-analyzer/rxjs-window-manager.test.ts

    # --- Service Integration (6 hours) ---
    - id: P1-007
      name: Implement EventStreamAnalyzerService skeleton
      description: Create new service class extending Bit, with setup() and close()
      priority: P0
      status: completed
      estimated_hours: 2
      assignee: Lead Implementor
      dependencies: [P1-002, P1-003]
      acceptance_criteria:
        - EventStreamAnalyzerService extends Bit
        - CONFIG_DEFAULTS defined
        - setup() method defined
        - close() method defined
      files:
        - src/apps/event-stream-analyzer-service.ts

    - id: P1-008
      name: Integrate RxJSWindowManager into service
      description: Instantiate WindowManager, create POC observer, connect to handleWindowClose
      priority: P0
      status: completed
      estimated_hours: 2
      assignee: Lead Implementor
      dependencies: [P1-005, P1-007]
      acceptance_criteria:
        - WindowManager instantiated in setup()
        - POC observer created (hardcoded config)
        - createSlidingWindow() called with POC observer
        - handleWindowClose() callback defined
      files:
        - src/apps/event-stream-analyzer-service.ts

    - id: P1-009
      name: Subscribe to internal.contextualization.v1 (passive observer)
      description: Use onMessage() with separate queue, route events to WindowManager
      priority: P0
      status: completed
      estimated_hours: 2
      assignee: Lead Implementor
      dependencies: [P1-008]
      acceptance_criteria:
        - Subscription to internal.contextualization.v1 working
        - Separate queue used (event-stream-analyzer-observer)
        - Events routed to windowManager.addEvent()
        - No next() call (passive observer pattern)
      files:
        - src/apps/event-stream-analyzer-service.ts

    # --- Window Close Handling & LLM Integration (4 hours) ---
    - id: P1-010
      name: Implement handleWindowClose with Engine integration
      description: Call existing StreamAnalystEngine.summarize() when window closes
      priority: P0
      status: completed
      estimated_hours: 2
      assignee: Lead Implementor
      dependencies: [P1-003, P1-009]
      acceptance_criteria:
        - handleWindowClose() receives events array
        - Calls engine.summarize() with appropriate request
        - Handles errors gracefully
        - Logs window closure
      files:
        - src/apps/event-stream-analyzer-service.ts

    - id: P1-011
      name: Publish results to internal.summarization.report.v1 and internal.egress.v1
      description: Dual publishing pattern (audit trail + user delivery)
      priority: P0
      status: completed
      estimated_hours: 2
      assignee: Lead Implementor
      dependencies: [P1-010]
      acceptance_criteria:
        - Summary published to internal.summarization.report.v1
        - Summary published to internal.egress.v1 (if delivery configured)
        - Both publications succeed
        - Logs confirm publishing
      files:
        - src/apps/event-stream-analyzer-service.ts

    # --- Integration Testing (4 hours) ---
    - id: P1-012
      name: End-to-end integration test
      description: Test full flow from NATS event → window closure → egress publishing
      priority: P1
      status: completed
      estimated_hours: 4
      assignee: Lead Implementor
      dependencies: [P1-011]
      acceptance_criteria:
        - Publish 10 test events to internal.contextualization.v1
        - Wait for window to close (1 min slide)
        - Verify summary published to egress
        - Test passes consistently
      files:
        - src/apps/event-stream-analyzer-service.test.ts

    # --- Performance Benchmarking (4 hours) ---
    - id: P1-013
      name: Create benchmark script
      description: Measure latency, memory usage, throughput for POC
      priority: P1
      status: completed
      estimated_hours: 2
      assignee: Lead Implementor
      dependencies: [P1-011]
      acceptance_criteria:
        - Script publishes 1000 events over 60 seconds
        - Measures memory increase
        - Measures latency (event → analysis)
        - Outputs benchmark report
      files:
        - scripts/benchmark-event-stream-analyzer.ts

    - id: P1-014
      name: Run benchmark and document results
      description: Execute benchmark, analyze results, create go/no-go recommendation
      priority: P1
      status: completed
      estimated_hours: 2
      assignee: Lead Implementor
      dependencies: [P1-013]
      acceptance_criteria:
        - Benchmark executed successfully
        - Results documented (latency, memory, throughput)
        - Go/no-go recommendation made
        - Report shared with stakeholders
      files:
        - planning/stream-analyst-realtime/POC_BENCHMARK_REPORT.md

    # --- Sprint 1 Deliverables ---
    - id: P1-015
      name: Sprint 1 retrospective and go/no-go decision
      description: Team review of POC results, decision to proceed or pivot
      priority: P0
      status: completed
      estimated_hours: 2
      assignee: Lead Implementor
      dependencies: [P1-014]
      acceptance_criteria:
        - Team meeting held
        - POC results presented
        - Go/no-go decision documented
        - If GO, proceed to Phase 2
        - If NO-GO, pivot to database polling (v3)
      files:
        - planning/stream-analyst-realtime/SPRINT_1_RETRO.md

