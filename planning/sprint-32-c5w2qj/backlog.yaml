# Risk Management
risks:
  - id: RISK-1
    description: "Category D bugs more complex than expected"
    likelihood: medium
    impact: high
    mitigation: "Timebox investigation to 30min per suite, defer if blocked"
    contingency: "Document complexity, create dedicated bug-fix sprint"

  - id: RISK-2
    description: "Environmental fixes create new issues"
    likelihood: low
    impact: medium
    mitigation: "Test in isolation AND full suite after each fix"
    contingency: "Rollback to previous commit, re-investigate"

  - id: RISK-3
    description: "Can't reach 100% pass rate in single sprint"
    likelihood: low
    impact: high
    mitigation: "Prioritize Category D (legitimate bugs) over environmental"
    contingency: "Document remaining failures clearly, defer to Sprint 33"

  - id: RISK-4
    description: "Fixes introduce regressions"
    likelihood: low
    impact: high
    mitigation: "Run full suite after each phase"
    contingency: "Granular commits enable cherry-pick or rollback"

