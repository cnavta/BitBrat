# Dependencies & Execution Order
execution_order:
  - phase: phase_0_setup
    sequence: [T0, T1]
    blocking: true
    description: "Must establish baseline before any fixes"

  - phase: phase_1_infrastructure
    sequence: [T2, T3, T4]
    depends_on: phase_0_setup
    can_parallelize: false
    description: "Sequential fixes, validate at end"

  - phase: phase_2_environmental
    sequence: [T5, T6, T7]
    depends_on: phase_0_setup
    can_parallelize_with: [phase_1_infrastructure, phase_3_bugs]
    description: "Can run in parallel with other phases after baseline"

  - phase: phase_3_bugs
    sequence: [T8, T9, T10, T11]
    depends_on: phase_0_setup
