    status: done
    dependencies: [P0-101]
    acceptance_criteria:
      - sendText(text, target) delegates to client.sendText()
      - sendWhisper(text, userId) delegates to client.sendWhisper()
      - banUser(platformUserId, reason) delegates to client.banUser()
