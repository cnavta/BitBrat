# ============================================================================

rollback_triggers:
  - task: P0-306
    condition: "Feature parity matrix shows <100% pass rate on core functionality"
    action: "Rollback to Phase 1 - investigate adapter implementation"

  - task: P0-404
    condition: "OAuth token refresh broken or broadcaster client broken"
    action: "Partial rollback - keep adapter but revert egress usage"

  - task: P0-502
    condition: "Egress routing via ConnectorManager fails"
