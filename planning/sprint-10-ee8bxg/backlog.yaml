# ============================================================================
# TRACKING NOTES
# ============================================================================

tracking_notes: |
  How to use this backlog:

  1. Update task status as work progresses:
     - todo → in_progress → done
     - Or: todo → blocked (with reason)

  2. Check dependencies before starting a task:
     - All dependency tasks must be 'done'

  3. Follow priority order within each phase:
     - P0 tasks must be done first
     - P1 tasks should be done next
     - P2/P3 tasks can be deferred if time constrained

  4. Validation tasks (ending in 4, 6) are checkpoints:
     - Do not proceed to next phase if validation fails

  5. Update request-log.md after completing each phase:
     - Document what was accomplished
     - Note any issues or deviations
     - Record test results

  6. If blocked:
     - Document blocker in task notes
     - Update status to 'blocked'
     - Escalate if critical (P0) task

