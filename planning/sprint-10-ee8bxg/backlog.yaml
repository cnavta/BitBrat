    description: "Implement start(), stop(), getSnapshot() with delegation to client"
    estimate_minutes: 30
    status: todo
    dependencies: [P0-100]
    acceptance_criteria:
      - start() delegates to client.start()
      - stop() delegates to client.stop()
      - getSnapshot() delegates to client.getSnapshot()
      - All methods properly typed
      - Error handling added
      - Logging added (debug level)
      - TypeScript compiles without errors
    outputs:
      - Lifecycle methods implemented
    code_snippet: |
      async start(): Promise<void> {
        logger.debug('twitch.adapter.start');
        await this.client.start();
      }

      async stop(): Promise<void> {
        logger.debug('twitch.adapter.stop');
        await this.client.stop();
      }

      getSnapshot(): ConnectorSnapshot {
        return this.client.getSnapshot();
      }

