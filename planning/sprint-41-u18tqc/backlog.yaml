      - COMP-003
    description: >
      Comprehensive unit test suite for CompositionCompiler covering
      validation, cycle detection, and dependency resolution.
    files:
      - src/common/composition/compiler.test.ts
    subtasks:
      - Test successful compilation
      - Test tool resolution (tool exists)
      - Test tool resolution (missing tool error)
      - Test cycle detection (A → B → A direct cycle)
      - Test cycle detection (A → B → C → A indirect)
      - Test cycle detection (no cycle case)
      - Test reference validation (valid references)
      - Test reference validation (undefined step error)
      - Test dependency extraction
      - Test content hash stability
      - Mock ToolRegistry for isolated testing
    acceptance:
      - All tests pass
      - Cycle detection algorithm validated
      - Code coverage >90%
      - Mock ToolRegistry works correctly
    tests:
      - npm test compiler.test.ts

  - id: COMP-008
    title: Implement CompositionExecutor
    phase: core-runtime
    priority: P0
    status: todo
    effort: 6h
    assignee: null
    dependencies:
      - COMP-001
      - COMP-004
    description: >
      Implement executor that runs compiled compositions by sequentially
      executing steps and resolving references.
    files:
      - src/common/composition/executor.ts
    subtasks:
      - Create CompositionExecutor class with ToolRegistry + Logger
      - Implement execute(compiled, ctx) method
      - Implement executeStep() dispatcher
      - Implement executeCallStep() for tool invocation
      - Implement executeIfStep() for conditional values
      - Implement resolveValue() for ValueExpression resolution
      - Implement resolveReference() for namespace resolution
      - Implement navigatePointer() for JSON Pointer traversal
      - Implement evaluateCondition() for all condition operators
      - Add input schema validation (using AJV)
      - Add output schema validation (using AJV)
      - Add execution state management
      - Add comprehensive logging (debug, info, error levels)
      - Add error handling and recovery
      - Add JSDoc documentation
    acceptance:
      - Sequential execution works correctly
      - References resolve correctly ($input, $context, $steps)
      - All condition operators work (equals, greaterThan, lessThan, etc.)
      - Logical combinators work (all, any, not)
      - Guarded steps (when: false) skip correctly
      - Nested object/array resolution works
      - Schema validation catches invalid input/output
      - Tool execution errors propagate correctly
    tests:
      - Unit tests in COMP-009

  - id: COMP-009
