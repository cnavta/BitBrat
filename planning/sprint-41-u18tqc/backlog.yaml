      - src/common/composition/__tests__/fixtures/invalid-compositions/
    subtasks:
      - Test valid YAML parsing
      - Test valid JSON parsing
      - Test reference canonicalization ($input, $context, $steps)
      - Test invalid apiVersion error
      - Test invalid kind error
      - Test missing metadata.name error
      - Test malformed YAML error
      - Test edge cases (empty steps, null values, arrays)
      - Test all condition operator types
      - Create test fixtures for valid/invalid compositions
    acceptance:
      - All tests pass
      - Code coverage >90%
      - Edge cases covered
      - Error messages validated
    tests:
      - npm test parser.test.ts

  - id: COMP-006
    title: Implement CompositionCompiler
    phase: core-runtime
    priority: P0
    status: todo
    effort: 5h
    assignee: null
    dependencies:
      - COMP-001
      - COMP-004
    description: >
      Implement compiler that validates compositions, detects cycles,
      resolves dependencies, and produces compiled form.
    files:
      - src/common/composition/compiler.ts
    subtasks:
      - Create CompositionCompiler class with ToolRegistry dependency
      - Implement compile(def) method
      - Implement validate(def) with comprehensive checks
      - Implement extractToolIds() helper
      - Implement detectCycles() using DFS algorithm
      - Implement validateReferences() for step ID validation
      - Implement resolveDependencies() for tool lookup
      - Implement computeHash() for content-addressable storage
      - Implement hashSchema() for fingerprinting
      - Define error codes (COMPOSE-TOOL-001, COMPOSE-CYCLE-001, etc.)
      - Add comprehensive error reporting
      - Add JSDoc documentation
    acceptance:
      - Validation detects missing tools
      - Cycle detection works (direct and indirect cycles)
      - Reference validation catches undefined step IDs
      - Content hash is deterministic and stable
      - All validation errors have unique error codes
      - Dependencies correctly extracted
    tests:
      - Unit tests in COMP-007

  - id: COMP-007
    title: Write CompositionCompiler unit tests
    phase: core-runtime
    priority: P0
    status: todo
    effort: 3h
    assignee: null
    dependencies:
