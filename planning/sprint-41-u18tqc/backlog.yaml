sprint:
  id: sprint-41-u18tqc
  title: Composition DSL & Runtime
  goal: >
    Implement foundational layer for MCP Behavioral Compilation: define, validate,
    execute, and expose Compositions as callable tools via MCP and REST.
  owner: christophernavta
  startDate: 2026-09-02
  estimatedDuration: 17 days

phases:
  - name: foundation
    priority: 1
    goal: Establish core type system and database schema
    estimatedDays: 3

  - name: core-runtime
    priority: 2
    goal: Implement parser, compiler, executor
    estimatedDays: 4

  - name: registry-storage
    priority: 3
    goal: Persistent storage for compositions
    estimatedDays: 2

  - name: integration
    priority: 4
    goal: Expose compositions via MCP and REST
    estimatedDays: 3

  - name: testing-validation
    priority: 5
    goal: Comprehensive test coverage and validation
    estimatedDays: 3

  - name: documentation
    priority: 6
    goal: Examples and operational documentation
    estimatedDays: 2

tasks:
  # ============================================================
  # PHASE 1: FOUNDATION (Days 1-3)
  # ============================================================

  - id: COMP-001
    title: Create TypeScript type definitions
    phase: foundation
    priority: P0
    status: todo
    effort: 2h
    assignee: null
    dependencies: []
    description: >
      Define all TypeScript interfaces and types for the composition system.
      This is the foundational contract for the entire implementation.
    files:
      - src/common/composition/types.ts
    subtasks:
      - Define CompositionDefinition interface
      - Define CompositionSpec interface
      - Define Step types (CallStep, IfValueStep)
      - Define ValueExpression type union
      - Define Reference interface
      - Define Condition type union (all operators)
      - Define CompiledComposition interface
      - Define ValidationReport and ValidationError types
      - Define ToolDependency interface
      - Add comprehensive JSDoc documentation
    acceptance:
      - All types compile without TypeScript errors
      - Types match technical architecture specification
      - JSDoc comments present on all exported types
      - No any types unless explicitly justified
    tests: []

  - id: COMP-002
    title: Create DocumentStore indexes for compositions (optional)
    phase: foundation
    priority: P1
    status: todo
    effort: 0.5h
    assignee: null
    dependencies: []
    description: >
      Create optional performance indexes for compositions collection in PostgreSQL
      backend. Leverages existing DocumentStore abstraction (no schema needed).
    files:
      - infrastructure/sql/migrations/001_composition_indexes.sql
    subtasks:
      - Create index on data->>'name' for name lookups
      - Create index on data->>'status' for status filtering
      - Create index on data->>'contentHash' for deduplication
      - Create composite index on (data->>'status', data->>'name') for active queries
      - Test index performance improvement
    acceptance:
      - Indexes apply cleanly to PostgreSQL backend
      - Migration is idempotent (can run multiple times)
      - No impact on Firestore backend (indexes N/A)
      - Query performance improved for name/status lookups
    tests:
      - Apply migration to PostgreSQL backend
      - Apply migration twice (idempotency)
      - Benchmark query performance before/after

  - id: COMP-003
    title: Set up test infrastructure
    phase: foundation
    priority: P0
    status: todo
    effort: 1h
    assignee: null
    dependencies: []
    description: >
      Create test directory structure, Jest configuration, and shared test
      utilities for composition module.
    files:
      - src/common/composition/__tests__/setup.ts
      - src/common/composition/__tests__/fixtures/
      - src/common/composition/__tests__/mocks/
    subtasks:
      - Create __tests__ directory structure
      - Configure Jest for composition module
      - Create test fixtures directory
      - Create mock ToolRegistry
      - Create mock DocumentStore
      - Create test utilities (helpers, assertions)
    acceptance:
      - npm test runs without errors in composition directory
      - Test infrastructure is isolated
      - Mocks are reusable across tests
      - Fixtures are well-organized
    tests:
      - Run npm test -- composition
      - Verify isolation (no external dependencies hit)

  # ============================================================
  # PHASE 2: CORE RUNTIME (Days 4-7)
  # ============================================================

  - id: COMP-004
    title: Implement CompositionParser
    phase: core-runtime
    priority: P0
    status: todo
    effort: 4h
    assignee: null
    dependencies:
      - COMP-001
    description: >
      Implement parser that converts YAML/JSON composition definitions into
      canonical AST representation.
    files:
      - src/common/composition/parser.ts
    subtasks:
      - Create CompositionParser class
      - Implement parse(source) method (YAML/JSON auto-detect)
      - Implement YAML loading via js-yaml
      - Implement JSON parsing fallback
      - Implement validateTopLevel() for basic structure
      - Implement canonicalize() for full AST conversion
      - Implement parseReference() for shorthand ($input/foo)
      - Implement canonicalizeStep() for step normalization
      - Implement canonicalizeValue() for recursive resolution
      - Implement canonicalizeCondition() for condition normalization
      - Add comprehensive error messages
      - Add JSDoc documentation
    acceptance:
      - Valid YAML parses to correct AST
      - Valid JSON parses to correct AST
      - Shorthand references canonicalize correctly
      - Invalid apiVersion throws descriptive error
      - Invalid kind throws descriptive error
      - Missing metadata.name throws error
      - Malformed YAML throws error
      - All condition types parse correctly
    tests:
      - Unit tests in COMP-005

  - id: COMP-005
    title: Write CompositionParser unit tests
    phase: core-runtime
    priority: P0
    status: todo
    effort: 3h
    assignee: null
