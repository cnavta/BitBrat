    description: "Performance regression in production"
    likelihood: "Medium"
    impact: "High"
    mitigation: "Comprehensive benchmarking, staged rollout with feature flag"

  - id: R2
    description: "RBAC bypasses or security vulnerabilities"
    likelihood: "Low"
    impact: "Critical"
    mitigation: "Security review of all RBAC paths, penetration testing"

  - id: R3
    description: "Composition breaking changes"
    likelihood: "Medium"
    impact: "Medium"
    mitigation: "Extensive integration tests, backward compatibility checks"

  - id: R4
    description: "MCP server connectivity issues"
    likelihood: "Medium"
    impact: "Medium"
    mitigation: "Connection pooling, retry logic, graceful degradation"

  - id: R5
    description: "Consumer migration failures"
    likelihood: "Low"
    impact: "High"
    mitigation: "Feature flag for easy rollback, staged migration"

