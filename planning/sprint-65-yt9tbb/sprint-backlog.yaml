        status: "blocked"
    subtasks:
      - "✅ Add ENABLE_TOOL_ORCHESTRATOR support in reflex (Sprint 61 T7.2)"
      - "✅ Update composition execution context with modelId (Sprint 58)"
      - "⏳ Test deterministic agent flow (blocked - requires REST API)"
      - "✅ Validate reflex model permissions (working via tool-gateway)"
    blocking_issue:
      severity: "High"
      description: "Tool-orchestrator missing REST API endpoint"
      details: |
        Reflex uses HTTP POST to /v1/tools/{tool} for tool execution (src/services/reflex/tool-executor.ts:131).
        This is different from llm-bot which uses MCP SDK with SSE transport.

        Tool-gateway implements both:
        - MCP SSE endpoint at /mcp (for llm-bot, MCP SDK clients)
        - REST API endpoint at /v1/tools/{tool} (for reflex, HTTP clients)

        Tool-orchestrator currently only implements:
        - MCP SSE endpoint at /mcp ✅
        - REST API endpoint at /v1/tools/{tool} ❌ MISSING

        Impact:
        - llm-bot can use tool-orchestrator (MCP SDK works) ✅
        - reflex CANNOT use tool-orchestrator (REST API missing) ❌

        Resolution:
        Implement REST API in tool-orchestrator-service.ts:
        - Add app.post('/v1/tools/:tool', ...) endpoint
        - Parse tool name from URL parameter
        - Extract arguments from request body
        - Extract RBAC context from headers (X-Roles, X-Model-ID)
        - Call toolGateway.executeTool()
        - Return JSON response

        Estimated effort: 1-2 days
        Priority: P0 (blocks full consumer migration)
      follow_up_task: "Sprint 66 T1.1: Implement REST API in tool-orchestrator"
    implementation_notes: |
      Feature flag infrastructure is complete (Sprint 61 T7.2).
      Configuration documented and enabled.
      Actual migration blocked on tool-orchestrator REST API implementation.

      Two integration patterns discovered:
      1. MCP SDK (llm-bot): Uses @modelcontextprotocol/client with SSE transport
      2. HTTP REST (reflex): Uses fetch() with POST to /v1/tools/{tool}

      Tool-orchestrator must support BOTH patterns for full platform migration.

