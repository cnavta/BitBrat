      - Fallback to HTTP headers implemented
      - combinedExtra built with full context
      - tools/list handler implemented
      - Resources and prompts registration unchanged
      - Code compiles without errors
      - TypeScript types check correctly

    implementation:
      replace_lines: 1748-1762
      new_code: |
        // Register single handler for all tools
        if (this.registeredTools.size > 0) {
          server.setRequestHandler('tools/call', async (request, ctx) => {
            const { name: toolName, arguments: toolArgs } = request.params;

            // ✅ Extract context from v2 ServerContext
            const meta = ctx.mcpReq._meta;
            const combinedExtra = {
              ...ctx,  // Include full context
              userId: meta?.userId || ctx.http?.req?.headers.get('x-user-id') || 'anonymous',
              userRoles: meta?.userRoles || ctx.http?.req?.headers.get('x-roles')?.split(',') || [],
              correlationId: meta?.correlationId,
              sessionId: ctx.sessionId,
              modelId: meta?.modelId,
            };

            this.logger.debug('tool_call.context_extracted', {
              toolName,
              userId: combinedExtra.userId,
              modelId: combinedExtra.modelId,
              hasRoles: combinedExtra.userRoles.length > 0,
            });

            // Lookup registered tool
            const tool = this.registeredTools.get(toolName);
            if (!tool) {
              this.logger.warn('tool_not_found', { toolName });
              return {
                isError: true,
                content: [{ type: 'text', text: `Tool not found: ${toolName}` }]
              };
            }

            // Execute with traced operation
            try {
              return await this.traceMcpOperation(
                `tool:${toolName}`,
                () => tool.handler(toolArgs, combinedExtra),
                combinedExtra
              );
            } catch (error) {
              this.logger.error('tool_execution.failed', {
                toolName,
                error: error instanceof Error ? error.message : String(error),
              });
              return {
                isError: true,
                content: [{
                  type: 'text',
                  text: `Tool execution failed: ${error instanceof Error ? error.message : String(error)}`
                }]
              };
            }
          });

          // List tools handler
          server.setRequestHandler('tools/list', async (request, ctx) => {
            this.logger.debug('tools_list.requested');
            return {
              tools: Array.from(this.registeredTools.entries()).map(([name, tool]) => ({
                name,
                description: tool.description,
                inputSchema: tool.schema,
              }))
            };
          });
        }

    validation:
      - npm run build
      - Build succeeds without errors
      - TypeScript types check correctly
      - grep -n "registerTool" src/common/base-server.ts
      - Should only find: comments and documentation, no active calls

