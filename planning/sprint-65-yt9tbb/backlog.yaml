        ### Pattern: MCP SDK v2 Handler Registration

        **Use setRequestHandler for context-aware tools:**
        ```typescript
        server.setRequestHandler('tools/call', async (request, ctx) => {
          // ✅ Extract context from ServerContext
          const meta = ctx.mcpReq._meta;
          const userId = meta?.userId || ctx.http?.req?.headers.get('x-user-id') || 'anonymous';
          const modelId = meta?.modelId;
          const userRoles = meta?.userRoles || [];

          // Extract tool args
          const { name: toolName, arguments: toolArgs } = request.params;

          // Execute tool with context
          return await executeToolWithContext(toolName, toolArgs, { userId, modelId, userRoles });
        });
        ```

        **Use registerTool for stateless tools:**
        ```typescript
        server.registerTool('calculate', {
          description: 'Stateless calculator',
          inputSchema: z.object({ a: z.number(), b: z.number() })
        }, async ({ a, b }) => {
          return { content: [{ type: 'text', text: `${a + b}` }] };
        });
        ```

