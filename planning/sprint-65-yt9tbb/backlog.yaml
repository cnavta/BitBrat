  TASK-003:
    id: TASK-003
    phase: phase_1
    title: "Update context extraction to use v2 pattern (ctx.mcpReq._meta)"
    priority: P0
    status: done
    estimated_hours: 3
    assigned_to: null
    completed_at: 2026-11-18T13:15:00Z
    depends_on:
      - TASK-002

    description: |
      COMPLETED: Updated context extraction in tool-orchestrator to use v2 pattern.

      Actual implementation: Instead of switching to setRequestHandler (which doesn't exist
      on McpServer), we kept the registerTool approach but fixed WHERE we extract _meta from.

      Changes:
      - Lines 1538-1548: Changed from checking multiple locations (args._meta, ctx._meta, ctx.mcpReq._meta)
        to using ONLY ctx.mcpReq._meta as primary source (v2 pattern)
      - Lines 1635-1643: Same fix for direct tools registration loop
      - Fallback: If _meta unavailable, fall back to ctx.http?.req?.headers.get('x-user-id')

      This accomplishes the same goal as the original setRequestHandler plan.

    files:
      - src/apps/tool-orchestrator-service.ts:getMcpServer()

    acceptance_criteria:
      - server.setRequestHandler('tools/call', handler) registered
      - Handler signature: async (request, ctx) => CallToolResult
      - _meta extracted from ctx.mcpReq._meta (not args._meta)
      - Fallback to ctx.http?.req?.headers.get() for HTTP transport
      - Tool name extracted from request.params.name
      - Tool args extracted from request.params.arguments
      - Tool lookup from registry by ID
      - Proper error handling for tool not found
      - Proper error handling for tool execution failure
      - combinedExtra built with userId, userRoles, modelId, correlationId, sessionId

    implementation:
      code: |
        server.setRequestHandler('tools/call', async (request, ctx) => {
          const { name: toolName, arguments: toolArgs } = request.params;

          // ✅ Extract execution context from v2 ServerContext
          const meta = ctx.mcpReq._meta;
          const userId = meta?.userId || ctx.http?.req?.headers.get('x-user-id') || 'anonymous';
          const userRoles = meta?.userRoles || ctx.http?.req?.headers.get('x-roles')?.split(',') || [];
          const modelId = meta?.modelId || 'tool-orchestrator';  // Fallback for safety

          logger.debug('tool_call.context_extracted', {
            toolName,
            userId,
            modelId,
            hasRoles: userRoles.length > 0,
            metaSource: meta ? 'mcpReq._meta' : 'http.headers',
          });

          // Lookup tool from registry
          const tool = await this.toolRegistry?.getToolById(toolName);
          if (!tool) {
            logger.warn('tool_not_found', { toolName });
            return {
              isError: true,
              content: [{ type: 'text', text: `Tool not found: ${toolName}` }]
            };
          }

          // Execute with proper context
          const executionContext = {
            userId,
            userRoles,
            modelId,
            correlationId: meta?.correlationId,
            sessionId: ctx.sessionId,
          };

          try {
            logger.debug('tool_execution.starting', { toolName, executionContext });
            const result = await tool.execute!(toolArgs, executionContext);
            logger.debug('tool_execution.success', { toolName });
            return result;
          } catch (error) {
            logger.error('tool_execution.failed', {
              toolName,
              error: error instanceof Error ? error.message : String(error)
            });
            return {
              isError: true,
              content: [{
                type: 'text',
                text: `Tool execution failed: ${error instanceof Error ? error.message : String(error)}`
              }]
            };
          }
        });

    validation:
      - Code compiles without errors
      - TypeScript types check correctly
      - ctx.mcpReq._meta access typed correctly
      - request.params structure typed correctly

