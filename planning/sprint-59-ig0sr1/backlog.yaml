# ============================================================================
# TASK 2: Implement ToolObserver Module (4 days)
# Critical Path: P0
# ============================================================================

task_2_tool_observer_module:
  id: T2
  title: "Implement ToolObserver Module"
  priority: P0
  status: pending
  estimated_hours: 32
  dependencies: ["T1"]
  category: "Core Implementation"

  subtasks:
    - id: T2.1
      title: "Create ToolObserver interface"
      status: pending
      acceptance_criteria:
        - "IToolObserver interface defined"
        - "Interface includes: queryToolMetrics, queryModelMetrics, traceToolInvocation, getToolHealth, detectAnomalies"
        - "TypeScript types for ToolMetrics, ModelMetrics, InvocationEvent, ToolHealthStatus defined"
      files:
        - "src/apps/tool-orchestrator-service/modules/observer/tool-observer.interface.ts"

    - id: T2.2
      title: "Implement Loki client wrapper"
      status: pending
      acceptance_criteria:
        - "Loki client initialized with endpoint from config"
        - "LogQL query execution implemented"
        - "Error handling for Loki unavailability (fail-open)"
        - "Connection pooling configured"
      files:
        - "src/apps/tool-orchestrator-service/modules/observer/loki-client.ts"

    - id: T2.3
      title: "Implement queryToolMetrics()"
      status: pending
      acceptance_criteria:
        - "Queries Loki for tool invocations by toolId"
        - "Calculates: total invocations, error count, error rate"
        - "Calculates P50, P95, P99 latencies"
        - "Returns ToolMetrics object"

    - id: T2.4
      title: "Implement queryModelMetrics()"
      status: pending
      acceptance_criteria:
        - "Queries Loki for invocations by modelId"
        - "Aggregates across all tools used by model"
        - "Calculates total cost estimate (from event data)"
        - "Returns ModelMetrics object"

    - id: T2.5
      title: "Implement traceToolInvocation()"
      status: pending
      acceptance_criteria:
        - "Queries Loki by correlationId"
        - "Returns chronological list of InvocationEvents"
        - "Includes all events in request lifecycle"
        - "Supports multi-tool compositions"

    - id: T2.6
      title: "Implement getToolHealth()"
      status: pending
      acceptance_criteria:
        - "Queries recent invocations (last 1 hour)"
        - "Derives health status: healthy, degraded, unhealthy"
        - "Logic: healthy (error rate < 5%), degraded (5-20%), unhealthy (>20% or no invocations)"
        - "Returns ToolHealthStatus with timestamps"

    - id: T2.7
      title: "Implement detectAnomalies()"
      status: pending
      acceptance_criteria:
        - "Detects error rate spikes (>3x baseline)"
        - "Detects latency spikes (>2x P95)"
        - "Detects RBAC denial spikes"
        - "Returns Anomaly[] with severity and description"

    - id: T2.8
      title: "Write unit tests for ToolObserver"
      status: pending
      acceptance_criteria:
        - "Test coverage ≥ 70%"
        - "Mock Loki client for isolated testing"
        - "Test all public methods"
        - "Test error handling (Loki unavailable)"
      files:
        - "src/apps/tool-orchestrator-service/modules/observer/__tests__/tool-observer.test.ts"

  deliverables:
    - file: "src/apps/tool-orchestrator-service/modules/observer/tool-observer.ts"
      status: pending
      description: "ToolObserver module implementation"
    - file: "src/apps/tool-orchestrator-service/modules/observer/tool-observer.interface.ts"
      status: pending
      description: "IToolObserver interface"
    - file: "src/apps/tool-orchestrator-service/types/tool-metrics.ts"
      status: pending
