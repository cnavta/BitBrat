    - "Implements IToolObserver interface"
    - "Successfully queries Loki via LogQL"
    - "Aggregates metrics: invocations, error rate, P95 latency"
    - "Derives health status correctly"
    - "Unit tests passing (≥70% coverage)"

# ============================================================================
# TASK 3: Add Event Logging to ToolGateway (3 days)
# Critical Path: P0
# ============================================================================

task_3_event_logging:
  id: T3
  title: "Add Event Logging to ToolGateway"
  priority: P0
  status: pending
  estimated_hours: 24
  dependencies: ["T1"]
  category: "Core Implementation"

  subtasks:
    - id: T3.1
      title: "Define tool invocation event schema"
      status: pending
      acceptance_criteria:
        - "ToolInvocationEvent interface matches spec (Section 3A)"
        - "Includes Loki labels: service, level, eventType, toolId, modelId, status, correlationId"
        - "Includes log fields: timestamp, message, durationMs, rbacDecision, etc."
        - "TypeScript types for all fields"
      files:
        - "src/apps/tool-orchestrator-service/types/tool-invocation-event.ts"

    - id: T3.2
      title: "Add event logging to ToolGateway.execute()"
      status: pending
      acceptance_criteria:
        - "Log event AFTER tool execution completes"
        - "Log includes execution duration (durationMs)"
        - "Log includes status: success | error | denied"
        - "Logging is asynchronous (fire-and-forget, non-blocking)"
      files:
        - "src/apps/tool-orchestrator-service/modules/gateway/tool-gateway.ts"

    - id: T3.3
      title: "Add RBAC denial logging"
      status: pending
      acceptance_criteria:
        - "Log denial events with status='denied'"
        - "Include rbacDecision with full context (reason, userRoles, modelTier, etc.)"
        - "Log level: 'info' (not error, as denials are expected behavior)"

    - id: T3.4
      title: "Implement input/output preview truncation"
      status: pending
      acceptance_criteria:
        - "inputPreview max 500 chars"
        - "outputPreview max 500 chars"
        - "Truncation indicator: '...' appended"
        - "Handles JSON serialization errors gracefully"

    - id: T3.5
      title: "Add cost estimation logging (optional)"
      status: pending
      acceptance_criteria:
        - "Estimate tokens from input/output length (if LLM model)"
        - "Calculate costUsd from ModelRegistry cost data"
        - "Include in estimatedCost field"
        - "Gracefully skip if model lacks cost data"

    - id: T3.6
      title: "Verify Promtail picks up events"
      status: pending
      acceptance_criteria:
        - "Deploy to agent-dev"
        - "Send test tool invocation"
        - "Query Loki, verify event appears within 5 seconds"
        - "Verify all labels are indexed correctly"

    - id: T3.7
      title: "Test cardinality impact"
      status: pending
      acceptance_criteria:
        - "Simulate 100 tool invocations with 10 unique toolIds and 5 unique modelIds"
        - "Verify Loki cardinality metrics (should be ~500 label combinations max)"
        - "Ensure no performance degradation"

  deliverables:
    - file: "src/apps/tool-orchestrator-service/types/tool-invocation-event.ts"
      status: pending
      description: "Tool invocation event schema"
    - file: "src/apps/tool-orchestrator-service/modules/gateway/tool-gateway.ts"
      status: pending
      description: "Updated ToolGateway with event logging"

  acceptance_criteria:
    - "ToolGateway logs all tool invocations to stdout (structured JSON)"
    - "Promtail picks up new event types"
    - "Event schema matches specification"
    - "Logging is asynchronous (does not block tool execution)"
    - "RBAC denials logged with full context"
    - "Cardinality impact verified (< 1000 label combinations)"

