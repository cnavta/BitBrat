  - id: TASK-001
    phase: 1
    priority: P0
    title: Add Ajv dependencies to package.json
    description: |
      Install Ajv (JSON Schema validator) and ajv-formats (format validators)
      as production dependencies. These are industry-standard libraries with
      12M+ weekly downloads.
    status: pending
    estimated_hours: 0.25
    assigned_to: null
    dependencies: []
    files_modified:
      - package.json
      - package-lock.json
    acceptance_criteria:
      - dependencies:
          - ajv: ^8.12.0
          - ajv-formats: ^2.1.1
      - npm_install_succeeds: true
      - no_peer_dependency_conflicts: true
      - npm_audit_acceptable: true
    commands:
      - npm install ajv@^8.12.0 ajv-formats@^2.1.1
    validation:
      - grep -q '"ajv".*"8.12' package.json
      - npm ls ajv
      - npm ls ajv-formats
    notes: |
      Ajv is the industry standard JSON Schema validator. We need v8.12+ for
      full JSON Schema 2020-12 support. ajv-formats adds format validators
      (email, date, uri, etc.) that composition authors may use.

  - id: TASK-002
    phase: 1
    priority: P0
    title: Create TypeScript interfaces for Standard Schema
    description: |
      Define TypeScript interfaces for Standard Schema v1 specification.
      These interfaces match the official Standard Schema spec and will be
      implemented by JsonSchemaStandardAdapter.
    status: pending
    estimated_hours: 0.5
    assigned_to: null
    dependencies:
      - TASK-001
    files_created:
      - src/common/schemas/json-schema-standard-adapter.ts
    acceptance_criteria:
      - interface StandardSchemaV1 with version, vendor, validate
      - interface StandardJSONSchemaV1 with jsonSchema.input/output
      - interface StandardSchemaWithJSON combining both
      - interfaces_match_spec: https://standardschema.dev/
      - typescript_compiles: true
      - jsdoc_complete: true
    code_snippet: |
      export interface StandardSchemaV1 {
        readonly version: 1;
        readonly vendor: string;
        readonly validate: (value: unknown) =>
          | { value: unknown; issues?: undefined }
          | { issues: Array<{ message: string; path?: string[] }> };
      }
    validation:
      - npm run build
    notes: |
      These interfaces are the contract between our adapter and MCP SDK 2.0.
      They must match the Standard Schema specification exactly.

  - id: TASK-003
    phase: 1
    priority: P0
    title: Implement JsonSchemaStandardAdapter class
    description: |
      Create the core adapter class that wraps JSON Schema in the Standard Schema
      interface. Uses Ajv for validation, returns original JSON Schema via
      jsonSchema.input() (no conversion).
    status: pending
    estimated_hours: 2.0
    assigned_to: null
    dependencies:
      - TASK-002
    files_modified:
      - src/common/schemas/json-schema-standard-adapter.ts
    acceptance_criteria:
      - class_implements_StandardSchemaWithJSON: true
      - constructor_validates_schema_parameter: true
      - ajv_compilation_at_construction: true
      - validate_method_returns_correct_format: true
      - jsonSchema_input_returns_original: true
      - jsonSchema_output_returns_original: true
      - error_handling_for_invalid_schemas: true
      - jsdoc_complete_with_examples: true
      - typescript_strict_mode_passes: true
    implementation_checklist:
      - Constructor accepts schema and optional vendor string
      - Constructor validates schema is an object
      - Initialize Ajv with strict:false, allErrors:true, verbose:true
      - Add ajv-formats to Ajv instance
      - Compile validator once at construction
      - Implement ~standard.version = 1
      - Implement ~standard.vendor getter
      - Implement ~standard.validate() with Ajv
      - Convert Ajv errors to Standard Schema issues format
      - Implement ~standard.jsonSchema.input()
      - Implement ~standard.jsonSchema.output()
      - Handle $schema field addition when target specified
      - Don't modify original schema object
    validation:
      - npm run build
      - npx tsc --noEmit --strict src/common/schemas/json-schema-standard-adapter.ts
    notes: |
      This is the core of the sprint. The adapter must:
      1. Implement Standard Schema interface correctly
      2. Use Ajv for validation (same validator as CompositionExecutor)
      3. Return original JSON Schema (no conversion, no data loss)
      4. Handle errors gracefully

