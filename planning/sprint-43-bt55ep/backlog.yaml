      Add private method after findTool():

      /**
       * Validate template expression
       *
       * Checks template syntax and variable definitions.
       */
      private validateTemplate(
        template: TemplateExpression,
        location: string,
        errors: ValidationError[],
        warnings: ValidationWarning[]
      ): void {
        const templateString = template.template;

        // Extract used variables from template
        const usedVariables = new Set<string>();
        const varRegex = /\{\{(\w+)\}\}/g;
        let match;
        while ((match = varRegex.exec(templateString)) !== null) {
          usedVariables.add(match[1]);
        }

        // Extract defined variables
        const definedVariables = new Set(
          Object.keys(template).filter((k) => k !== 'template')
        );

        // Check undefined variables
        for (const varName of usedVariables) {
          if (!definedVariables.has(varName)) {
            errors.push({
              code: CompositionErrorCode.INVALID_REFERENCE,
              message: `Undefined template variable: {{${varName}}}. Define it as a property of the template object.`,
              location: `${location}.template`,
              severity: 'error',
            });
          }
        }

        // Warn about unused variables
        for (const varName of definedVariables) {
          if (!usedVariables.has(varName)) {
            warnings.push({
              code: 'UNUSED_TEMPLATE_VARIABLE',
              message: `Template variable "${varName}" is defined but not used in template string`,
              location: `${location}.${varName}`,
              severity: 'warning',
            });
          }
        }

        // Check brace matching
        const openCount = (templateString.match(/\{\{/g) || []).length;
        const closeCount = (templateString.match(/\}\}/g) || []).length;
        if (openCount !== closeCount) {
          errors.push({
            code: CompositionErrorCode.INVALID_FORMAT,
            message: `Mismatched template braces: ${openCount} {{, ${closeCount} }}`,
            location: `${location}.template`,
            severity: 'error',
          });
        }
      }

      Then integrate into validate() where ValueExpressions are validated.

