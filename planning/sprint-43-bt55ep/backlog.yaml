      /**
       * Template Expression
       *
       * String interpolation using Mustache-style {{variable}} syntax.
       *
       * @example
       * ```yaml
       * greeting:
       *   template: "Hello, {{name}}!"
       *   name:
       *     $ref: { namespace: input, pointer: /username }
       * ```
       */
      export interface TemplateExpression {
        /** Template string with {{variable}} placeholders */
        template: string;
        /** Variable definitions (all properties except 'template') */
        [variable: string]: ValueExpression;
      }

      export function isTemplateExpression(value: unknown): value is TemplateExpression {
        return (
          value !== null &&
          typeof value === 'object' &&
          'template' in value &&
          typeof (value as any).template === 'string'
        );
      }

      // Update ValueExpression union
      export type ValueExpression =
        | Reference
        | TemplateExpression  // NEW
        | string
        | number
        | boolean
        | null
        | ValueExpression[]
        | { [key: string]: ValueExpression };

  - id: TEMPLATE-002
    title: "Implement resolveTemplate() method in executor"
    description: |
      Add template resolution logic to CompositionExecutor.

      Algorithm:
      1. Extract template string and variable definitions
      2. Recursively resolve each variable value using resolveValue()
      3. Coerce resolved values to strings (with warnings for objects)
      4. Interpolate variables into template using regex replacement
      5. Handle escaped braces (\{{ -> {{)
      6. Return final interpolated string

      Error handling:
      - Throw ExecutionError for undefined variables
      - Log warnings for object/array coercion
      - Validate template structure
    phase: 1
    priority: P0
    status: completed
    assignee: Lead Implementor
    estimate: 1h
    dependencies:
      - TEMPLATE-001
    files:
      - src/common/composition/executor.ts
    testCoverage:
      - executor.test.ts (add template resolution tests)
    acceptanceCriteria:
      - resolveTemplate() method implemented
      - Handles variable resolution recursively
      - Interpolates {{variable}} markers correctly
      - Coerces non-string values appropriately
      - Throws errors for undefined variables
      - Handles escaped braces
      - Comprehensive error messages
    technicalNotes: |
      Add private method after resolveReference():

      /**
       * Resolve a template expression
       *
       * Interpolates {{variable}} placeholders with resolved variable values.
       * Variables are resolved recursively and coerced to strings.
       *
       * @throws ExecutionError if variable is undefined
       */
      private async resolveTemplate(
        template: TemplateExpression,
        input: unknown,
        context: unknown,
        stepState: StepState
      ): Promise<string> {
        const templateString = template.template;

        // Extract variable definitions
        const variableDefinitions: Record<string, ValueExpression> = {};
        for (const [key, value] of Object.entries(template)) {
          if (key !== 'template') {
            variableDefinitions[key] = value;
          }
        }

        // Resolve all variables
        const resolvedVariables: Record<string, string> = {};
        for (const [varName, varExpression] of Object.entries(variableDefinitions)) {
          const resolvedValue = await this.resolveValue(
            varExpression,
            input,
            context,
            stepState
          );

          // Coerce to string
          if (resolvedValue === null || resolvedValue === undefined) {
            resolvedVariables[varName] = '';
          } else if (typeof resolvedValue === 'string') {
            resolvedVariables[varName] = resolvedValue;
          } else if (typeof resolvedValue === 'number' || typeof resolvedValue === 'boolean') {
            resolvedVariables[varName] = String(resolvedValue);
          } else {
            // Object/array -> JSON (with warning)
            throw new ExecutionError(
              CompositionErrorCode.VALIDATION_ERROR,
              `Template variable "${varName}" resolved to ${Array.isArray(resolvedValue) ? 'array' : 'object'}. ` +
              `Consider using a reference to a specific field instead.`,
              `template.${varName}`
            );
          }
        }

        // Interpolate variables
        let result = templateString.replace(/\{\{(\w+)\}\}/g, (match, varName) => {
          if (varName in resolvedVariables) {
            return resolvedVariables[varName];
          } else {
            throw new ExecutionError(
              CompositionErrorCode.INVALID_REFERENCE,
              `Undefined template variable: {{${varName}}}`,
              `template`
            );
          }
        });

        // Handle escaped braces
        result = result.replace(/\\?\{\{/g, '{{');

        return result;
      }

