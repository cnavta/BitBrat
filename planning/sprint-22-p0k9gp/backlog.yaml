    acceptanceCriteria:
      - Verification report complete
      - Retrospective complete
      - Key learnings documented
      - Sprint manifest updated
    testCommand: null
    blockers: []
    notes: null

  - id: task-6.3
    title: Create Pull Request
    description: |
      Create PR with comprehensive description. Include test results, validation
      report, and deployment notes. Request review.
    phase: 6
    priority: P0
    estimatedHours: 0.5
    actualHours: null
    status: todo
    assignee: null
    dependencies:
      - task-6.2
    files: []
