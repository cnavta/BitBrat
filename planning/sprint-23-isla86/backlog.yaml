# PHASE 2: SAFETY & UX ENHANCEMENTS

phase_2:
  title: Safety & UX Enhancements
  priority: P1
  estimated_hours: 2
  dependencies: [phase_1]

  tasks:
    - id: T2.1
      title: Implement dry-run mode
      description: |
        Add --dry-run flag that performs all validation and shows what would
        be created, but doesn't actually create any files. Useful for previewing
        and validating before execution.
      priority: P1
      estimated_hours: 0.75
      status: completed
      completed_at: 2026-08-22
      dependencies: [T1.3]
      notes: "Implemented dry-run mode with file size preview. Tested with and without --register flag."
      files:
        - path: tools/brat/src/cli/bit/create.ts
          action: modify
          changes:
            - Add --dry-run flag parsing
            - Add dry-run output formatting
            - Skip file creation when dry-run enabled
        - path: tools/brat/src/oclif-commands/bit/create.ts
          action: modify
          changes:
            - Add dry-run flag definition
      acceptance_criteria:
        - --dry-run shows validation results
        - --dry-run shows files that would be created (with sizes)
        - --dry-run shows target location
        - --dry-run creates NO files
        - Exit code 0 on successful dry-run
      tests:
        - Test dry-run with valid config
        - Test dry-run with invalid config (should still show errors)
        - Verify no files created after dry-run

    - id: T2.2
      title: Enhance error messages
      description: |
        Improve error messages with context, suggestions, and examples.
        Make it easy for users to understand what went wrong and how to fix it.
      priority: P1
      estimated_hours: 0.5
      status: completed
      completed_at: 2026-08-22
      dependencies: [T1.3]
      notes: "Added suggestions field to ValidationResult. Enhanced all validation functions with specific suggestions based on errors."
      files:
        - path: tools/brat/src/cli/bit/create.ts
          action: modify
          changes:
            - Add context to name validation errors
            - Add examples to profile/exposure errors
            - Add suggestions for common mistakes
            - Show current location in git errors
      acceptance_criteria:
        - Errors include "what went wrong"
        - Errors include "how to fix it"
        - Errors include relevant examples
        - Errors show current context (location, sprint, etc)
      validation:
        - Test all error paths
        - Verify error messages are helpful (user testing)

    - id: T2.3
      title: Create bit cleanup utility
      description: |
        Create `brat bit cleanup` command to remove test bits and their files.
        Useful for cleaning up after testing or removing Bits that are no
        longer needed.
      priority: P1
      estimated_hours: 0.75
      status: completed
      completed_at: 2026-08-22
      dependencies: [T1.1]
      notes: "Created cleanup.ts and oclif command. Dry-run by default, tested successfully on test files."
      files:
        - path: tools/brat/src/cli/bit/cleanup.ts
          action: create
          lines: ~80
        - path: tools/brat/src/oclif-commands/bit/cleanup.ts
          action: create
          lines: ~40
      acceptance_criteria:
        - Lists files to be removed
        - Dry-run by default (requires --force to actually remove)
        - Can remove from architecture.yaml with flag
        - Handles missing files gracefully
      tests:
        - Test cleanup without --force (dry-run)
        - Test cleanup with --force
        - Test cleanup with --remove-from-arch
        - Test cleanup of non-existent Bit

