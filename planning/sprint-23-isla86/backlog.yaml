# RISK ASSESSMENT

risks:
  - id: R1
    description: Git commands may behave differently on different platforms
    mitigation: Test on macOS, Linux, Windows. Use portable git commands only.
    probability: medium
    impact: medium

  - id: R2
    description: Sprint-index.yaml format may change
    mitigation: Add schema validation. Handle missing/malformed gracefully.
    probability: low
    impact: high

  - id: R3
    description: Users may have complex worktree setups
    mitigation: Test with multiple worktrees, nested worktrees.
    probability: low
    impact: medium

  - id: R4
    description: Performance impact of git command execution
    mitigation: Cache git info during command execution. Profile performance.
    probability: low
    impact: low

