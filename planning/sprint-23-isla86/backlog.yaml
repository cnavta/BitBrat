# PHASE 1: CRITICAL FIXES

phase_1:
  title: Critical Fixes
  priority: P0
  estimated_hours: 5
  dependencies: []

  tasks:
    - id: T1.1
      title: Implement git repository detection utility
      description: |
        Create git-utils.ts with functions to detect git repo, worktree status,
        and repository root. This replaces process.cwd() with git-aware detection.
      priority: P0
      estimated_hours: 1.5
      status: completed
      completed_at: 2026-08-22
      dependencies: []
      notes: "Created git-utils.ts with 21 passing unit tests. All acceptance criteria met."
      files:
        - path: tools/brat/src/cli/bit/git-utils.ts
          action: create
          lines: ~120
      acceptance_criteria:
        - Correctly detects git repository vs non-git directory
        - Distinguishes between worktree and main repo
        - Returns repository root path
        - Handles git command errors gracefully
        - Returns current branch name
      tests:
        - Test in git repo
        - Test in non-git directory
        - Test in worktree
        - Test in main repo
        - Test error handling

    - id: T1.2
      title: Implement sprint status awareness utility
      description: |
        Create sprint-utils.ts to read sprint-index.yaml and determine if there's
        an active sprint, where its worktree is located, and whether the user
        should be warned about creating files outside the sprint context.
      priority: P0
      estimated_hours: 1.5
      status: completed
      completed_at: 2026-08-22
      dependencies: [T1.1]
      notes: "Created sprint-utils.ts with 22 passing unit tests. Fixed YAML format from object to array."
      files:
        - path: tools/brat/src/cli/bit/sprint-utils.ts
          action: create
          lines: ~150
      acceptance_criteria:
        - Correctly identifies active sprint from sprint-index.yaml
        - Calculates sprint worktree path
        - Validates if current location matches active sprint
        - Provides warning message when appropriate
        - Handles missing sprint-index.yaml gracefully
      tests:
        - Test with no active sprint
        - Test with active sprint, in correct worktree
        - Test with active sprint, in main repo
        - Test with active sprint, in different worktree
        - Test with missing sprint-index.yaml

    - id: T1.3
      title: Update cmdBitCreate to use git/sprint detection
      description: |
        Replace process.cwd() with git-aware root detection. Add validation
        to ensure running in git repo. Add warning when creating outside
        active sprint worktree.
      priority: P0
      estimated_hours: 1.5
      status: completed
      completed_at: 2026-08-22
      dependencies: [T1.1, T1.2]
      notes: "Updated create.ts to use git root detection and sprint context validation. Added --force bypass."
      files:
        - path: tools/brat/src/cli/bit/create.ts
          action: modify
          changes:
            - Import git-utils and sprint-utils
            - Add git environment validation before execution
            - Replace "const root = process.cwd()" with git root detection
            - Add sprint context validation and warning
            - Support --force to bypass warning
      acceptance_criteria:
        - Uses git root instead of process.cwd()
        - Fails gracefully in non-git environment
        - Warns when creating outside active sprint worktree
        - --force bypasses sprint warning
        - Error messages are clear and actionable
      tests:
        - Test creating in main repo (no sprint)
        - Test creating in worktree (active sprint)
        - Test creating from main while sprint active
        - Test with --force to bypass warning
        - Test in non-git directory

    - id: T1.4
      title: Update CLAUDE.md documentation
      description: |
        Fix flag naming inconsistency (--category → --kind). Add documentation
        about worktree awareness and sprint context validation. Update all
        examples to be accurate.
      priority: P0
      estimated_hours: 0.5
      status: completed
      completed_at: 2026-08-22
      dependencies: [T1.3]
      notes: "Fixed flag naming, added worktree awareness section with examples and warnings."
      files:
        - path: CLAUDE.md
          action: modify
          changes:
            - Line 344: Change --category to --kind
            - Add worktree awareness section
            - Update examples with correct flags
            - Document --force behavior
            - Document sprint context warnings
      acceptance_criteria:
        - All flag names match actual implementation
        - Worktree behavior is documented
        - Examples are tested and accurate
        - No references to deprecated --category flag
      validation:
        - Search CLAUDE.md for "--category" (should be 0 results)
        - All examples should compile/run successfully

