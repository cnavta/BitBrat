  - id: TASK-377-008
    title: Implement threshold detection logic
    description: |
      Detect when an event has exceeded the progress threshold.

      Default threshold: 2000ms (configurable via PROGRESS_THRESHOLD_MS)
      Check: Date.now() - new Date(event.timestamp).getTime() >= threshold

      NOTE: qos.progress.enabled flag exists but is NOT enforced in Sprint 377.
      All requests get progress (deferred preference enforcement to Sprint 378+).
    phase: phase_1
    priority: P0
    estimate: 2h
    dependencies:
      - TASK-377-007
    assignee: TBD
    status: not_started
    acceptance_criteria:
      - getThreshold() method implemented
      - Reads from config or uses default
      - beforeNext() checks elapsed time correctly
      - Does NOT enforce qos.progress.enabled (deferred)
      - Logs when threshold crossed
    files_changed:
      - src/common/middleware/feedback-middleware.ts
    tests_required:
      - Test threshold calculation
      - Test config override
      - Test elapsed time detection

  - id: TASK-377-009
    title: Implement stage determination logic
    description: |
      Determine which progress stage to send based on elapsed time and tracking state.

      Stages:
      - initial: First time crossing threshold (2s default)
      - update: Every 5s after initial (7s, 12s, 17s, ...)
      - timeout: At 60s (approaching 75s limit)

      Return null if no stage applies.
    phase: phase_1
    priority: P0
    estimate: 3h
    dependencies:
      - TASK-377-008
    assignee: TBD
    status: not_started
    acceptance_criteria:
      - determineStage() method implemented
      - Correctly identifies all three stages
      - Returns null when no action needed
      - Uses tracking state to prevent duplicates
      - 5s interval between updates configurable
    files_changed:
      - src/common/middleware/feedback-middleware.ts
    tests_required:
      - Test initial stage detection (2s)
      - Test update stage detection (7s, 12s)
      - Test timeout stage detection (60s)
      - Test null return cases

  - id: TASK-377-010
    title: Implement progress tracking state
    description: |
      In-memory tracking of progress message state per correlationId.

      Tracking fields:
      - initialSent: boolean
      - lastUpdate: number (timestamp)
      - timeoutSent: boolean

      Use Map<string, TrackingState> for storage.
