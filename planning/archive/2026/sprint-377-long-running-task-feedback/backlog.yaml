# Sprint 377: Long-Running Task Feedback - Trackable Backlog (REVISED)
#
# This YAML backlog provides granular, trackable tasks for Sprint 377.
# Each task includes priority, estimate, dependencies, and acceptance criteria.
#
# REVISIONS (2026-07-31):
# - Removed Phase 4 (User Preferences) - deferred to future sprint
# - Simplified Phase 3 to llm-bot only (no image-gen-mcp, no tool-gateway)
# - Updated prompts to leverage original message context
# - Documented future nested progress detection strategy
#
# Status Values: not_started | in_progress | blocked | complete
# Priority Values: P0 (critical) | P1 (high) | P2 (medium) | P3 (low)
# Estimates: In hours (h)

sprint:
  id: 377
  title: Long-Running Task Feedback System
  start_date: 2026-07-31
  duration_days: 7-8
  total_tasks: 43
  total_estimate_hours: 71
  revised: 2026-07-31

phases:
  - id: phase_1
    name: Foundation
    days: 1-3
    tasks: 17

  - id: phase_2
    name: LLM-Generated Progress
    days: 4-5
    tasks: 16

  - id: phase_3
    name: LLM-Bot Integration
    days: 6-7
    tasks: 5

  - id: phase_4
    name: Monitoring & Production Readiness
    days: 7-8
    tasks: 5

deferred_features:
  - id: user_preferences_system
    sprint: 378+
    description: Holistic user settings system (progress, notifications, personality, platform-specific)
    estimated_effort: 2-3 days
    original_tasks: TASK-377-038 to TASK-377-044 (removed)

  - id: nested_progress_detection
    sprint: 379+
    description: Smart middleware detection of nested operations to prevent duplicate progress
    estimated_effort: 1-2 days
    documented_in: execution-plan.md § Nested Progress Handling Strategy

