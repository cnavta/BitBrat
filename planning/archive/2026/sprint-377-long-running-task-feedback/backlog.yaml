  - id: TASK-377-002
    title: Implement createDerivedEvent() function
    description: |
      Core function that creates a new event from an existing event,
      preserving routing context and establishing correlation links.

      Responsibilities:
      - Generate new correlationId, eventId, timestamp
      - Copy routing context (platform, channel, user)
      - Copy message from original (IMPORTANT: for LLM context)
      - Copy qos from original (unless overridden)
      - Add derived_from annotation with correlation link
      - Set type at root level
      - Set routing.stage to 'initial'
      - Include custom annotations
    phase: phase_1
    priority: P0
    estimate: 3h
    dependencies:
      - TASK-377-001
    assignee: TBD
    status: not_started
    acceptance_criteria:
      - Function signature matches spec
      - All fields correctly copied from original
      - Original message copied (allows LLM to see user intent)
      - derived_from annotation added automatically
      - New identifiers generated (correlationId, eventId)
      - TypeScript types enforced
    files_changed:
      - src/common/events/derived-event.ts
    tests_required:
      - Test field copying behavior
      - Test message copying (critical for LLM context)
      - Test annotation injection
      - Test identifier generation

  - id: TASK-377-003
    title: Implement createProgressEvent() wrapper
    description: |
      Convenience wrapper around createDerivedEvent() specifically
      for progress events (chat.progress.v1).

      Parameters:
      - originalEvent: InternalEventV2
      - stage: 'initial' | 'update' | 'timeout'
      - context: { operation, parameters, startedAt, elapsedMs }
      - prompt: string (instructions for llm-bot)
      - source: string (service name)

      Returns: InternalEventV2 with type='chat.progress.v1'

      IMPORTANT: Original message is automatically included by createDerivedEvent()
    phase: phase_1
    priority: P0
    estimate: 2h
    dependencies:
      - TASK-377-002
    assignee: TBD
    status: not_started
    acceptance_criteria:
