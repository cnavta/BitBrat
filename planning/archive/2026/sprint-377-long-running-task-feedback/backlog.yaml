  # --------------------------------------------------------------------------
  # Prompt Template Library (Day 4)
  # --------------------------------------------------------------------------

  - id: TASK-377-018
    title: Create prompt template library module
    description: |
      Create module for prompt template generation.

      Responsibilities:
      - Generate prompts for llm-bot based on operation type and stage
      - Leverage original user message for context
      - Instruct LLM to keep responses concise (<100 chars)
      - Instruct LLM to use emoji appropriately
      - Instruct LLM to reference user's original intent

      IMPORTANT: The derived progress event includes the original message,
      so prompts should instruct the LLM to customize based on user intent.

      Example:
      Original message: "!image a sunset over mountains"
      Prompt: "Generate a brief progress message (max 100 chars) that you're
              creating an image based on the user's request. Reference their
              specific subject. Use an emoji."
      LLM output: "🎨 Creating your sunset over mountains image..."
    phase: phase_2
    priority: P0
    estimate: 2h
    dependencies: []
    assignee: TBD
    status: not_started
    acceptance_criteria:
      - File exists at src/common/middleware/progress-prompts.ts
      - Exports buildPrompt() function
      - Prompts instruct LLM to reference original message
      - TypeScript types defined
      - JSDoc documentation complete
    files_changed:
      - src/common/middleware/progress-prompts.ts (NEW)
    tests_required:
      - Unit tests for prompt generation

  - id: TASK-377-019
    title: Implement generic prompts leveraging original message
    description: |
      Generic prompts that work for any operation type.

      Prompt instructions should:
      - Tell LLM to read the user's original message
      - Customize progress based on what user asked for
      - Keep response <100 chars
      - Use emoji appropriately
      - Be encouraging and friendly

      Initial stage:
      "Generate a brief, encouraging progress message (max 100 chars) that
      you're working on the user's request. Read their original message and
      reference their specific intent if possible. Use an emoji. Be friendly."

      Update stage:
      "Generate a brief progress update (max 100 chars) that you're still
      working on it. Be patient and positive. Don't repeat previous messages."

      Timeout stage:
      "Generate a brief message (max 100 chars) that this is taking longer
      than expected but still processing. Be apologetic but reassuring."
    phase: phase_2
    priority: P0
    estimate: 2h
    dependencies:
      - TASK-377-018
    assignee: TBD
    status: not_started
    acceptance_criteria:
      - All three prompts defined
      - Prompts instruct LLM to use original message
      - Character limit instructions included
      - Emoji instructions included
      - Tone guidance included
    files_changed:
