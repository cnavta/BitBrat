acceptance_criteria:
  functional:
    - SecureFile interface defined and documented
    - Validator blocks git-tracked files
    - Validator enforces secure target paths
    - Validator checks file permissions
    - Docker Compose local: files mounted via volumes
    - Docker Compose remote: files transferred via scp
    - Cloud Run: files in Secret Manager
    - Env vars automatically set
    - image-gen-mcp migrated and working
    - No breaking changes to existing deployments

  non_functional:
    - Unit test coverage ≥ 95%
    - Integration tests for all deployment modes
    - Deployment time increase < 10% for 1 file
    - Deployment time increase < 20% for 5 files
    - Clear error messages for all failures
    - Audit logs show file operations
    - Documentation complete

  security:
    - Files never committed to git (enforced)
    - Default permissions 0400
    - No world-readable files
    - Path traversal blocked
    - Encrypted transfer (SSH/TLS)
    - Secrets stored outside repo

