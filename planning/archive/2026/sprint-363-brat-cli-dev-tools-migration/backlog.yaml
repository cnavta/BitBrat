# Risk Register =====================================================
risks:
  - id: RISK-001
    title: WebSocket cleanup in oclif context
    likelihood: medium
    impact: high
    mitigation: Use try/finally to ensure disconnect() is always called
    status: mitigated

  - id: RISK-002
    title: Readline interaction with oclif
    likelihood: low
    impact: medium
    mitigation: ChatController encapsulates readline; proven in legacy CLI
    status: low

  - id: RISK-003
    title: DockerOrchestrator context resolution
    likelihood: low
    impact: medium
    mitigation: DockerOrchestrator supports Sprint 349+ contexts
    status: low

  - id: RISK-004
    title: Port conflicts in docker up
    likelihood: medium
    impact: medium
    mitigation: PortManager handles conflict resolution
    status: low

