        Agent-dev tools may have special context semantics (e.g., creating contexts).
        Ensure context parameter doesn't conflict with agent-dev context management.

    - id: "1.5"
      name: "Implement validateContext() in TargetConnectionManager"
      description: |
        Add public method to validate context exists without creating connection.
        Delegates to ContextResolver.contextExists().
      file: "tools/brat/src/dev-mcp/target-manager.ts"
      type: "core_logic"
      priority: "p0"
      status: "completed"
      estimated_minutes: 15
      dependencies: []
      acceptance_criteria:
        - "Method signature: async validateContext(contextName?: string): Promise<boolean>"
        - "Returns true for valid contexts (local, staging, prod)"
        - "Returns false for invalid contexts"
        - "Uses defaultContext fallback if contextName not provided"
        - "JSDoc comment explains purpose and usage"
      implementation_hint: |
        ```typescript
        async validateContext(contextName?: string): Promise<boolean> {
          const resolved = contextName || this.defaultContext || 'local';
          return await this.contextResolver.contextExists(resolved);
        }
        ```

