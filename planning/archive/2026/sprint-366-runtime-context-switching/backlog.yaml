        - "Pass toolArgs (not args) to toolRouter.callTool()"
        - "Tools receive clean args without context/target"
        - "Log sanitization for debugging"
      implementation_hint: |
        Add before toolRouter.callTool():
        ```typescript
        const { context, target, ...toolArgs } = args as any;
        this.logger.debug({ removedFields: { context, target } }, 'Sanitized args before tool call');
        ```
        Change callTool:
        ```typescript
        const result = await this.toolRouter.callTool(name, toolArgs, connection);
        ```

    - id: "2.6"
      name: "Enhance audit logging with context field"
      description: |
