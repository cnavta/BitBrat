  status: completed
  estimated_hours: 2.25  # 2 hours 15 minutes
  dependencies: ["phase_1_foundation"]

  tasks:
    - id: "2.1"
      name: "Add defaultContext instance variable to DevMcpServer"
      description: |
        Add private defaultContext field to DevMcpServer class and initialize in constructor.
      file: "tools/brat/src/dev-mcp/server.ts"
      type: "core_logic"
      priority: "p0"
      status: "completed"
      estimated_minutes: 10
      dependencies: []
      acceptance_criteria:
        - "Private field: private defaultContext?: string"
        - "Initialized in constructor: this.defaultContext = options.context || 'local'"
        - "Field accessible in request handler"
        - "JSDoc comment documents purpose"
      implementation_hint: |
        Add after line 68 (private logger: Logger):
        ```typescript
        private defaultContext?: string;
        ```
        Add in constructor after logger initialization:
        ```typescript
        this.defaultContext = options.context || 'local';
        ```

    - id: "2.2"
      name: "Update request handler to extract context from args"
      description: |
        Modify CallToolRequestSchema handler to extract context from tool arguments.
      file: "tools/brat/src/dev-mcp/server.ts"
      type: "core_logic"
      priority: "p0"
      status: "completed"
      estimated_minutes: 15
      dependencies: ["2.1"]
      acceptance_criteria:
        - "Extract: const contextName = (args as any).context || this.defaultContext"
        - "Log context extraction for debugging"
        - "Handle undefined context gracefully"
        - "Preserve existing error handling"
      implementation_hint: |
        Add at line ~171 (after extracting name and args):
        ```typescript
        const contextName = (args as any).context || this.defaultContext;
        this.logger.debug({ tool: name, context: contextName }, 'Extracted context from args');
        ```

    - id: "2.3"
      name: "Add context validation to request handler"
      description: |
        Call validateContext() and throw user-friendly error if context unknown.
      file: "tools/brat/src/dev-mcp/server.ts"
      type: "core_logic"
      priority: "p0"
      status: "completed"
      estimated_minutes: 20
      dependencies: ["2.2", "1.5"]
      acceptance_criteria:
        - "Call: const contextExists = await this.targetManager.validateContext(contextName)"
        - "Throw error if !contextExists"
        - "Error message includes available contexts hint"
        - "Error message actionable (run 'brat context list')"
        - "Log validation failure"
      implementation_hint: |
        ```typescript
        const contextExists = await this.targetManager.validateContext(contextName);
        if (!contextExists) {
          throw new Error(
            `Unknown execution context: '${contextName}'. ` +
            `Run 'brat context list' to see available contexts.`
          );
        }
        ```

    - id: "2.4"
      name: "Update connection resolution to use extracted context"
      description: |
        Pass extracted contextName to getActiveConnection() instead of (args as any).target.
