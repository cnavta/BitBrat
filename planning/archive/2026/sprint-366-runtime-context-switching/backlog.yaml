        - "Audit log format documented in comment"
      implementation_hint: |
        Modify auditEntry creation (~186-192):
        ```typescript
        const auditEntry: any = {
          tool: name,
          args: toolArgs,  // Sanitized args
          context: connection.name,  // Sprint 366: Runtime context switching
          target: connection.name,   // Deprecated, kept for backward compatibility
          durationMs,
          success: true,
        };
        ```

    - id: "2.7"
      name: "Update error handling for context resolution failures"
      description: |
        Ensure context-related errors are caught and formatted clearly.
      file: "tools/brat/src/dev-mcp/server.ts"
      type: "core_logic"
      priority: "p1"
      status: "completed"
      estimated_minutes: 15
      dependencies: ["2.3"]
      acceptance_criteria:
        - "Context validation errors formatted clearly"
        - "Connection resolution errors include context name"
        - "Error responses follow MCP CallToolResult format"
        - "Errors logged with context metadata"
      implementation_hint: |
        In catch block, check for context-related errors:
        ```typescript
        if (error.message.includes('Unknown execution context')) {
          // Already formatted, just return
        } else if (error.message.includes('context')) {
          // Enhance with context information
          error.message = `Context '${contextName}': ${error.message}`;
        }
        ```

    - id: "2.8"
      name: "Write unit tests for request handler changes"
      description: |
        Comprehensive unit tests for all request handler logic paths.
      file: "tools/brat/src/dev-mcp/__tests__/request-handler.test.ts"
      type: "test"
      priority: "p0"
      status: "completed"
      estimated_minutes: 45
      dependencies: ["2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "2.7"]
      acceptance_criteria:
