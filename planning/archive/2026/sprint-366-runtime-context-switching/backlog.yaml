        - "Remove deprecated (args as any).target usage"
        - "Connection correctly resolved for context"
        - "Existing connection pooling works"
      implementation_hint: |
        Replace line ~176:
        ```typescript
        // OLD: const connection = await this.targetManager.getActiveConnection((args as any).target);
        // NEW:
        const connection = await this.targetManager.getActiveConnection(contextName);
        ```

    - id: "2.5"
      name: "Sanitize args before passing to tool handler"
      description: |
        Remove 'context' and 'target' fields from args before calling tool handler.
      file: "tools/brat/src/dev-mcp/server.ts"
      type: "core_logic"
      priority: "p0"
      status: "completed"
      estimated_minutes: 10
      dependencies: ["2.4"]
