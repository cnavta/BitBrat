# Sprint 366: Runtime Context Switching - Backlog
# Status: READY FOR EXECUTION
# Sprint Goal: Enable dynamic execution context switching at MCP tool invocation time
# Estimated Duration: 2 work days (15-18 hours)

sprint:
  id: 366
  name: "Runtime Context Switching for Dev MCP"
  status: completed
  start_date: 2026-07-26
  end_date: 2026-07-26
  lead: "Lead Implementor"
  architect: "Lead Architect"
  commit: "cd6b0d00"

metadata:
  total_tasks: 39
  estimated_hours: 12.67  # 12 hours 40 minutes
  realistic_hours: 17.5   # 15-18 hours with buffer
  priority_breakdown:
    p0_critical: 12
    p1_high: 15
    p2_medium: 10
    p3_low: 2
  risk_level: low-medium

# Task Status Values:
# - not_started: Task not yet begun
# - in_progress: Task actively being worked on
# - blocked: Task cannot proceed due to blocker
# - completed: Task finished and verified
# - skipped: Task intentionally skipped

# Priority Values:
# - p0: Critical path, must complete for sprint success
# - p1: High priority, required for full functionality
# - p2: Medium priority, important but not blocking
# - p3: Low priority, nice-to-have

