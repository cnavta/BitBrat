        - "No breaking changes to existing tool calls"

    - id: "1.4"
      name: "Add context parameter to agent-dev tools"
      description: |
        Add optional `context` parameter to all agent-dev tool schemas.
        Tools: agent_dev.list, agent_dev.provision, agent_dev.start, agent_dev.stop, agent_dev.destroy
      file: "tools/brat/src/dev-mcp/tools/agent-dev.ts"
