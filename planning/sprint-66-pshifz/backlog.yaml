      Add prepareToolsForLlm() method signature to LlmCapability interface.
      This method will accept tools with potentially missing schemas and return
      tools with schemas injected from PostgreSQL.
    files:
      - "src/common/profiles/llm-profile.ts"
    acceptanceCriteria:
      - "Method signature added to LlmCapability interface (line ~32)"
      - "TypeScript compilation succeeds"
      - "JSDoc comment explains purpose and usage"
      - "Method signature: prepareToolsForLlm(tools: Record<string, RegisteredTool>): Promise<Record<string, AiSdkTool>>"
    verification:
      - "npm run build (must succeed)"
      - "No TypeScript errors"
      - "Interface visible in IDE autocomplete"

  - id: "1.2"
    title: "Implement mapToolNameToRegistryId helper function"
    phase: 1
    priority: "P0"
    status: "completed"
    effort: "30 minutes"
    dependencies: ["1.1"]
    description: |
      Create helper function to reverse tool name sanitization and map sanitized
      MCP tool names back to PostgreSQL registry IDs. Handles patterns like:
      - mcp_namespace_tool_name → mcp:namespace/tool.name
      - mcp_tool_name → mcp:tool-name
      - mcp:existing → mcp:existing (passthrough)

      CRITICAL: This function must be defined INSIDE LlmProfile.install() closure,
      BEFORE the prepareToolsForLlm() method definition. This ensures access to
      the bit instance and proper scoping.
    files:
      - "src/common/profiles/llm-profile.ts"
    acceptanceCriteria:
      - "Function handles mcp: prefix correctly (passthrough)"
      - "Reverses underscore → dash transformation"
      - "Reverses underscore → dot transformation"
      - "Handles qualified tools (namespace/tool)"
      - "Logs warning for unmappable names"
      - "Returns fallback value (original toolId) on failure"
      - "Function placed INSIDE install() closure, BEFORE prepareToolsForLlm()"
    verification:
      - "npm run build (must succeed)"
      - "Helper function placed before prepareToolsForLlm implementation"
      - "Logging uses bit.getLogger()"
    testCases:
      - input: "mcp:generate_image"
        expected: "mcp:generate_image"
      - input: "mcp_generate_image"
        expected: "mcp:generate-image"
      - input: "mcp_story_engine_mcp_bit_info"
        expected: "mcp:story-engine-mcp/bit.info"
      - input: "mcp_bit_info"
        expected: "mcp:bit.info"

  - id: "1.3"
    title: "Implement prepareToolsForLlm method in LlmProfile.install()"
    phase: 1
    priority: "P0"
    status: "completed"
    effort: "90 minutes"
    dependencies: ["1.1", "1.2"]
    description: |
      Implement the core schema injection logic in LlmProfile.install().
      This method queries PostgreSQL for missing schemas, injects them into
      tools, and returns enriched tools ready for AI SDK.

      CRITICAL PERFORMANCE OPTIMIZATION: Use Promise.all() to process all tools
      in parallel, NOT a sequential for loop. This reduces latency from ~1-2s
      (sequential) to ~50-100ms (parallel) for typical workloads with 300+ tools.
    files:
      - "src/common/profiles/llm-profile.ts"
    implementation:
      location: "After line ~112 (after getConfigKnobs)"
      features:
        - "Lazy initialization of toolStore (documentStore from resources)"
        - "PARALLEL processing: Use Promise.all() with Object.entries(tools).map()"
        - "Query PostgreSQL: toolStore.query('platform_tool_registry', {where: [['id', '==', toolId]], limit: 1})"
        - "Extract schema: toolDoc[0].data.inputSchema"
        - "Convert to AI SDK format: jsonSchema(schemaData)"
        - "Fail-open error handling (try/catch with warn logging)"
        - "Summary logging: total tools, with schema, without schema"
      parallelExecution: |
        const enrichedToolEntries = await Promise.all(
          Object.entries(tools).map(async ([name, tool]) => {
            // Schema lookup logic here
            return [name, enrichedTool];
          })
        );
        const enrichedTools = Object.fromEntries(enrichedToolEntries);
    acceptanceCriteria:
      - "CRITICAL: Method uses Promise.all() for parallel execution (NOT sequential loop)"
      - "Method queries PostgreSQL for each tool with missing schema"
      - "Uses mapToolNameToRegistryId() to map names"
      - "Wraps schemas with AI SDK jsonSchema() helper"
      - "Fail-open behavior: errors logged, execution continues"
      - "Lazy initialization: toolStore only created on first use"
      - "Logs success: bit.llm.prepareToolsForLlm.schema_injected"
      - "Logs failures: bit.llm.prepareToolsForLlm.schema_fetch_failed"
      - "Logs summary: bit.llm.prepareToolsForLlm.complete (includes latency measurement)"
      - "Performance: Schema injection completes in <100ms for typical workloads"
    verification:
      - "npm run build (must succeed)"
      - "No TypeScript errors"
      - "Method accessible via bit.llm.prepareToolsForLlm()"
      - "Implementation uses Promise.all() (verify in code review)"

