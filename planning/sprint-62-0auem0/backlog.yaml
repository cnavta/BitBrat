metadata:
  sprintId: sprint-62-0auem0
  title: "Tool-Orchestrator MCP Aggregation Implementation"
  goal: "Implement MCP tool aggregation in tool-orchestrator service to expose aggregated tools from PostgreSQL registry via MCP endpoint"
  duration: "10 working days (2 weeks)"
  owner: christophernavta

successCriteria:
  - "llm-bot connects to tool-orchestrator when ENABLE_TOOL_ORCHESTRATOR=true"
  - "llm-bot discovers all tools from PostgreSQL registry (not just admin tools)"
  - "No INVALID_RESULT errors in llm-bot logs"
  - "Tool count in llm-bot matches PostgreSQL registry"
  - "Integration test passes"
  - "RBAC filtering works correctly"
  - "Multiple concurrent MCP connections supported"

phases:
  - id: phase-1
    name: "Core Aggregation"
    description: "Enable tool-orchestrator to serve aggregated tools from PostgreSQL registry"
    priority: CRITICAL
    duration: "2-3 days"

  - id: phase-2
    name: "Session & RBAC"
    description: "Implement session-based MCP endpoint with RBAC-filtered tool discovery"
    priority: HIGH
    duration: "2-3 days"

  - id: phase-3
    name: "Cache Management"
    description: "Keep tool cache fresh as registry changes"
    priority: MEDIUM
    duration: "1-2 days"

  - id: phase-4
    name: "Testing & Validation"
    description: "Ensure MCP aggregation works correctly and feature flag enables cutover"
    priority: CRITICAL
    duration: "2-3 days"

