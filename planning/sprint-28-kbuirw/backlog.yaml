# Sprint 28: MCP SDK 2.0 Migration - Prioritized Backlog
# Sprint ID: sprint-28-kbuirw
# Status: Planning
# Last Updated: 2026-08-29

metadata:
  sprint: sprint-28-kbuirw
  title: MCP SDK 2.0 Migration
  estimatedDuration: 5-8 days
  criticalPath: 38 hours + 24h monitoring
  totalTasks: 54
  phases: 7

# Priority Levels:
# P0 = Critical (blocks all future work)
# P1 = High (blocks phase completion)
# P2 = Medium (can be deferred within phase)
# P3 = Low (nice-to-have, can be skipped)

# Status Values:
# pending = Not started
# in_progress = Currently working
# blocked = Waiting on dependency
# completed = Done and validated
# skipped = Intentionally skipped

phases:
  - id: phase-1
    name: Preparation & Setup
    duration: 4 hours
    status: completed
    description: Update dependencies and environment to support MCP SDK 2.0
    validationGate:
      - All packages installed successfully
      - Codemod run without errors
      - Node.js 22.19+ verified in Docker
      - Validation scripts created and tested
    tasks:
      - id: "1.1"
        title: Update Node.js in Docker images
        priority: P0
        status: completed
        estimate: 30 min
        completedNote: Already using Node 24 (>= 22.19.0 requirement satisfied)
        assignee: implementor
        dependencies: []
        files:
          - Dockerfile.service
          - infrastructure/docker-compose/*.yaml
        changes:
          - "FROM node:20-alpine → FROM node:22-alpine"
        validation:
          - Build test image
          - Verify node --version returns 22.19.0+
        tags: [docker, infrastructure]

      - id: "1.2"
        title: Install MCP SDK 2.0 packages
        priority: P0
        status: completed
        estimate: 45 min
        assignee: implementor
        dependencies: []
        commands:
          - npm uninstall @modelcontextprotocol/sdk
          - npm install @modelcontextprotocol/server@^2.0.0
          - npm install @modelcontextprotocol/client@alpha
          - npm install @modelcontextprotocol/express@^2.0.0
          - npm install @modelcontextprotocol/node@^2.0.0
          - npm install zod@^4.2.0
        validation:
          - npm install succeeds
          - No peer dependency warnings
          - package.json updated correctly
        tags: [dependencies, npm]

      - id: "1.3"
        title: Run official codemod
        priority: P0
        status: completed
        estimate: 30 min
        completedNote: 87 changes across 26 files, 6 warnings, 6 error markers for manual review
        assignee: implementor
        dependencies: ["1.2"]
        commands:
          - npx @modelcontextprotocol/codemod@beta v1-to-v2
        validation:
          - Codemod completes without errors
          - Review output for warnings
          - Commit changes separately for review
        tags: [codemod, automation]

      - id: "1.4"
        title: Update package.json metadata
        priority: P1
        status: completed
        estimate: 15 min
        completedNote: Added engines.node >= 22.19.0, build shows expected errors
        assignee: implementor
        dependencies: ["1.2"]
        files:
          - package.json
        changes:
          - Add engines.node >= 22.19.0
          - Update version constraints
        validation:
          - package.json valid JSON
          - npm run build attempt (expect errors, that's OK)
        tags: [metadata, package.json]

      - id: "1.5"
        title: Document baseline metrics
        priority: P2
        status: completed
        estimate: 30 min
        assignee: implementor
        dependencies: []
        metrics:
          - Current build time
          - Current test suite time
          - Docker image size
          - Service startup time (agent-dev)
        output:
          - planning/sprint-28-kbuirw/baseline-metrics.md
        validation:
          - All metrics documented
          - Baseline file committed
        tags: [metrics, documentation]

      - id: "1.6"
        title: Create validation scripts
        priority: P1
        status: completed
        estimate: 60 min
        completedNote: Created validate-mcp-v2.sh and rollback.sh, syntax validated
        assignee: implementor
        dependencies: []
        files:
          - planning/sprint-28-kbuirw/validate-mcp-v2.sh
          - planning/sprint-28-kbuirw/rollback.sh
        validation:
          - Scripts executable (chmod +x)
          - Dry-run both scripts succeeds
          - Scripts committed to repo
        tags: [automation, validation]

