      - Follows RegistryWatcher pattern
    technicalNotes: |
      Similar to src/common/mcp/registry-watcher.ts

      Key differences:
      - Watches 'compositions' collection (not 'service_registry')
      - Three callbacks: onCompositionAdded, onCompositionUpdated, onCompositionRemoved
      - Change detection uses content hash (not JSON stringify)
      - Default interval 30s (not 5s)

