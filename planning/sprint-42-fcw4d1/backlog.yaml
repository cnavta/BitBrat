  - id: COMP-001
    title: "Modify CompositionRegistry.list() to compile definitions"
    description: |
      Update the list() method in CompositionRegistry to compile raw definition
      fields from database records into CompiledComposition objects.

      Current behavior: Returns raw database records (unsafe cast)
      New behavior: Compiles each definition and returns properly-typed records

      Implementation:
      - Add compilation logic using this.compiler.compile()
      - Handle snake_case to camelCase field mapping (database vs TypeScript)
      - Return CompositionRecord[] with compiled field populated
    phase: 1
    priority: P0  # Critical path blocker
    status: pending
    assignee: Lead Implementor
    estimate: 30m
    dependencies: []
    files:
      - src/common/composition/registry.ts
    testCoverage:
      - registry.test.ts
    acceptanceCriteria:
      - list() method compiles all definitions from database
      - Handles both snake_case and camelCase column names
      - Returns properly-typed CompositionRecord objects
      - Code compiles without TypeScript errors
    technicalNotes: |
      Line 289-292 in registry.ts:

      OLD:
      async list(): Promise<CompositionRecord[]> {
        const results = await this.store.query(this.collection, {});
        return results as CompositionRecord[];  // Unsafe!
      }

      NEW:
      async list(): Promise<CompositionRecord[]> {
        const results = await this.store.query(this.collection, {});
        return results.map((row: any) => {
          const definition = row.definition as CompositionDefinition;
          const compiled = this.compiler.compile(definition);
          return {
            id: row.id,
            name: row.name,
            version: row.version,
            contentHash: row.content_hash || row.contentHash,
            compiled,
            createdAt: row.created_at ? new Date(row.created_at) : row.createdAt,
            updatedAt: row.updated_at ? new Date(row.updated_at) : row.updatedAt,
          };
        });
      }

