summary:
  total_tasks: 35
  estimated_hours: 180
  estimated_days: 15
  priority_breakdown:
    P0: 16  # Critical path
    P1: 16  # Important
    P2: 3   # Nice-to-have
  phases:
    - name: "Foundation (T1)"
      tasks: 2
      days: 1
    - name: "ToolGateway (T2)"
      tasks: 8
      days: 5
    - name: "RbacValidator (T3)"
      tasks: 8
      days: 4
    - name: "llm-bot Integration (T4)"
      tasks: 4
      days: 3
    - name: "reflex Integration (T5)"
      tasks: 4
      days: 2
    - name: "Integration & Validation (T6)"
      tasks: 5
      days: 2

notes: |
  Sprint 64 focuses on implementing model-based RBAC, a fundamental shift from
  agent-based permissions to dual-layer validation (User × Model). The LLM model
  (gpt-4, claude-sonnet, etc.) becomes the security principal, not the orchestrating
  agent (llm-bot, query-analyzer).

  Key innovation: Same agent can operate with different permissions based on model
  choice. Example: llm-bot with gpt-4 has premium tool access, llm-bot with gpt-3.5-turbo
  does not.

  Critical path: T1 → T2 → T3 → T4 → T5 → T6

  Breaking change: ToolExecutionContext interface update requires all tool-invoking
  services to update simultaneously. Deploy in single atomic commit to minimize downtime.
