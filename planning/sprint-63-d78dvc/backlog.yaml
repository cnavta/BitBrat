      - "Deprecates non-preferred tools with descriptive reason"
      - "Logs deduplication decisions"
      - "Handles no duplicates gracefully (no-op)"

    tests_required:
      - "deduplicateTool() prefers internal over mcp"
      - "deduplicateTool() prefers composition over mcp"
      - "deduplicateTool() handles no duplicates"

