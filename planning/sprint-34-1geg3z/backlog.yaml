# ============================================
# PHASE 2A: PATTERN MATCHER ENHANCEMENT
# ============================================

  - id: T005
    phase: phase-2
    title: "Implement matchRegexWithCaptures function"
    description: |
      Create private helper function in pattern-matcher.ts that extracts
      capture groups from regex.exec() result. Handles full match (index 0)
      plus all capture groups (index 1+).
    priority: P0
    estimate: 0.75h
    status: completed
    dependencies: [T001, T002]
    files:
      - path: src/services/reflex/pattern-matcher.ts
        action: modify
        section: "Add matchRegexWithCaptures function"
    acceptanceCriteria:
      - "Function signature: matchRegexWithCaptures(value, pattern, flags?) → MatchResult"
      - "Uses regex.exec() to extract captures"
      - "Returns MatchResult with matched=false if no match"
      - "Returns MatchResult with matched=true + captures if match"
      - "Captures include index 0 (full match) + 1+ (groups)"
      - "Handles undefined capture groups gracefully"
    testStrategy: "Manual verification + unit tests in T009"

  - id: T006
    phase: phase-2
    title: "Implement matchPatternWithCaptures function"
    description: |
      Create new matchPatternWithCaptures() function that handles all 5 pattern
      types (exact, contains, prefix, suffix, regex) and returns MatchResult.
      For regex, delegates to matchRegexWithCaptures. For other types, creates
      simple captures[0] with matched portion.
    priority: P0
    estimate: 0.75h
    status: completed
    dependencies: [T005]
    files:
      - path: src/services/reflex/pattern-matcher.ts
        action: modify
        section: "Add matchPatternWithCaptures function"
    acceptanceCriteria:
      - "Function signature matches architecture spec"
      - "Handles all 5 pattern types (exact, contains, prefix, suffix, regex)"
      - "Regex type uses matchRegexWithCaptures"
      - "Non-regex types set captures[0] = matched portion"
      - "Performance logging if >10ms (existing behavior)"
      - "Returns MatchResult in all cases"
    testStrategy: "Manual verification + unit tests in T009"

  - id: T007
    phase: phase-2
    title: "Maintain backward-compatible matchPattern function"
    description: |
      Keep existing matchPattern() function that returns boolean, but
      internally call matchPatternWithCaptures() and return .matched property.
      This ensures existing code continues working without changes.
    priority: P0
    estimate: 0.25h
    status: completed
    dependencies: [T006]
    files:
      - path: src/services/reflex/pattern-matcher.ts
        action: modify
        section: "Update matchPattern function"
    acceptanceCriteria:
      - "matchPattern() signature unchanged (returns boolean)"
      - "Internally calls matchPatternWithCaptures().matched"
      - "All existing call sites continue working"
      - "No breaking changes"
    testStrategy: "Existing pattern-matcher tests pass"

  - id: T008
