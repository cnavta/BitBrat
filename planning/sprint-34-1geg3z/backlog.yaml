# ========================================
# PHASE 1: FOUNDATION (Type Definitions)
# ========================================

tasks:
  - id: T001
    phase: phase-1
    title: "Define MatchCaptures interface"
    description: |
      Create the MatchCaptures interface in src/types/reflex.ts to represent
      captured groups from regex pattern matching. Index 0 is the full match,
      indexes 1+ are capture groups.
    priority: P0
    estimate: 0.15h
    status: completed
    dependencies: []
    files:
      - path: src/types/reflex.ts
        action: modify
        section: "Type definitions"
    acceptanceCriteria:
      - "MatchCaptures interface defined with index signature"
      - "Index 0 is full match (string)"
      - "Index 1+ are capture groups (string | undefined)"
      - "JSDoc includes 2 examples (single capture, multiple captures)"
      - "TypeScript compilation succeeds"
    testStrategy: "Type checking only (no runtime tests needed)"

  - id: T002
    phase: phase-1
    title: "Define MatchResult interface"
    description: |
      Create the MatchResult interface to wrap match status and optional captures.
      This replaces the boolean return type from matchPattern().
    priority: P0
    estimate: 0.10h
    status: completed
    dependencies: [T001]
    files:
      - path: src/types/reflex.ts
        action: modify
        section: "Type definitions"
    acceptanceCriteria:
      - "MatchResult interface defined with 'matched' boolean"
      - "Optional 'captures' field of type MatchCaptures"
      - "JSDoc documentation complete"
      - "TypeScript compilation succeeds"
    testStrategy: "Type checking only"

  - id: T003
    phase: phase-1
