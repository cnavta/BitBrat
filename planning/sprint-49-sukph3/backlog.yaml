      - id: FIX-003
        priority: P0
        title: Fix grockle composition execution error
        description: |
          Fixed invalid JSON Pointer references in grockle.yaml.

          ROOT CAUSE: Composition was using incorrect JSON Pointers that didn't
          match MCP standard tool result format.

          BUGS FIXED:
          1. Line 58/67: /retrieve_notes/value → /retrieve_notes/content/0/text
          2. Line 89: /generate_image/url → /generate_image/content/0/text

          MCP tools return: { content: [{ type: 'text', text: '...' }] }
          JSON Pointers must reference this standard format.
        estimatedHours: 1.5
        actualHours: 0.5
        status: completed
        dependencies: [INVESTIGATE-003]
        files:
          - examples/compositions/grockle.yaml
        acceptance:
          - JSON Pointers corrected to MCP standard format ✓
          - /retrieve_notes references /content/0/text ✓
          - /generate_image references /content/0/text ✓
          - Comments added explaining MCP format ✓
        notes: |
          IMPLEMENTATION DETAILS:

          Fixed two invalid JSON Pointer references in grockle.yaml:

          1. get_state result (lines 58, 67):
             - BEFORE: /retrieve_notes/value
             - AFTER: /retrieve_notes/content/0/text
             - Reason: get_state returns { content: [{ type: 'text', text: '...' }] }

          2. generate_image result (line 89):
             - BEFORE: /generate_image/url
             - AFTER: /generate_image/content/0/text
             - Reason: generate_image returns { content: [{ type: 'text', text: 'Image... URL: ...' }] }

          Added explanatory comments documenting the MCP standard format.

          KNOWN LIMITATION:
          get_state returns JSON string in content[0].text, not parsed object.
          The composition will receive the full JSON string, which may need
          parsing to extract the actual state value. This is acceptable for
          grockle's use case as it combines the full result with description.

