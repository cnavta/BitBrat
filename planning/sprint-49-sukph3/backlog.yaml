      - id: INVESTIGATE-004
        priority: P0-CRITICAL
        title: Analyze single-bit deploy infrastructure redeployment bug
        description: |
          CRITICAL BUG: brat bit deploy <service> re-deploys ALL infrastructure
          (NATS, Redis, PostgreSQL), breaking already-deployed services.
          brat bit deploy --all works correctly.

          Investigation tasks:
          - Identify where single-bit deploy triggers infrastructure redeployment
          - Compare single-bit vs bulk deployment orchestrator code paths
          - Determine why infrastructure is included in single-bit deployments
          - Document expected behavior: infrastructure should only deploy once
        estimatedHours: 1
        status: completed
        dependencies: []
        acceptance:
          - Root cause identified in deployment orchestrator code ✓
          - Difference between single-bit and bulk deployment documented ✓
          - Fix strategy identified (skip infrastructure or detect already-deployed) ✓
          - Code location documented for FIX-004 ✓
        notes: |
          ROOT CAUSE IDENTIFIED:

          Single-service deploy (execute() method, line 275-399):
          - getComposeFilePath() returns base compose file (docker-compose.{context}.yaml)
          - Base file includes infrastructure services (NATS, Redis, PostgreSQL)
          - Merges base + service-specific file
          - Writes back to base file path
          - Orchestrator processes full file, restarts infrastructure

          Bulk deploy (deployAll() method, line 891-1442):
          - Also uses base compose file with infrastructure
          - Merges all service-specific files
          - Writes to temporary merged file
          - Orchestrator deploys everything once (infrastructure doesn't restart)

          FIX STRATEGY:
          For single-service deploys, create minimal compose file with:
          1. Network definition (reference existing network)
          2. Service definition only (from service-specific file)
          3. depends_on references to infrastructure (without including definitions)
          4. Use 'external: true' for network so it connects to existing

          This matches how service-specific files work - they don't redefine infrastructure,
          they just reference it via network membership.

