    contentToAdd: |
      ### Port Assignment (Automatic)

      Both single-service and bulk deployments use PortManager for automatic port assignment:

      ```bash
      # Single service - auto-assigns ports
      brat bit deploy llm-bot

      # Bulk deployment - auto-assigns ports (Sprint 379+)
      brat bit deploy --all
      ```

      **How It Works:**
      - PortManager discovers ports in use via `docker ps` (local or remote via SSH)
      - Auto-assigns unique ports starting from 3001
      - Avoids conflicts with running containers
      - Logs port assignments for visibility

      **Override with explicit port:**
      ```bash
      LLM_BOT_HOST_PORT=5000 brat bit deploy llm-bot
      LLM_BOT_HOST_PORT=5000 brat bit deploy --all
      ```

      **Port Assignment Priority:**
      1. Explicit `{SERVICE}_HOST_PORT` environment variables (highest)
      2. Auto-assigned ports from PortManager (starting at 3001)
      3. Default ports in compose files (fallback, not recommended)

      See `documentation/guides/port-management.md` for full details.

    acceptanceCriteria:
      - CLAUDE.md updated
      - Examples added
      - Cross-reference to guide

