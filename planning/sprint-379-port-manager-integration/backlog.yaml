    description: |
      Commit Phase 1 implementation with comprehensive commit message.

    commitMessage: |
      feat(sprint-379): Integrate PortManager into bulk deployments

      **Problem:**
      Bulk deployments (`brat bit deploy --all`) bypassed PortManager,
      causing port conflicts that didn't occur in single-service deployments.

      **Root Cause:**
      When `options.composeFile` provided (bulk deployment), orchestrator
      set `serviceFiles: []` (empty array). PortManager received empty array
      and couldn't extract service names, so no port assignments generated.

      **Solution:**
      - Extended DockerOrchestratorOptions with optional `allServiceNames` field
      - Modified deployAll() to pass service names to orchestrator
      - Updated orchestrator to construct service file paths from service names
      - Added validation and comprehensive logging

      **Changes:**
      - orchestrator.ts: Added service file construction logic (+45 lines)
      - docker-compose-strategy.ts: Pass service names to orchestrator (+10 lines)
      - Added error handling for missing compose files
      - Added comprehensive logging at all stages

      **Testing:**
      - Manual testing: bulk deployment succeeds locally
      - Port assignments logged correctly
      - No port conflicts

      **Next Steps:**
      - Add unit tests (Phase 2)
      - Add integration tests (Phase 2)
      - Staging validation (Phase 3)

      Fixes Bug #19

      🤖 Generated with [Claude Code](https://claude.com/claude-code)

      Co-Authored-By: Claude <noreply@anthropic.com>

