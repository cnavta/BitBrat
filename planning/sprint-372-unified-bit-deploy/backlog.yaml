  - id: DEPLOY-031
    title: "BUG FIX: Single service deployment builds all services"
    description: |
      Fix bug where `brat bit deploy <service>` to context-specific compose file
      (e.g., staging) builds ALL services instead of just the target service.

      Root cause: ComposeFactory returns empty serviceFiles array for context-specific
      compose files, causing orchestrator to build all buildable services from base file.

      Fix: Track target service via synthetic service file path, and only build
      target service when single-service deployment is requested.
    phase: integration
    day: 8
    priority: P0
    status: completed
    estimate: "2 hours"
    dependencies:
      - DEPLOY-027
    files:
      - tools/brat/src/orchestration/docker/compose-factory.ts
      - tools/brat/src/orchestration/docker/orchestrator.ts
    acceptance_criteria:
      - Single service deployment builds only that service
      - All-services deployment still builds all services
      - Tests pass (no regressions)
      - Dry-run shows correct service count
    notes: |
      Two-part fix:
      1. compose-factory.ts: Store synthetic service file path for single-service
         deployments to context-specific compose files
      2. orchestrator.ts: Only build target service when this.options.service
         is set and services array is non-empty

