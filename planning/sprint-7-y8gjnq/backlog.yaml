sprint: 6
goal: Complete Foundation (Schema/Validation) + Begin Production Migration (Staging/Prod Contexts)
duration: 2 weeks
startDate: 2026-08-11
endDate: 2026-08-22

priorities:
  P0: Blocker - Required for validation/migration
  P1: Critical - Production readiness
  P2: Important - Technical debt/documentation
  P3: Nice-to-have - Future improvements

tasks:
  # ========================================================================
  # PHASE 1: Schema & Validation (Week 1, Days 1-3)
  # ========================================================================

  - id: S6-F1.1
    title: Create JSON Schema for architecture.yaml v2
    phase: Foundation
    priority: P0
    estimate: 2d
    assignee: Platform Team
    dependencies: []
    status: completed
    description: |
      Create formal JSON Schema definition for architecture.yaml v2 with complete
      validation rules for platform.infrastructure, infrastructure.{provider},
      executionContexts.*.infrastructure, and services.*.dependencies.infrastructure.
    deliverables:
      - documentation/schemas/architecture.v2.json
      - tools/brat/src/validation/architecture-schema-v2.ts
      - Unit tests (90%+ coverage)
    acceptance:
      - Schema validates all Sprint 5 examples
      - Schema catches invalid configurations (missing providers, circular deps)
      - Schema supports all providers (docker, gcp, aws, azure, k8s)
      - Unit tests cover edge cases
    tags: [foundation, schema, validation]

  - id: S6-F1.2
    title: Implement validation CLI (brat config validate --schema v2)
    phase: Foundation
    priority: P0
    estimate: 1d
    assignee: Platform Team
    dependencies: [S6-F1.1]
    status: completed
    description: |
      Enhance existing 'brat config validate' command to support --schema v2 flag
      with detailed error reporting (file paths, line numbers, field context).
    deliverables:
      - tools/brat/src/oclif-commands/config/validate.ts (enhanced)
      - CLI tests with valid/invalid configurations
      - Error message templates
    acceptance:
      - Validates architecture.yaml against JSON Schema
      - Reports errors with context (file:line:field)
      - Supports --json flag for CI/CD
      - Exit code 0 (valid) or 1 (invalid)
    tags: [foundation, cli, validation]

  # ========================================================================
  # PHASE 2: Migration Tooling (Week 1, Days 4-5)
  # ========================================================================

  - id: S6-M2.1
    title: Implement migration validator CLI (brat config migrate)
    phase: Migration Tooling
    priority: P1
    estimate: 2d
    assignee: Platform Team
    dependencies: [S6-F1.1, S6-F1.2]
    status: completed
    description: |
      Create 'brat config migrate' command that detects v1 vs v2 schema,
      generates migration report with breaking changes, and supports --dry-run mode.
    deliverables:
      - tools/brat/src/oclif-commands/config/migrate.ts
      - Migration report template (YAML/JSON)
      - Before/after diff output
    acceptance:
      - Detects v1 schema patterns (hardcoded infrastructure)
      - Suggests v2 equivalents (declarative infrastructure)
      - Reports breaking changes (removed fields, renames)
      - Supports --dry-run flag (preview only)
      - Generates machine-readable report
    tags: [migration, cli, tooling]

  - id: S6-M2.2
    title: Create migration documentation and examples
    phase: Migration Tooling
    priority: P1
    estimate: 0.5d
    assignee: Documentation Team
    dependencies: [S6-M2.1]
    status: completed
    description: |
      Document migration process with step-by-step guide and before/after examples
      for common migration scenarios (local → staging → prod).
    deliverables:
      - planning/sprint-6-foundation/migration-workflow.md
      - Before/after migration examples
      - Rollback procedure documentation
    acceptance:
      - Step-by-step migration guide complete
      - Examples for local, staging, prod contexts
      - Rollback procedure documented
      - Common issues and solutions documented
    tags: [migration, documentation]

  # ========================================================================
  # PHASE 3: Production Migration (Week 2, Days 1-4)
  # ========================================================================

  - id: S6-P3.1
    title: Migrate staging context to architecture.yaml v2
    phase: Production Migration
    priority: P1
    estimate: 1d
    assignee: Platform Team + DevOps
    dependencies: [S6-F1.2, S6-M2.1]
    status: completed
    description: |
      Migrate staging execution context to architecture.yaml v2 schema with
      platform.infrastructure, infrastructure.docker, and service dependencies.
    deliverables:
      - Updated architecture.yaml (staging context in v2 schema)
      - Migration validation report
      - Staging deployment test results
    acceptance:
      - Staging context passes 'brat config validate --schema v2'
      - All services declare infrastructure dependencies explicitly
      - Staging deployment successful with v2 config
      - All services healthy after deployment
      - Rollback tested
    tags: [production, migration, staging]

  - id: S6-P3.2
    title: Migrate prod context to architecture.yaml v2
    phase: Production Migration
    priority: P1
    estimate: 2d
    assignee: Platform Team + DevOps
    dependencies: [S6-P3.1, S6-P3.3]
    status: skipped
    description: |
      SKIPPED - Not needed for Sprint 6.
      Production context will remain on current schema.
    tags: [production, migration, skipped]

  - id: S6-P3.3
    title: Implement GCP provider in InfrastructureRegistry
    phase: Production Migration
    priority: P2
    estimate: 2d
    assignee: Cloud Infrastructure Team
    dependencies: [S6-F1.1]
    status: skipped
    description: |
      SKIPPED - Not needed for Sprint 6.
      GCP provider implementation deferred to future sprint.
    tags: [infrastructure, gcp, multi-cloud, skipped]

  - id: S6-P3.4
    title: Validate multi-environment consistency
    phase: Production Migration
    priority: P1
    estimate: 0.5d
    assignee: QA Team
    dependencies: [S6-P3.1]
    status: completed
    description: |
      Validate that all environments (local, staging, agent-dev ephemeral contexts)
      use architecture.yaml v2 consistently with same platform.infrastructure
      declarations and docker provider.
    deliverables:
      - Multi-environment validation report
      - Consistency test suite
    acceptance:
      - All contexts (local, staging, agent-dev) use same platform.infrastructure declarations
      - All contexts use docker provider
      - All contexts pass schema validation
      - Service dependencies consistent across environments
      - Agent-dev ephemeral contexts validated
    tags: [validation, qa, multi-environment]

  # ========================================================================
  # PHASE 4: Cleanup & Documentation (Week 2, Day 5)
  # ========================================================================

  - id: S6-C4.1
    title: Remove docker-compose.local.yaml (fully deprecated)
    phase: Cleanup
    priority: P2
    estimate: 0.5d
    assignee: Platform Team
    dependencies: [S6-P3.1]
    status: completed
    description: |
      Remove docker-compose.local.yaml file (deprecated in Sprint 5) and update
      all references to use dynamically generated compose files from architecture.yaml v2.
    deliverables:
      - Deleted infrastructure/docker-compose/docker-compose.local.yaml
      - Updated tests (no references to static compose file)
      - Updated documentation
    acceptance:
      - docker-compose.local.yaml removed
      - All tests pass without static compose file
      - No references to docker-compose.local.yaml in code/docs
      - Dynamic compose generation works for all contexts
    tags: [cleanup, technical-debt]

  - id: S6-C4.2
    title: Update documentation with v2 schema examples
    phase: Cleanup
    priority: P2
    estimate: 0.5d
    assignee: Documentation Team
    dependencies: [S6-P3.1]
    status: completed
    description: |
      Update all documentation to use architecture.yaml v2 schema with docker provider
      examples, schema validation troubleshooting, and migration best practices.
    deliverables:
      - Updated documentation/architecture/infrastructure-management.md
      - Docker provider examples (nats, postgres, redis)
      - Schema validation troubleshooting section
    acceptance:
      - All examples use architecture.yaml v2 schema
      - Docker provider examples documented
      - Common validation errors documented with solutions
      - Before/after migration examples included
    tags: [documentation, examples]

  - id: S6-C4.3
    title: Archive v1 schema references
    phase: Cleanup
    priority: P3
    estimate: 0.25d
    assignee: Documentation Team
    dependencies: [S6-C4.1, S6-C4.2]
    status: pending
    description: |
      Archive all v1 schema documentation and examples to deprecated/ directory
      with clear deprecation notices and links to v2 equivalents.
    deliverables:
      - Moved v1 docs to deprecated/architecture-v1/
      - Added deprecation notices with v2 links
      - Updated all active docs to reference v2 only
    acceptance:
      - No v1 references in active documentation
      - v1 docs archived with deprecation notices
      - Clear migration path from v1 → v2 documented
    tags: [cleanup, deprecation]

  # ========================================================================
  # SPRINT COMPLETION TASKS
  # ========================================================================

  - id: S6-X5.1
    title: Create Sprint 6 verification report
    phase: Completion
    priority: P1
    estimate: 0.5d
    assignee: Lead Implementor
    dependencies: [S6-P3.1, S6-C4.1, S6-C4.2]
    status: completed
    description: |
      Document Sprint 6 deliverables, test results, migration outcomes,
      and staging/local/agent-dev validation.
    deliverables:
      - planning/sprint-6-foundation/verification-report.md
      - Migration success metrics
      - Staging migration checklist
    acceptance:
      - All deliverables documented
      - Test results included
      - Migration outcomes reported
      - Staging validation completed
    tags: [completion, reporting]

  - id: S6-X5.2
    title: Generate Sprint 6 retrospective and learnings
    phase: Completion
    priority: P1
    estimate: 0.5d
    assignee: Lead Implementor
    dependencies: [S6-X5.1]
    status: completed
    description: |
      Conduct Sprint 6 retrospective documenting what went well, what could
      be improved, and key learnings for future schema/migration work.
    deliverables:
      - planning/sprint-6-foundation/retro.md
      - planning/sprint-6-foundation/key-learnings.md
    acceptance:
      - Retrospective complete
      - Key learnings documented
      - Recommendations for Sprint 7
    tags: [completion, retrospective]

# ========================================================================
# SUMMARY METRICS
# ========================================================================

metrics:
  totalTasks: 15
  estimatedDays: 10.75
  phases:
    - name: Foundation
      tasks: 2
      estimate: 3d
      priority: P0
    - name: Migration Tooling
      tasks: 2
      estimate: 2.5d
