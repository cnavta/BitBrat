  # PHASE 1: Create IntegrationBit Base Class
  # =============================================================================

  - id: 1.1
    title: "Create Type Definitions"
    phase: 1
    priority: critical
    status: completed
    estimatedHours: 0.5
    dependencies: []
    files:
      - src/common/integration-bit.ts
    description: |
      Define ConnectorFactory type and IntegrationBitConfig interface with JSDoc.
    acceptanceCriteria:
      - TypeScript compiles without errors
      - Types are exported correctly
      - JSDoc comments include usage examples
    rollback: "Delete file (no dependencies)"

  - id: 1.2
    title: "Implement Constructor and Instance ID Resolution"
    phase: 1
    priority: critical
    status: completed
    estimatedHours: 1
    dependencies: [1.1]
    files:
      - src/common/integration-bit.ts
    description: |
      Create IntegrationBit class extending Bit with constructor, resolveInstanceId(), and initialization.
    acceptanceCriteria:
      - Constructor initializes connectorManager
      - Instance ID resolves from env vars or generates fallback
      - Logger is accessible via this.getLogger()
      - egressTopic is correctly formatted
    rollback: "Revert constructor implementation"

  - id: 1.3
    title: "Implement registerConnectors() Method"
    phase: 1
    priority: critical
    status: completed
    estimatedHours: 2
    dependencies: [1.2]
    files:
      - src/common/integration-bit.ts
    description: |
      Implement connector registration loop with error handling and fail-open strategy.
    acceptanceCriteria:
      - Connectors registered successfully with valid factories
      - Disabled connectors are skipped
      - Failed connectors don't block other registrations
      - Errors logged with stack traces
      - Tests: single connector, multiple connectors, disabled, factory errors
    rollback: "Remove method call from constructor"
    testCases:
      - "Register single connector"
      - "Register multiple connectors"
      - "Skip disabled connectors"
      - "Handle factory errors gracefully"
      - "Logger receives correct events"

  - id: 1.4
    title: "Implement setupWebhookRouting() Method"
    phase: 1
    priority: critical
    status: completed
    estimatedHours: 2
    dependencies: [1.3]
    files:
      - src/common/integration-bit.ts
    description: |
      Implement generic webhook route (POST /webhooks/:platform) with signature verification.
    acceptanceCriteria:
      - Route is registered correctly
      - Platform lookup works
      - Signature verification is called
      - Errors are handled gracefully
      - Correct HTTP status codes returned
    rollback: "Remove method call from constructor"
    testCases:
      - "Valid webhook with correct signature returns 200"
      - "Invalid signature returns 403"
      - "Unknown platform returns 404"
      - "Missing platform parameter returns 400"
      - "Connector without webhook support returns 501"
      - "Handler error returns 500"

