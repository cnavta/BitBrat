# Sprint 378: Deploy All Enhancement - Trackable Backlog
# Goal: Fix bulk deployment (--all flag) to process service-specific configuration

sprint:
  id: 378
  name: "Deploy All Enhancement"
  goal: "Fix bulk deployment environment variable and secureFiles handling"
  duration_days: 4
  status: pending
  priority: high
  complexity: medium-high

tasks:
  # ==============================================================================
  # DAY 1: ANALYSIS & CORE IMPLEMENTATION
  # ==============================================================================

  - id: 378-001
    title: "Understand current single-service deployment implementation"
    description: |
      Deep dive into the execute() method to understand how single-service deployments
      process service-specific config, merge compose files, and handle secureFiles.
      Document the complete flow with data structures and transformations.
    phase: "Analysis"
    day: 1
    priority: critical
    estimate_hours: 1
    status: pending
    dependencies: []
    files:
      - "tools/brat/src/orchestration/deployment/docker-compose-strategy.ts"
    acceptance_criteria:
      - "Flow diagram created showing execute() method steps"
      - "All data structures documented (DeploymentPlan, secureFiles, etc.)"
      - "ComposeMerger usage understood and documented"
      - "Ready to design bulk implementation"
    notes: |
      Focus on lines 185-340 of docker-compose-strategy.ts
      Pay special attention to:
      - How ComposeMerger is instantiated and used
      - How secureFiles are validated and transferred
      - How environment variables are injected

  - id: 378-002
    title: "Design bulk merge strategy for multiple service-specific compose files"
    description: |
      Design how to merge N service-specific compose files into one base compose file.
      Decide on conflict resolution strategies, secureFiles aggregation, and temporary
      file handling. Write detailed pseudocode for enhanced deployAll().
    phase: "Analysis"
    day: 1
    priority: critical
    estimate_hours: 2
    status: pending
    dependencies: ["378-001"]
    deliverables:
      - "Design document with merge strategy"
      - "Pseudocode for enhanced deployAll()"
      - "Conflict resolution decision matrix"
      - "Edge case identification"
    decisions:
      - "Service not found in base compose → Skip with warning (lenient mode)"
      - "Conflicting environment variables → Last-wins"
      - "Duplicate volume names → Allow (Docker handles conflicts)"
      - "Conflicting port mappings → Detect and warn"
    acceptance_criteria:
      - "Merge strategy clearly defined"
      - "Edge cases identified and handled"
      - "Pseudocode reviewed and approved"
      - "Ready to implement"

  - id: 378-003
    title: "Implement service-specific compose file collection"
    description: |
      Implement logic to collect all service-specific compose files from
      infrastructure/docker-compose/services/ directory for services being deployed
      in bulk mode. Store in structured format for iterative merging.
    phase: "Core Implementation"
    day: 1
    priority: critical
    estimate_hours: 1
    status: pending
    dependencies: ["378-002"]
    files:
      - "tools/brat/src/orchestration/deployment/docker-compose-strategy.ts"
    implementation:
      location: "deployAll() method, after line 598"
      data_structure: "Array<{ service: string; path: string; yaml: string }>"
    acceptance_criteria:
      - "All service-specific compose files collected"
      - "Non-existent files skipped without error"
      - "Logging confirms collection count"
      - "Data structure ready for merging"

  - id: 378-004
    title: "Implement iterative compose merging for all services"
    description: |
      Use ComposeMerger to iteratively merge each service-specific compose file into
      the base compose file. Handle merge conflicts with last-wins strategy. Track
      merge statistics (volumes, env vars, dependencies added).
    phase: "Core Implementation"
    day: 1
    priority: critical
    estimate_hours: 2
    status: pending
    dependencies: ["378-003"]
    files:
      - "tools/brat/src/orchestration/deployment/docker-compose-strategy.ts"
    implementation:
      uses: "ComposeMerger"
      strategy: "lenient merge mode with last-wins for conflicts"
    acceptance_criteria:
      - "All service-specific files merged into base compose"
      - "Merge stats logged for each service"
      - "Final merge stats logged (total volumes, env, deps)"
      - "Errors include service name for debugging"
      - "Last-wins behavior verified for conflicts"

  - id: 378-005
    title: "Implement secureFiles collection and validation for all services"
    description: |
      Collect secureFiles declarations from all services being deployed. Validate
      each service's secureFiles using SecureFilesValidator. Filter by execution
      context. Aggregate into a Map keyed by service name.
    phase: "Core Implementation"
    day: 1
    priority: critical
    estimate_hours: 2
    status: pending
    dependencies: ["378-002"]
    files:
      - "tools/brat/src/orchestration/deployment/docker-compose-strategy.ts"
    implementation:
      uses: "SecureFilesValidator"
      data_structure: "Map<string, SecureFile[]>"
      filters: "context-based filtering"
    acceptance_criteria:
      - "All services' secureFiles collected"
      - "Validation errors throw with service name"
      - "Warnings logged but don't fail deployment"
      - "Context filtering works correctly"
      - "Total count logged across all services"

