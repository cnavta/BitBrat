      - "Environment variables injected for all services with secureFiles"
      - "Merged YAML remains valid after injection"
      - "Injection count logged per service"

  - id: 378-009
    title: "Implement temporary merged compose file creation and cleanup"
    description: |
      Write the final merged compose YAML to a temporary file
      (.docker-compose.merged.yaml). Pass this file to DockerOrchestrator.
      Ensure cleanup happens in finally block (success or failure).
    phase: "SecureFiles Processing"
    day: 2
    priority: critical
    estimate_hours: 1
    status: pending
    dependencies: ["378-008"]
    files:
      - "tools/brat/src/orchestration/deployment/docker-compose-strategy.ts"
    implementation:
      temp_file: "infrastructure/docker-compose/.docker-compose.merged.yaml"
      cleanup: "try/finally block"
    acceptance_criteria:
      - "Temp file created before deployment"
      - "DockerOrchestrator uses temp file via composeFile option"
      - "Temp file cleaned up on deployment success"
      - "Temp file cleaned up on deployment failure"
      - "File path logged for debugging"

  - id: 378-010
    title: "Update DockerOrchestrator to accept custom compose file path"
    description: |
