    - title: "mcp-server 10/10 passing"
      tasks: [T3, T4]
      status: pending
      baseline: "7/10 passing (3 auth tests failing)"
      target: "10/10 passing"
      metric: "3 tests fixed"

    - title: "Failing suites ≤3"
      tasks: [T9]
      status: pending
      baseline: "5 failing suites"
      target: "≤3 failing suites"
      metric: "2+ suites fixed"

  nice_to_have:
    - title: "Flaky tests resolved or documented"
      tasks: [T5, T6, T7]
      status: pending
      condition: "If T2 identifies flaky tests"

    - title: "Failing suites ≤2"
      tasks: [T9]
      status: pending
      baseline: "5 failing suites"
