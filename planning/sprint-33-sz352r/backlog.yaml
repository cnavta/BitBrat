      improvement_target: ">93%"

    failing_tests:
      sprint_30_baseline: 112
      sprint_33_target: "≤3"
      improvement_target: ">97%"

# Risk Management
risks:
  - id: RISK-1
    description: "mcp-server root cause unclear or complex"
    likelihood: medium
    impact: high
    blocks: "P1 goal (must-have)"
    mitigation: "Timebox T3 investigation to 30 minutes"
    contingency: "Escalate to maintainer, create dedicated bug-fix sprint, document as known issue"

  - id: RISK-2
    description: "Flaky tests prove difficult to stabilize"
    likelihood: medium
    impact: medium
    blocks: "Nice-to-have goal"
    mitigation: "Use retry logic as fallback, accept some flakiness"
    contingency: "Mark as 'known flaky', document pattern, defer to future sprint"

  - id: RISK-3
    description: "Multi-run baseline inconclusive (all tests inconsistent)"
    likelihood: low
    impact: low
    mitigation: "Run 10 iterations instead of 5, increase sample size"
    contingency: "Use best judgment based on Sprint 32 observations"

  - id: RISK-4
    description: "Category A tests require more investment than expected"
    likelihood: low
    impact: low
    blocks: "Stretch goal only"
    mitigation: "Use minimal Docker image approach if attempting"
    contingency: "Accept deferral, document clearly"

  - id: RISK-5
    description: "Fixes introduce regressions in other tests"
    likelihood: low
    impact: high
    mitigation: "Run full suite after each phase, granular commits"
    contingency: "Rollback to previous commit, re-investigate"

# Sprint 32 Learnings Applied
learnings_applied:
  - learning: "Multi-run baselines detect flaky tests early"
    sprint_source: "Sprint 32 (2 new failures appeared)"
    application: "T2 multi-run baseline as P0 task"
    impact: "Prevents chasing environmental noise"

  - learning: "Hypothesis-driven investigation is efficient"
    sprint_source: "Sprint 32 (MCP v2 + Sprint 324 prediction accurate)"
    application: "T3 has 3 clear hypotheses to test"
    impact: "Focused investigation, faster root cause"

  - learning: "Pattern recognition accelerates fixes"
    sprint_source: "Sprint 32 (same MCP v2 fix across 3 suites)"
    application: "T4 fix patterns documented upfront"
    impact: "Faster implementation once root cause found"

  - learning: "Realistic goal setting prevents disappointment"
    sprint_source: "Sprint 32 (0 suites goal too ambitious, <5 achieved)"
    application: "Conservative goal (≤3) with stretch (0)"
    impact: "Guaranteed success, bonus if exceeded"

  - learning: "Document deferrals with justification"
    sprint_source: "Sprint 32 (Category A deferred with rationale)"
    application: "T8 formal deferral documentation"
    impact: "Clear decision trail, prevents revisiting"

# Dependencies & Execution Order
execution_order:
  - phase: phase_0_setup
    sequence: [T0, T1, T2]
    blocking: true
    critical: true
    description: "Must complete multi-run baseline before any fixes"

  - phase: phase_1_mcp_server
    sequence: [T3, T4]
    depends_on: phase_0_setup
    blocking: false
    critical: true
    can_parallelize_with: [phase_2_flaky_tests]
    description: "T3 investigation, then T4 fix (sequential)"

  - phase: phase_2_flaky_tests
    sequence: [T5, T6, T7]
    depends_on: phase_0_setup
    blocking: false
    can_parallelize_with: [phase_1_mcp_server]
    conditional: "T6 and T7 only if T2 shows flakiness"
    description: "T5 and T7 analysis can run in parallel, fixes are conditional"

  - phase: phase_3_category_a
    sequence: [T8]
    depends_on: [phase_1_mcp_server, phase_2_flaky_tests]
    blocking: false
    description: "Documentation task, low priority"

  - phase: phase_4_validation
    sequence: [T9, T10]
    depends_on: [phase_1_mcp_server, phase_2_flaky_tests, phase_3_category_a]
    blocking: false
    critical: true
    description: "T10 can partially overlap with T9"

# Future Work (Post-Sprint 33)
