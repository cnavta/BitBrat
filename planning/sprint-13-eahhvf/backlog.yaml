      3. **Feature Flag Integration**: ENABLE_CONFIG_REGISTRY flag (default: false) enables gradual rollout.
         - Flag disabled → Uses custom builders (current production behavior)
         - Flag enabled → Uses TranslationEngine + YAML configs

