  - id: DM-008
    epic: EP-02
    title: "Enhance IntegrationBit Egress Routing"
    description: |
      Update processEgress() to route based on event type.
    priority: P0
    status: completed
    estimatedEffort: 6h
    assignee: null
    dependencies: [DM-002, DM-004]
    deliverables:
      - src/common/integration-bit.ts (updated)
      - src/common/integration-bit.test.ts (updated)
    acceptanceCriteria:
      - Checks event.type to determine routing
      - Routes dm.message.v1 to sendDM()
      - Routes chat.message.v1 to sendText()
      - Falls back to sendText() for unknown types (backward compat)
      - Logs routing decisions
      - 90%+ test coverage
    implementation: |
      private async processEgress(event: InternalEventV2): Promise<void> {
        const platform = event.egress?.connector;
        const connector = this.connectorManager.getConnectorByPlatform(platform);

        // Determine routing based on event type
        if (event.type === 'dm.message.v1') {
          if ('sendDM' in connector && typeof connector.sendDM === 'function') {
            const userId = event.identity?.external?.id;
            const text = extractEgressTextFromEvent(event);
            await connector.sendDM(text, userId);
            this.logger.info('egress.dm.sent', { platform, userId });
            return;
          }
        }

        // Default to sendText (backward compatible)
        const text = extractEgressTextFromEvent(event);
        const channel = event.egress?.channel || event.ingress?.channel;
        await connector.sendText(text, channel);
        this.logger.info('egress.text.sent', { platform, channel });
      }

