         - Feature flag ENABLE_CONFIG_REGISTRY controls activation
         - Graceful fallback to TwitchEnvelopeBuilder on errors

      **Key Technical Decisions:**

      1. **Async Builder Support**: TranslationEngine.translateInbound() is async, but existing custom builders are sync.
