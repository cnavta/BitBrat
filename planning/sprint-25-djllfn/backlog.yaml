  - id: T1
    title: Fix missing infrastructure services in agent-dev compose generation
    priority: P0
    status: pending
    category: infrastructure
    estimatedHours: 4
    blockedBy: []
    blocks: [T2, T3, T4, T5, T6, T7, T8, T9]
    issue: "#1 - Missing Infrastructure Services"
    rootCause: "CONFIRMED - Missing contextName parameter in scaffoldEnvironment() line 521"
    description: |
      ROOT CAUSE IDENTIFIED: scaffoldEnvironment() calls getRequiredInfrastructure()
      WITHOUT passing contextName parameter, causing it to default to 'local' context.
      InfrastructureRegistry filters by scope, doesn't match agent-dev contexts.

      The fix is trivial: Add one parameter to line 521.

    acceptanceCriteria:
      - Primary fix: Add contextName parameter to getRequiredInfrastructure() call
      - Secondary fix: Update InfrastructureRegistry scope matching to treat agent-dev as local-scoped
      - Generated agent-dev compose files include nats service with health check
      - Generated agent-dev compose files include redis service with health check
      - Generated agent-dev compose files include postgres service with health check
      - All infrastructure services use correct network configuration
      - Volume definitions created for persistent data
      - Docker Compose validation passes (docker compose config)
      - Agent-dev environment starts successfully (all services healthy)

    technicalApproach:
      PRIMARY FIX (1 line):
      - File: tools/brat/src/commands/context/create.ts:521
      - Change: getRequiredInfrastructure(repoRoot, activeServices)
      - To: getRequiredInfrastructure(repoRoot, activeServices, contextName)

      SECONDARY FIX (scope matching):
      - File: tools/brat/src/infrastructure/registry.ts
      - Update getRequiredInfrastructure() to treat agent-dev-* contexts as local-scoped
      - Add logic: const effectiveContext = context.startsWith('agent-dev-') ? 'local' : context
      - Use effectiveContext when filtering by scope

      VALIDATION:
      - Test with fresh agent-dev context provision
      - Verify generated compose includes infrastructure
      - Verify Docker Compose validation passes
      - Verify services start and reach healthy state

    testPlan:
      - Unit test: getRequiredInfrastructure() with agent-dev context returns nats/redis/postgres
      - Integration test: scaffoldEnvironment() generates complete compose file
      - E2E test: Full agent-dev lifecycle (provision → start → validate → destroy)
      - Manual verification: docker compose config passes
      - Manual verification: agent_dev.start() succeeds

    files:
      PRIMARY:
      - tools/brat/src/commands/context/create.ts (line 521 - add contextName parameter)

      SECONDARY:
      - tools/brat/src/infrastructure/registry.ts (scope matching logic)

      TESTING:
      - tools/brat/src/context/__tests__/agent-dev-compose-generation.test.ts (new)
      - tools/brat/src/infrastructure/__tests__/registry-scope-matching.test.ts (new)

    references:
      - Code analysis: planning/sprint-25-djllfn/code-analysis.md
      - Working example: infrastructure/docker-compose/docker-compose.local.yaml lines 13-93
      - Bug location: tools/brat/src/commands/context/create.ts:521
      - Function signature: tools/brat/src/context/parse-dependencies.ts:135-139

