# === RISK ASSESSMENT ===

risks:
  - risk: Compose generation code is more complex than expected
    impact: high
    probability: medium
    mitigation: Start with minimal change (copy local infrastructure), iterate if needed

  - risk: Infrastructure services have environment-specific configuration
    impact: medium
    probability: low
    mitigation: Use same config as local context, document any differences

  - risk: Testing reveals additional agent-dev issues
    impact: medium
    probability: high
    mitigation: Prioritize blockers, defer nice-to-haves to backlog

