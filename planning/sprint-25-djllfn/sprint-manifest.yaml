notes: |
  Sprint initialized via MCP start-sprint tool.

  PRIMARY GOAL ACHIEVED: Agent-dev environments now include infrastructure
  services (NATS, Redis, PostgreSQL) and can start successfully.

  Root cause: scaffoldEnvironment() was calling getRequiredInfrastructure()
  without contextName parameter, causing it to default to 'local' context
  and fail to resolve infrastructure for agent-dev contexts.

  Fixes implemented:
  1. Added contextName parameter to getRequiredInfrastructure() call
  2. Agent-dev contexts now inherit infrastructure from 'local' context
  3. Added infrastructure.provider to ephemeral context configuration

  Validation: Full runtime testing confirmed infrastructure services start
  and reach healthy state. Discovered two follow-on issues (JetStream config
  and environment variables) that are documented for next sprint.

  Impact: Unblocks agent-dev usage for testing, enables sprint protocol
  compliance, validates CLAUDE.md guidance to test in agent-dev.
